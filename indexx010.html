    'ch13': () => chapterHome('Maladies vasculaires rétiniennes','13','Pathologies liées à l\'ischémie ou aux anomalies vasculaires de la rétine. La rétinopathie diabétique est la 1re cause de cécité chez les adultes actifs dans les pays développés.',
      ['Rétinopathie diabétique','Occlusion veineuse rétinienne','Maladie occlusive artérielle','Rétinopathie de la prématurité','Macroanévrisme & Télangiectasies','Autres rétinopathies']),

    'ch13-rd': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Rétinopathie diabétique</div>
<div class="page-subtitle">Chapitre 13 · Pages 496–513</div>

<div class="section-title">Introduction</div>
<p class="body-text">La rétinopathie diabétique (RD) est la 1re cause de cécité chez les adultes actifs dans les pays développés. Après 20 ans de diabète, presque tous les patients DT1 et >60 % des DT2 présentent une rétinopathie. La durée du diabète est le principal facteur de risque.</p>

<div class="retenir"><strong>À retenir</strong>Un contrôle glycémique intensif réduit l'incidence de la RD de 76 % et sa progression de 54 % (DCCT). Un contrôle tensionnel strict réduit également la progression.</div>

<div class="section-title">Physiopathologie</div>
<p class="body-text">La microangiopathie diabétique touche en premier lieu les capillaires rétiniens : perte des péricytes → affaiblissement de la paroi → microanévrismes → augmentation de la perméabilité → exsudats durs → ischémie → néovascularisation (VEGF).</p>

<div class="section-title">Classification (ETDRS simplifiée)</div>
<table class="kanski-table">
  <tr><th>Stade</th><th>Définition</th><th>Suivi</th></tr>
  <tr><td><span class="tag tag-green">Pas de RD</span></td><td>Examen normal</td><td>Annuel</td></tr>
  <tr><td><span class="tag tag-blue">RDNP légère</span></td><td>Microanévrismes seulement</td><td>Annuel</td></tr>
  <tr><td><span class="tag tag-blue">RDNP modérée</span></td><td>Microanévrismes + autres lésions mais &lt; RDNP sévère</td><td>6 mois</td></tr>
  <tr><td><span class="tag tag-gold">RDNP sévère (4-2-1)</span></td><td>≥20 H/Exsudats par quadrant, ou tortuosités veineuses ×2 quadrants, ou anomalies AMIR ×1 quadrant</td><td>3–4 mois</td></tr>
  <tr><td><span class="tag tag-red">RDP</span></td><td>Néovaisseaux (prépapillaires ou prérétiniens)</td><td>1–3 mois + traitement</td></tr>
  <tr><td><span class="tag tag-red">RDP à haut risque</span></td><td>NVD ≥ 1/4 surface papillaire, ou toute NV + hémorragie pré-rétinienne/vitréenne</td><td>Traitement urgent</td></tr>
</table>

<div class="subsection-title">Règle 4-2-1 (RDNP sévère)</div>
<div class="badge-list">
  <span class="badge red">4 : ≥20 hémorragies/microanévrismes par quadrant</span>
  <span class="badge red">2 : tortuosités veineuses dans ≥2 quadrants</span>
  <span class="badge red">1 : anomalies AMIR dans ≥1 quadrant</span>
</div>

<div class="section-title">Signes cliniques</div>
<div class="card-grid">
  <div class="card"><h4>Lésions précoces</h4><ul>
    <li>Microanévrismes (ponctuations rouges) — premiers signes</li>
    <li>Hémorragies intrarétiniennes (rondes « dot » ou flammèches)</li>
    <li>Exsudats durs (dépôts lipidiques jaunâtres nets)</li>
    <li>Exsudats mous = nodules cotonneux (ischémie de la couche des fibres nerveuses)</li>
  </ul></div>
  <div class="card blue"><h4>Signes d'ischémie</h4><ul>
    <li>Anomalies microvasculaires intrarétiniennes (AMIR) : néovaisseaux intrarétiniens</li>
    <li>Tortuosités veineuses, dilatations veineuses en chapelet</li>
    <li>Zones de non-perfusion (AFG : hypo-fluorescentes)</li>
  </ul></div>
  <div class="card red"><h4>RDP</h4><ul>
    <li>Néovaisseaux prépapillaires (NVD) — plus graves</li>
    <li>Néovaisseaux pré-rétiniens (NVE)</li>
    <li>Hémorragie pré-rétinienne ou intravitréenne</li>
    <li>Fibrose (traction vitréorétinienne)</li>
    <li>DR tractionnel, mixte ou rhegmatogène</li>
    <li>Rubeosis iridis → glaucome néovasculaire</li>
  </ul></div>
</div>

<div class="section-title">Œdème maculaire diabétique (OMD)</div>
<p class="body-text">L'OMD est la principale cause de baisse de vision dans le diabète (peut survenir à n'importe quel stade de RD). Défini comme un épaississement rétinien au sein de 1 DD de la fovéa.</p>

<div class="info-box"><strong>OMD à centre impliqué (CME)</strong>Épaississement avec atteinte de la fovéa centrale sur l'OCT → traitement anti-VEGF en 1re intention.</div>

<div class="section-title">Traitement</div>
<div class="subsection-title">Mesures systémiques</div>
<div class="badge-list">
  <span class="badge gold">HbA1c ≤ 7 % (cible individuelle)</span>
  <span class="badge gold">PA ≤ 130/80 mmHg</span>
  <span class="badge gold">Contrôle lipidique</span>
  <span class="badge">Arrêt tabac</span>
</div>

<div class="subsection-title">Traitements oculaires</div>
<table class="kanski-table">
  <tr><th>Indication</th><th>Traitement de référence</th><th>Alternatives</th></tr>
  <tr><td>OMD à centre impliqué</td><td>Anti-VEGF intravitréen (ranibizumab, aflibercept, bevacizumab)</td><td>Implant dexaméthasone (Ozurdex), laser focal si non centre</td></tr>
  <tr><td>RDP / RDNP sévère</td><td>Photocoagulation panrétinienne (PPR)</td><td>Anti-VEGF IVT en adjuvant</td></tr>
  <tr><td>Hémorragie vitréenne</td><td>Vitrectomie si persistante &gt;3–6 mois</td><td>Observation + PPR au laser</td></tr>
  <tr><td>DR tractionnel menaçant la macula</td><td>Vitrectomie (pars plana)</td><td></td></tr>
  <tr><td>Glaucome néovasculaire</td><td>Anti-VEGF IVT + PPR urgente ± filtrante</td><td></td></tr>
</table>`,

    'ch13-ovc': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Occlusion veineuse rétinienne</div>
<div class="page-subtitle">Chapitre 13 · Pages 514–525</div>

<div class="section-title">Introduction & Facteurs de risque</div>
<p class="body-text">L'occlusion veineuse rétinienne (OVR) est la 2e pathologie vasculaire rétinienne après la RD. Incidence ≈ 1/1000/an. Les veines rétiniennes partagent la même adventice que les artères aux croisements artério-veineux → compression, turbulences → thrombose.</p>

<div class="card-grid">
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li>HTA (le plus important)</li>
    <li>Glaucome / HTO (OVCR)</li>
    <li>Artériosclérose</li>
    <li>Diabète</li>
    <li>Hyperlipidémie</li>
    <li>Hyperviscosité (polyglobulie, gammapathie)</li>
    <li>Thrombophilie (facteur V Leiden, anti-phospholipides)</li>
    <li>Contraception orale</li>
  </ul></div>
</div>

<div class="subsection-title">Bilan étiologique systémique</div>
<div class="badge-list">
  <span class="badge">PA (bilat)</span><span class="badge">Glycémie/HbA1c</span><span class="badge">Bilan lipidique</span>
  <span class="badge">NFS + frottis</span><span class="badge">Coagulation + D-dimères</span>
  <span class="badge accent">Bilan thrombophilie si &lt;50 ans ou bilatéral</span>
  <span class="badge">PIO + gonioscopie (OVCR)</span>
</div>

<div class="section-title">Occlusion de branche veineuse rétinienne (OBVR)</div>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>BAV variable selon atteinte maculaire</li>
    <li>Hémorragies intrarétiniennes en secteur (quadrant)</li>
    <li>Exsudats mous, œdème</li>
    <li>Tortuosités veineuses dans le secteur</li>
    <li>Site d'obstruction : croisement AV +++</li>
  </ul></div>
  <div class="card green"><h4>Traitement</h4><ul>
    <li>OMD : anti-VEGF IVT 1re ligne (SCORE, BRAVO)</li>
    <li>Laser maculaire focal en grille : 2e ligne si non répondeur</li>
    <li>Implant dexaméthasone (Ozurdex) : alternative</li>
    <li>Néovaisseaux (5–15 % des cas) : laser sectoriel</li>
  </ul></div>
</div>

<div class="section-title">Occlusion de veine centrale de la rétine (OVCR)</div>
<div class="subsection-title">Formes cliniques</div>
<table class="kanski-table">
  <tr><th>Forme</th><th>Critères</th><th>Pronostic</th></tr>
  <tr><td><strong>Non ischémique</strong></td><td>AFG : non perfusion &lt;10 DA. Acuité ≥ 6/60. Rapport A/V ERG normal. Champ visuel peu altéré</td><td>Meilleur. ~33 % résolution spontanée. 10–15 % évolution vers ischémique à 3 ans</td></tr>
  <tr><td><strong>Ischémique</strong></td><td>AFG : non perfusion ≥10 DA. Acuité ≤ 6/60. DPAR. ERG altéré. Champ visuel altéré</td><td>Mauvais. Risque rubeosis 35–45 % à 3 mois. Glaucome néovasculaire 50 %</td></tr>
</table>

<div class="card-grid">
  <div class="card"><h4>Signes communs</h4><ul>
    <li>Hémorragies en flammèches sur les 4 quadrants (aspect « blood and thunder »)</li>
    <li>Dilatation et tortuosités veineuses diffuses</li>
    <li>Œdème papillaire</li>
    <li>Exsudats mous</li>
    <li>OMC fréquent (cause de BAV)</li>
  </ul></div>
  <div class="card blue"><h4>Traitement OVCR</h4><ul>
    <li>OMC : anti-VEGF IVT 1re ligne (CRUISE, COPERNICUS)</li>
    <li>Implant dexaméthasone : OVCR récente, efficacité démontrée</li>
    <li>OVCR ischémique : PPR urgente dès rubeosis ou NV détectés</li>
    <li>Surveillance mensuelle 6 premiers mois (risque rubeosis)</li>
  </ul></div>
</div>`,

    'ch13-oar': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Maladie occlusive artérielle rétinienne</div>
<div class="page-subtitle">Chapitre 13 · Pages 525–531</div>

<div class="alert"><strong>Urgence vasculaire absolue</strong>L'OACR est un AVC rétinien — l'artère centrale de la rétine tolère &lt;90–100 min d'ischémie avant dommages irréversibles. Bilan vasculaire et neurologique en urgence.</div>

<div class="section-title">Occlusion de l'artère centrale de la rétine (OACR)</div>
<div class="card-grid">
  <div class="card red"><h4>Étiologies</h4><ul>
    <li>Embolie cardiaque (fibrillation atriale, valvulopathie) +++</li>
    <li>Embolie carotidienne (plaque athéromateuse)</li>
    <li>Artérite à cellules géantes (Horton) — toujours y penser chez les &gt;50 ans</li>
    <li>Coagulopathie</li>
    <li>Spasme artériel (migraine, rarement)</li>
  </ul></div>
  <div class="card blue"><h4>Clinique</h4><ul>
    <li>BAV brutale, unilatérale, indolore, profonde</li>
    <li>Rétine œdémateuse blanc-laiteux</li>
    <li>Tache rouge cerise à la macula (choroïde visible × fovéa sans cellules ganglionnaires)</li>
    <li>Artères rétiniennes grêles, « fil d'argent »</li>
    <li>DPAR marqué</li>
    <li>Artère cilio-rétinienne présente : peut préserver l'acuité centrale</li>
  </ul></div>
</div>

<div class="subsection-title">Traitement d'urgence (efficacité limitée)</div>
<div class="protocol">
  <h4>À réaliser dans les 4–6 heures idéalement</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Massage oculaire</strong> : compressions-décompressions du globe pour fragmenter l'embol</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Acétazolamide IV</strong> 500 mg + paracentèse de chambre antérieure : baisse de la PIO pour améliorer la perfusion</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Inhalation CO2/O2</strong> : vasodilatation artérielle rétinienne (controversé)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Thrombolyse IA</strong> (rTPA) : résultats décevants dans les études, non recommandé en routine</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Orientation en urgence vers neurologue/interniste pour bilan vasculaire complet</div></div>
</div>

<div class="subsection-title">Bilan systémique urgent (risque d'AVC)</div>
<div class="badge-list">
  <span class="badge red">Écho-Doppler des carotides</span>
  <span class="badge red">ECG + Holter</span>
  <span class="badge red">Échocardiographie</span>
  <span class="badge red">IRM cérébrale</span>
  <span class="badge">NFS + coagulation</span>
  <span class="badge gold">VS + CRP si Horton suspecté</span>
</div>`,

    'ch14': () => chapterHome('Pathologies maculaires acquises','14','La macula est le siège des photorécepteurs les plus denses, assurant l\'acuité visuelle centrale et la vision des couleurs. La DMLA est la 1re cause de malvoyance chez les >50 ans.',
      ['Évaluation & Imagerie','DMLA','Choriorétinopathie séreuse centrale','Anomalies interface vitréomaculaire','Œdème maculaire','Myopie dégénérative']),

    'ch14-eval': () => `
<div class="page-title"><em>Pathologies maculaires</em> — Évaluation & Imagerie</div>
<div class="page-subtitle">Chapitre 14 · Pages 556–572</div>

<div class="section-title">Symptômes maculaires</div>
<div class="card-grid">
  <div class="card"><h4>Symptômes fonctionnels</h4><ul>
    <li><strong>Métamorphopsies</strong> : déformation des lignes droites (grille d'Amsler)</li>
    <li><strong>Scotome central</strong> : tache dans le champ central</li>
    <li>Baisse de l'acuité visuelle (variable selon étiologie)</li>
    <li>Micropopsie / macropopsie</li>
    <li>Dyschromasie</li>
    <li>Photostressen : récupération prolongée après exposition lumineuse</li>
  </ul></div>
</div>

<div class="section-title">Imagerie maculaire</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Angiographie à la fluorescéine (AFG) <span class="toggle">+</span></div>
  <div class="path-block-body open">
    <div class="two-col">
    <div>
    <div class="card blue"><h4>Phases angiographiques</h4><ul>
      <li>Artérielle précoce (9–11 s)</li>
      <li>Artério-veineuse (11–13 s)</li>
      <li>Veineuse (13–60 s)</li>
      <li>Temps tardif (3–10 min) : fuites</li>
    </ul></div>
    </div>
    <div>
    <div class="card"><h4>Hyperfluorescence — types</h4><ul>
      <li><strong>Fuite</strong> : NVC, télangiectasies, OMC</li>
      <li><strong>Pool</strong> : DEP, CSC</li>
      <li><strong>Effet fenêtre</strong> : atrophie EPR</li>
      <li><strong>Teinture</strong> : drusen, cicatrices</li>
    </ul></div>
    <div class="card red" style="margin-top:12px"><h4>Hypofluorescence — types</h4><ul>
      <li><strong>Masquage</strong> : hémorragie, pigment</li>
      <li><strong>Défect perfusion</strong> : ischémie</li>
    </ul></div>
    </div>
    </div>
  </div>
</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Tomographie par cohérence optique (OCT) <span class="toggle">+</span></div>
  <div class="path-block-body open">
    <p class="body-text" style="margin-top:8px">Imagerie cross-sectionnelle haute résolution de la rétine, non invasive, standard de soins en pathologie maculaire.</p>
    <table class="kanski-table">
      <tr><th>Structure</th><th>Aspect normal/pathologique</th></tr>
      <tr><td>EPR</td><td>Ligne hyperréflective externe — Décollement EPR si espace entre EPR et Bruch</td></tr>
      <tr><td>Photorécepteurs</td><td>Zone IS/OS (ellipsoïde) — altérée dans atrophie, toxiques, trauma</td></tr>
      <tr><td>Rétine externe</td><td>Nécrose si drusen sous-rétiniens, migration EPR</td></tr>
      <tr><td>Espace sous-rétinien</td><td>Fluide = DSR : DMLA néovasculaire, CSC</td></tr>
      <tr><td>Rétine interne</td><td>Fluide intra-rétinien (logettes) = OMC</td></tr>
      <tr><td>Interface VR</td><td>MER, TVM, trou maculaire</td></tr>
    </table>
  </div>
</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">OCT-Angiographie (OCT-A) <span class="toggle">+</span></div>
  <div class="path-block-body">
    <p class="body-text" style="margin-top:8px">Technique non invasive analysant le flux vasculaire rétinien par algorithme de détection du mouvement des érythrocytes (OCTA). Remplace partiellement l'AFG et l'ICG dans certaines indications.</p>
    <div class="card-grid">
      <div class="card green"><h4>Avantages</h4><ul><li>Non invasif, pas d'injection</li><li>Analyse couche par couche</li><li>Détection NVC de type 1 (sous-RPE)</li><li>Surveillance DMLA néovasculaire</li></ul></div>
      <div class="card red"><h4>Limites</h4><ul><li>Pas de visualisation des fuites</li><li>Artéfacts si mouvements</li><li>Pas de visualisation du pool</li></ul></div>
    </div>
  </div>
</div>`,

    'ch14-dmla': () => `
<div class="page-title"><em>Pathologies maculaires</em> — DMLA</div>
<div class="page-subtitle">Chapitre 14 · Pages 572–589</div>

<div class="retenir"><strong>À retenir</strong>La DMLA est la 1re cause de malvoyance chez les >50 ans dans les pays développés. Deux formes : atrophique (sèche, 85 %) et néovasculaire (humide, 15 % mais 90 % de la cécité légale).</div>

<div class="section-title">Introduction & Facteurs de risque</div>
<div class="card-grid">
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li><strong>Âge</strong> (principal) : prévalence ↑ fortement après 65 ans</li>
    <li><strong>Tabagisme</strong> (×3–4)</li>
    <li>Génétique : CFH, ARMS2/HTRA1 (risk alleles)</li>
    <li>Race blanche</li>
    <li>Antécédents familiaux</li>
    <li>HTA, obésité, maladies cardiovasculaires</li>
    <li>Exposition UV importante</li>
    <li>Carence en antioxydants (lut, zéaxanthine)</li>
  </ul></div>
  <div class="card"><h4>Physiopathologie</h4><ul>
    <li>Dysfonction et déclin de l'EPR</li>
    <li>Accumulation de lipofuscine</li>
    <li>Formation de drusen (dépôts sous-rétiniens entre EPR et membrane de Bruch)</li>
    <li>Inflammation chronique locale</li>
    <li>Dans DMLA humide : VEGF → néovascularisation choroïdienne (NVC)</li>
  </ul></div>
</div>

<div class="section-title">Drusen</div>
<table class="kanski-table">
  <tr><th>Type</th><th>Aspect</th><th>Signification</th></tr>
  <tr><td>Durs</td><td>Petits, ronds, bords nets</td><td>Dépôts focaux sous EPR — risque faible</td></tr>
  <tr><td>Mous</td><td>Grands, bords flous, confluents</td><td>Risque DMLA ↑↑</td></tr>
  <tr><td>Semi-soft</td><td>Taille intermédiaire</td><td>Risque intermédiaire</td></tr>
  <tr><td>Drusen réticulaires (pseudo-drusen)</td><td>Sous-rétiniens, en réseau</td><td>Risque DMLA avancée +++</td></tr>
</table>

<div class="section-title">DMLA atrophique (sèche)</div>
<div class="info-box"><strong>Évolution</strong>Progressive sur des années. Atrophie géographique de l'EPR et des photorécepteurs. Pas de traitement curatif validé à ce jour.</div>

<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Évolution lente, BAV progressive</li>
    <li>Plages d'atrophie géographique (pale, bien délimitées)</li>
    <li>Autofluorescence : hypoAF dans les zones atrophiques</li>
    <li>OCT : effacement de l'EPR, amincissement de la rétine externe</li>
  </ul></div>
  <div class="card gold"><h4>Supplémentation AREDS2</h4><ul>
    <li>Indiquée : drusen larges ou DMLA intermédiaire/avancée dans l'œil adelphe</li>
    <li>Formule AREDS2 : Vitamine C 500 mg + E 400 UI + Lutéine/Zéaxanthine 10/2 mg + Zinc 80 mg + Cuivre 2 mg</li>
    <li>↓ progression vers DMLA avancée de 25 % sur 5 ans</li>
  </ul></div>
</div>

<div class="section-title">DMLA néovasculaire (humide)</div>
<div class="subsection-title">Types de NVC</div>
<table class="kanski-table">
  <tr><th>Type</th><th>Localisation</th><th>AFG</th><th>Aspect OCT</th></tr>
  <tr><td><strong>Type 1</strong></td><td>Sous l'EPR</td><td>Occulte (tardive)</td><td>DEP fibro-vasculaire, peu de fluide sous-rétinien</td></tr>
  <tr><td><strong>Type 2</strong></td><td>Sous-rétinienne (entre EPR et photorécepteurs)</td><td>Classique (précoce)</td><td>Membrane hyperréflective sous-rétinienne, fluide sous-rétinien</td></tr>
  <tr><td><strong>Type 3</strong> (prolifération angiomateuse rétinienne — RAP)</td><td>Intrarétinienne</td><td>Anastomose choriorétinienne</td><td>Logettes kystiques, DEP, néovaisseaux hyperréflectifs</td></tr>
</table>

<div class="subsection-title">Symptômes et signes</div>
<div class="card-grid">
  <div class="card red"><h4>Symptômes d'alerte</h4><ul>
    <li>Métamorphopsies (déformations sur la grille d'Amsler)</li>
    <li>BAV rapide (jours à semaines)</li>
    <li>Scotome central paracentral</li>
  </ul></div>
  <div class="card"><h4>Signes au fond d'œil</h4><ul>
    <li>Membrane sub-rétinienne grisâtre</li>
    <li>Hémorragies sous-rétiniennes ou sous-EPR</li>
    <li>Exsudats durs circinnés</li>
    <li>DEP séreux ou hémorragique</li>
    <li>Liquide sous-rétinien</li>
  </ul></div>
</div>

<div class="section-title">Traitement de la DMLA néovasculaire</div>
<div class="retenir"><strong>À retenir</strong>Les injections intravitréennes d'anti-VEGF ont révolutionné le pronostic de la DMLA humide. Le traitement précoce est essentiel : chaque semaine de délai peut entraîner une perte irréversible de vision.</div>

<div class="protocol">
  <h4>Anti-VEGF (traitement de référence)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Ranibizumab (Lucentis)</strong> — AMM DMLA, 0,5 mg IVT</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Aflibercept (Eylea)</strong> — AMM DMLA, 2 mg IVT. Demi-vie plus longue</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Brolucizumab (Beovu)</strong> — 6 mg IVT, espacement jusqu'à 12 semaines. Risque vasculite (surveillance)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Faricimab (Vabysmo)</strong> — bispécifique anti-VEGF+anti-ANG-2. Nouvelles AMM</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Protocole initiation : 3 injections mensuelles consécutives (charge), puis suivi selon schéma PRN, T&E, ou fixe</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance OCT mensuelle (activité de la NVC : fluide sous-rétinien, DEP, épaisseur)</div></div>
</div>`,

    'ch14-csc': () => `
<div class="page-title"><em>Pathologies maculaires</em> — Choriorétinopathie séreuse centrale</div>
<div class="page-subtitle">Chapitre 14 · Pages 597–601</div>

<div class="section-title">Introduction</div>
<p class="body-text">La CSC (Central Serous Chorioretinopathy) est caractérisée par un décollement séreux de la rétine neurosensorielle avec/sans décollement de l'EPR, secondaire à une augmentation de la perméabilité choroïdienne. Touche préférentiellement les hommes jeunes (30–50 ans), souvent associée à un profil de personnalité de type A, stress, corticoïdes exogènes.</p>

<div class="card-grid">
  <div class="card"><h4>Épidémiologie</h4><ul>
    <li>Homme > femme (6:1)</li>
    <li>Age 30–50 ans</li>
    <li>Profil psychologique type A, stress</li>
    <li>Corticoïdes (systémiques, inhalés, topiques) : facteur déclenchant majeur</li>
    <li>Cushing, grossesse (3e trimestre)</li>
    <li>Unilatéral le plus souvent, bilatéral dans 10–40 %</li>
  </ul></div>
  <div class="card blue"><h4>Symptômes</h4><ul>
    <li>BAV légère à modérée</li>
    <li>Métamorphopsies</li>
    <li>Micropopsie (rétine soulevée)</li>
    <li>Scotome paracentral</li>
    <li>Photophobie légère</li>
    <li>Temps de récupération photostress augmenté</li>
  </ul></div>
</div>

<div class="section-title">Formes cliniques</div>
<table class="kanski-table">
  <tr><th>Forme</th><th>Durée</th><th>Évolution</th></tr>
  <tr><td><strong>Aiguë</strong></td><td>&lt;3–4 mois</td><td>Résolution spontanée ~80–90 %. Récidives fréquentes (50 %)</td></tr>
  <tr><td><strong>Chronique</strong></td><td>&gt;3–4 mois</td><td>Dégâts irréversibles EPR/photorécepteurs. Risque NVC secondaire</td></tr>
</table>

<div class="section-title">Examens complémentaires</div>
<div class="card-grid">
  <div class="card"><h4>OCT</h4><ul>
    <li>Décollement séreux de la rétine neurosensorielle (DSR)</li>
    <li>DEP sous-jacent souvent présent</li>
    <li>Atrophie EPR dans les formes chroniques</li>
  </ul></div>
  <div class="card"><h4>AFG</h4><ul>
    <li>Point de fuite unique (forme aiguë) : aspect en « cheminée » ou en « champignon »</li>
    <li>Leaks multiples (forme chronique)</li>
    <li>Utile pour guider le laser</li>
  </ul></div>
  <div class="card blue"><h4>ICG</h4><ul>
    <li>Hyperfluorescence choroïdienne diffuse (plaques)</li>
    <li>Choroïde épaissie (pachychoroïde)</li>
    <li>Mieux que AFG pour évaluer l'extension</li>
  </ul></div>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Approche thérapeutique</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Forme aiguë</strong> : observation initiale 3 mois. Arrêt des corticoïdes si possible. Réduction du stress</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Point de fuite extrafovéolaire</strong> : photocoagulation laser focale sur le point de fuite (accélère la résorption)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Point de fuite juxtafovéolaire ou forme chronique</strong> : PDT (thérapie photodynamique) à demi-dose = traitement de référence actuel</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Éplérénone / spironolactone</strong> (antagonistes minéralocorticoïdes) : traitement médical de 2e intention, efficacité démontrée dans quelques études</div></div>
</div>`,

    'ch19': () => chapterHome('Neuro-ophtalmologie','19','Interface entre neurologie et ophtalmologie. Inclut les affections du nerf optique, des pupilles, du chiasma, des voies visuelles, et des nerfs oculomoteurs.',
      ['Neuro-imagerie','Nerf optique','Papilloœdème','Pupilles','Chiasma','Voies rétrochiasmiques','Nerfs moteurs oculaires','Nystagmus','Neurofibromatose','Migraine']),

    'ch19-no': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Nerf optique</div>
<div class="page-subtitle">Chapitre 19 · Pages 751–779</div>

<div class="section-title">Anatomie</div>
<p class="body-text">Le nerf optique contient environ 1,2 million d'axones des cellules ganglionnaires de la rétine. Il mesure 50 mm de long : intra-oculaire (1 mm), intra-orbitaire (25 mm), intra-canaliculaire (9 mm), intra-crânien (16 mm). La myélinisation commence derrière la lame criblée (la rétine est non myélinisée, sauf en cas de fibres myélinisées congénitales).</p>

<div class="section-title">Signes de dysfonctionnement du nerf optique</div>
<div class="card-grid">
  <div class="card blue"><h4>Signes subjectifs</h4><ul>
    <li>Baisse d'AV (variable selon atteinte)</li>
    <li>Altération de la vision des couleurs (dyschromatopsie, test Ishihara, Farnsworth)</li>
    <li>Réduction de la brillance lumineuse</li>
    <li>Phénomène de Uhthoff : aggravation à la chaleur (neuropathie démyélinisante)</li>
    <li>Phosphènes au mouvement des yeux (névrite optique)</li>
  </ul></div>
  <div class="card"><h4>Signes objectifs</h4><ul>
    <li><strong>DPAR</strong> (déficit pupillaire afférent relatif) : test de la lampe de Swinging — signe clé de dysfonction du NO unilatérale</li>
    <li>Altérations du champ visuel</li>
    <li>Papille anormale (œdème, pâleur)</li>
    <li>PEV (potentiels évoqués visuels) altérés</li>
    <li>OCT RNFL aminci</li>
  </ul></div>
</div>

<div class="section-title">Névrite optique</div>
<div class="subsection-title">Névrite optique démyélinisante</div>
<div class="info-box"><strong>Association SEP</strong>La névrite optique (NO) rétrobulbaire est la manifestation inaugurale de la SEP dans 20–25 % des cas. Risque de SEP à 15 ans : ~75 % si IRM anormale à la présentation (étude ONTT).</div>

<div class="card-grid">
  <div class="card"><h4>Clinique typique</h4><ul>
    <li>Femme jeune (20–45 ans)</li>
    <li>BAV unilatérale, progressive sur quelques jours</li>
    <li>Douleur rétro-orbitaire aggravée aux mouvements oculaires (92 %)</li>
    <li>Dyschromatopsie (test de brillance rouge)</li>
    <li>DPAR homolatéral</li>
    <li>Papille normale (NOR) dans 65 % (rétrobulbaire) ou œdémateuse dans 35 %</li>
    <li>Altération CV : scotome central ou cæcocentral</li>
  </ul></div>
  <div class="card green"><h4>Évolution</h4><ul>
    <li>Récupération spontanée dans 85–95 % des cas</li>
    <li>AV ≥ 6/12 dans la grande majorité à 1 an</li>
    <li>La douleur est souvent le premier symptôme à régresser</li>
    <li>Atrophie optique possible même après bonne récupération</li>
    <li>RNFL aminci à l'OCT séquellaire</li>
  </ul></div>
</div>

<div class="subsection-title">Traitement (ONTT)</div>
<div class="protocol">
  <h4>Corticoïdes IV (pas d'effet sur le pronostic visuel à 1 an)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Méthylprednisolone IV 1 g/j × 3 jours</strong> puis relais oral : accélère la récupération de 2–3 semaines, mais ne modifie pas le pronostic visuel final</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Indication : retentissement fonctionnel important, profession, œil unique fonctionnel</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Prednisone orale seule (1 mg/kg/j) : augmente le risque de récidive — ne pas utiliser !</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Traitement de fond SEP si IRM anormale : discuter avec neurologue (DMT : interférons, acétate de glatiramère, natalizumab…)</div></div>
</div>

<div class="divider"></div>
<div class="section-title">Neuropathie optique ischémique antérieure (NOIA)</div>
<div class="subsection-title">NOIA non artéritique (NOIAN)</div>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>BAV brutale, unilatérale, indolore (matin au réveil)</li>
    <li>Age >55 ans, terrain vasculaire</li>
    <li>DPAR homolatéral</li>
    <li>Œdème papillaire unilatéral ± hémorragies péripapillaires</li>
    <li>Altération altitudinale inférieure du CV (classique)</li>
    <li>Petit cup/disc ratio («disc at risk») +++</li>
  </ul></div>
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li>HTA</li>
    <li>Diabète</li>
    <li>Dyslipidémie</li>
    <li>Artériosclérose</li>
    <li>Apnées du sommeil (SAOS) +++</li>
    <li>Hypotension nocturne</li>
    <li>Inhibiteurs PDE5 (sildenafil)</li>
    <li>Petite tête du NO (disc at risk)</li>
  </ul></div>
</div>

<div class="alert"><strong>Pas de traitement efficace prouvé</strong>Ni les corticoïdes, ni les vasodilatateurs n'ont démontré d'efficacité dans la NOIAN. Contrôle des FDR vasculaires. Risque œil adelphe 15–40 % à 5 ans (éviter «disc at risk» sans traitement).</div>

<div class="subsection-title">Artérite à cellules géantes (Maladie de Horton) — NOIA artéritique</div>
<div class="alert"><strong>Urgence médicale</strong>Toute NOIA chez un patient >50 ans doit faire éliminer une artérite de Horton. Traitement sans attendre confirmation biologique si suspicion forte — risque d'atteinte de l'œil adelphe dans les 24–72h.</div>

<div class="card-grid">
  <div class="card red"><h4>Critères diagnostiques ACR 2022 (score)</h4><ul>
    <li>Age ≥ 50 ans</li>
    <li>Céphalées temporales récentes</li>
    <li>Claudication de la mâchoire</li>
    <li>Douleur du cuir chevelu</li>
    <li>Artère temporale anormale (épaississement, douleur, diminution du pouls)</li>
    <li>VS &gt; 50 mm/h</li>
    <li>CRP élevée</li>
    <li>Biopsie positive : infiltrat mononucléé + cellules géantes</li>
  </ul></div>
  <div class="card blue"><h4>Bilan</h4><ul>
    <li>VS et CRP en urgence (VS généralement très ↑)</li>
    <li>NFS (anémie normochrome), plaquettes ↑</li>
    <li>Écho-Doppler des temporales (halo signe)</li>
    <li>Biopsie de l'artère temporale (gold standard) — NE PAS RETARDER LE TRAITEMENT</li>
    <li>TEP-scanner : atteinte des gros vaisseaux</li>
  </ul></div>
</div>

<div class="protocol">
  <h4>Traitement — Corticothérapie urgente</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>NOIA artéritique confirmée ou très suspectée</strong> : méthylprednisolone IV 1 g/j × 3 jours puis relais prednisone orale 1 mg/kg/j</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Décroissance progressive sur 12–24 mois selon VS/CRP</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Tocilizumab (anti-IL6) en cas de cortico-dépendance ou rechute</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Aspirine à faible dose : réduit le risque de manifestations ischémiques cérébrales</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance : VS/CRP mensuels initialement</div></div>
</div>`,

    'ch19-pupilles': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Pupilles</div>
<div class="page-subtitle">Chapitre 19 · Pages 779–785</div>

<div class="section-title">Anatomie des voies pupillaires</div>
<div class="two-col">
<div>
<div class="card blue"><h4>Voie afférente (réflexe photomoteur)</h4><ul>
  <li>Cônes et bâtonnets → cellules ganglionnaires (incluant ipRGC avec mélanopsine)</li>
  <li>Chiasma (50 % de décussation) → corps géniculé latéral</li>
  <li>Tectum mésencéphalique (noyaux prétectaux)</li>
  <li>Les deux noyaux d'Edinger-Westphal reçoivent des informations de CHAQUE œil</li>
</ul></div>
</div>
<div>
<div class="card"><h4>Voie efférente (parasympathique)</h4><ul>
  <li>Noyau d'Edinger-Westphal → ganglion ciliaire (III) → sphincter irien</li>
  <li>Voie sympathique (dilatateur) : hypothalamus → centre cilio-spinal de Budge (C8-T2) → ganglion stellaire → ganglion cervical supérieur → muscle de Müller (paupière) + dilatateur irien</li>
</ul></div>
</div>
</div>

<div class="section-title">DPAR (Déficit Pupillaire Afférent Relatif)</div>
<p class="body-text">Le DPAR (signe de Marcus Gunn) reflète une asymétrie de la conduction afférente entre les deux yeux. C'est un signe objectif essentiel de dysfonction du nerf optique ou de pathologie rétinienne étendue.</p>

<div class="info-box"><strong>Test de la lampe oscillante (Swinging Flashlight Test)</strong>Illuminer alternativement chaque œil en 2–3 secondes. Normal : les deux pupilles se dilatent légèrement à l'alternance (accommodation). DPAR : la pupille de l'œil atteint se dilate (paradoxalement) à l'illumination directe.</div>

<div class="card-grid">
  <div class="card red"><h4>Causes de DPAR</h4><ul>
    <li>Névrite optique (la grande cause)</li>
    <li>Glaucome unilatéral ou asymétrique</li>
    <li>NOIA</li>
    <li>Compression du nerf optique (méningiome, AV)</li>
    <li>Traumatisme du nerf optique</li>
    <li>Décollement de rétine étendu</li>
    <li>OVCR ischémique</li>
  </ul></div>
  <div class="card"><h4>Pas de DPAR dans</h4><ul>
    <li>Amblyopie (sauf sévère)</li>
    <li>Cataracte (même dense)</li>
    <li>Atteinte rétinienne localisée (sauf si extensive)</li>
    <li>Atteinte chiasmatique bilatérale (les deux voies afférentes également touchées)</li>
    <li>Atteinte post-chiasmatique</li>
  </ul></div>
</div>

<div class="section-title">Syndrome de Claude Bernard-Horner (CBH)</div>
<div class="info-box"><strong>Triade classique</strong>Ptosis partiel (myosis + ptosis = « pseudo-enophtalmie »), myosis, et parfois anhidrose ipsilatérale (si 1er ou 2e neurone). DPAR absent.</div>

<div class="subsection-title">Localisation de la lésion</div>
<table class="kanski-table">
  <tr><th>Neurone</th><th>Trajet</th><th>Étiologies</th></tr>
  <tr><td><strong>1er neurone</strong> (central)</td><td>Hypothalamus → C8-T2</td><td>Tumeur hypothalamique, AVC tronc cérébral, syringomyélie, démyélinisation</td></tr>
  <tr><td><strong>2e neurone</strong> (préganglionnaire)</td><td>C8-T2 → ganglion stellaire → ganglion cervical sup.</td><td><strong>Pancoast +++</strong>, anévrisme aortique, adénopathies médiastinales, chirurgie cervicale/thoracique</td></tr>
  <tr><td><strong>3e neurone</strong> (postganglionnaire)</td><td>A. carotide → orbite</td><td>Dissection de la carotide interne +++, syndrome du sinus caverneux, pathologie orbitaire</td></tr>
</table>

<div class="alert"><strong>CBH douloureux aigu</strong>Dissection de la carotide interne jusqu'à preuve du contraire ! → IRM/ARM en urgence (risque d'AVC).</div>

<div class="subsection-title">Test à la cocaïne / test à l'apraclonidine</div>
<div class="protocol">
  <h4>Confirmation diagnostique</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Cocaïne 4–10 %</strong> : bloque la recapture de noradrénaline → mydriase normale. Si CBH : l'œil atteint ne se dilate pas (car pas de NA dans la fente synaptique 3e neurone) — Confirmé si différence ≥ 0,8 mm</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Apraclonidine 0,5–1 %</strong> (agoniste α2 faible) : dénervation → hypersensibilité → pupille CBH se dilate paradoxalement. Plus utilisé en pratique courante</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Hydroxyamphétamine 1 %</strong> : différencie 3e neurone (pas de mydriase) des autres (mydriase normale)</div></div>
</div>

<div class="section-title">Pupille d'Adie</div>
<p class="body-text">Pupille mydriasique, dyskinétique, avec accommodation lente et réponse à la lumière très lente (« mieux en accommodation qu'en lumière »). Due à une lésion post-ganglionnaire parasympathique (ganglion ciliaire), probablement virale.</p>

<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Femme jeune (30–40 ans) le plus souvent</li>
    <li>Mydriase unilatérale (parfois bilatérale)</li>
    <li>Réponse lente à la lumière (quasi absente)</li>
    <li>Meilleure réponse à l'accommodation (lente et tonique)</li>
    <li>Contraction sectorielle de l'iris à la LAF</li>
    <li>Aréflexie ostéotendineuse (syndrome d'Adie = pupille + aréflexie)</li>
  </ul></div>
  <div class="card blue"><h4>Test à la pilocarpine diluée</h4><ul>
    <li>Pilocarpine 0,125 % : hypersensibilité de dénervation → myosis de l'œil atteint (l'œil normal ne répond pas)</li>
    <li>Confirme le diagnostic</li>
  </ul></div>
</div>`,

    'ch19-moteur': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Nerfs moteurs oculaires</div>
<div class="page-subtitle">Chapitre 19 · Pages 795–806</div>

<div class="section-title">Paralysie du III (Nerf oculomoteur)</div>
<div class="alert"><strong>Paralysie du III + mydriase = anévrisme jusqu'à preuve du contraire</strong>L'anévrisme de la jonction carotido-ophtalmique ou de l'artère communicante postérieure (ACoP) comprime d'abord les fibres pupillaires périphériques. Urgence vasculaire : IRM/ARM en urgence.</div>

<div class="card-grid">
  <div class="card"><h4>Anatomie fonctionnelle du III</h4><ul>
    <li>Moteur : élévateur de la paupière, droits (médial, supérieur, inférieur), petit oblique</li>
    <li>Parasympathique : sphincter irien (pupille), muscle ciliaire</li>
    <li>Fibres pupillaires : en périphérie du nerf (→ comprimées en premier par anévrisme)</li>
    <li>Fibres motrices : centrales (→ préservées si ischémie du vasa nervorum)</li>
  </ul></div>
  <div class="card red"><h4>Causes selon pupille</h4><ul>
    <li><strong>Pupille dilatée (comprensive)</strong> : anévrisme ACoP/SCA+++, méningiome, autres compressions</li>
    <li><strong>Pupille épargnée (vasculaire)</strong> : diabète (ischémie µvasculaire), HTA, athérosclérose → récupération spontanée 3–4 mois</li>
    <li><strong>Pupille épargnée MAIS douleur</strong> : ne suffit pas à éliminer un anévrisme — imagerie obligatoire</li>
  </ul></div>
</div>

<div class="subsection-title">Présentation clinique du III complet</div>
<div class="card-grid">
  <div class="card"><h4>Signes</h4><ul>
    <li>Ptosis complet (élévateur de la paupière)</li>
    <li>Œil en exotropie + hypotropie (action préservée de DL et grand oblique)</li>
    <li>Limitation de l'adduction, élévation, abaissement</li>
    <li>Diplopie binoculaire (si vision possible sous le ptosis)</li>
    <li>Mydriase si origine comprensive</li>
  </ul></div>
</div>

<div class="divider"></div>
<div class="section-title">Paralysie du IV (Nerf trochléaire)</div>
<p class="body-text">Le plus mince des nerfs crâniens moteurs (une seule décussation complète dans le tronc cérébral). Innerve le grand oblique (abaisseur + torseur interne en adduction). Cause la diplopie verticale et cyclotorsionnelle.</p>

<div class="card-grid">
  <div class="card"><h4>Présentation</h4><ul>
    <li>Diplopie verticale (image inférieure de l'œil atteint)</li>
    <li>Tête penchée du côté opposé (compense la cyclotorsion)</li>
    <li>Test de Bielschowsky positif</li>
    <li>Aggravation dans le regard en bas et en adduction</li>
  </ul></div>
  <div class="card blue"><h4>Étiologies</h4><ul>
    <li>Traumatisme crânien (50 %) : les plus fréquentes</li>
    <li>Congénitale (décompensation)</li>
    <li>Vasculaire (diabète, HTA)</li>
    <li>Compression (tumeur de la fosse postérieure)</li>
  </ul></div>
</div>

<div class="divider"></div>
<div class="section-title">Paralysie du VI (Nerf abducens)</div>
<p class="body-text">Paralysie du droit latéral → ésotropie + limitation de l'abduction. Le VI a le trajet intracrânien le plus long → vulnérable à l'HTIC (signe localisation non valeur). Paralysie du VI bilatérale = HTIC ou fracture du sphénoïde.</p>

<div class="card-grid">
  <div class="card"><h4>Présentation</h4><ul>
    <li>Diplopie horizontale homolatérale (aggravée dans le regard du côté atteint)</li>
    <li>Ésotropie homolatérale</li>
    <li>Limitation de l'abduction</li>
    <li>Tête tournée du côté atteint (pour minimiser la diplopie)</li>
  </ul></div>
  <div class="card red"><h4>Étiologies à éliminer</h4><ul>
    <li>HTIC (tumeur, HTII)</li>
    <li>Ischémique vasculaire (diabète, HTA) — récupération spontanée</li>
    <li>Pontin (tumeur, AVC)</li>
    <li>Méningite, Wernicke</li>
    <li>Syndrome de Gradenigo (otite, mastoïdite : V + VI)</li>
  </ul></div>
</div>

<div class="divider"></div>
<div class="section-title">Ophtalmoplégie internucléaire (INO)</div>
<p class="body-text">Lésion du faisceau longitudinal médial (FLM) → déficit d'adduction de l'œil ipsilatéral à la lésion lors du regard latéral, avec nystagmus de l'œil abducteur controlatéral. La convergence est préservée.</p>

<div class="card-grid">
  <div class="card blue"><h4>Étiologies</h4><ul>
    <li><strong>Jeune + bilatéral</strong> → SEP (cause la plus fréquente chez le jeune adulte)</li>
    <li><strong>Âgé + unilatéral</strong> → AVC/ischémie du tronc cérébral</li>
    <li>Tumeur du tronc cérébral</li>
    <li>Wernicke, neurosarcoïdose, Lyme</li>
  </ul></div>
</div>`,

    'ch19-papille': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Papilloœdème</div>
<div class="page-subtitle">Chapitre 19 · Pages 766–775</div>

<div class="section-title">Définition & Étiologies</div>
<div class="retenir"><strong>À retenir</strong>Le terme « papilloœdème » est réservé strictement à l'œdème papillaire bilatéral dû à une HTIC. L'œdème de papille unilatéral a d'autres étiologies (NOIA, névrite optique, etc.).</div>

<div class="card-grid">
  <div class="card red"><h4>Causes d'HTIC</h4><ul>
    <li>Tumeurs intracrâniennes</li>
    <li>Hématome sous/extradural</li>
    <li>Hydrocéphalie</li>
    <li>Méningite/encéphalite</li>
    <li>Thrombose des sinus veineux</li>
    <li>HTII (idiopathique)</li>
    <li>Abcès</li>
  </ul></div>
  <div class="card gold"><h4>Stades de papilloœdème (Frisén)</h4><ul>
    <li>Stade 1 : effacement des bords nasaux, capillaires péripapillaires dilatés</li>
    <li>Stade 2 : élévation péripapillaire, bords flous sur 360°</li>
    <li>Stade 3 : masquage des vaisseaux au bord</li>
    <li>Stade 4 : masquage des vaisseaux sur la papille</li>
    <li>Stade 5 : atrophie optique</li>
  </ul></div>
</div>

<div class="subsection-title">HTII (Hypertension intracrânienne idiopathique)</div>
<div class="card-grid">
  <div class="card"><h4>Profil typique</h4><ul>
    <li>Femme jeune, obèse +++</li>
    <li>Prise de poids récente</li>
    <li>Médicaments : tétracyclines, rétinoïdes, contraceptifs, corticoïdes (arrêt)</li>
    <li>Céphalées, vision floue transitoire, acouphènes pulsatiles</li>
    <li>Diplopie (paralysie VI fausse localisation)</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Réduction pondérale (efficace)</li>
    <li>Acétazolamide ++ (↓ production LCS)</li>
    <li>Topiramate (perte de poids + ↓ PIC)</li>
    <li>PL évacuatrice si urgence visuelle</li>
    <li>Dérivation LP ou VP si réfractaire</li>
    <li>Fenestration de la gaine du NO si menace visuelle rapide</li>
  </ul></div>
</div>`,

    // CH7 MISSING ─────────────────────────────────────────────
    'ch7-fong': () => `
<div class="page-title"><em>Cornée</em> — Kératites fongiques</div>
<div class="page-subtitle">Chapitre 7 · Pages 216–218</div>
<div class="section-title">Introduction & Pathogenèse</div>
<p class="body-text">Rare en pays tempérés mais majeure en pays tropicaux. Évolution insidieuse, pronostic sombre, perforation fréquente. Deux types : levures (Candida) prédominantes en climat tempéré, et champignons filamenteux (Fusarium, Aspergillus) en tropical.</p>
<div class="card-grid">
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li>Traumatisme végétal (pays en développement)</li>
    <li>Port de lentilles de contact</li>
    <li>Chirurgie cornéenne (LASIK, greffe)</li>
    <li>Corticoïdes topiques au long cours</li>
    <li>Immunodépression</li>
  </ul></div>
  <div class="card blue"><h4>Signes évocateurs</h4><ul>
    <li>Infiltrat avec bords duveteux irréguliers (filamenteux)</li>
    <li>Lésions satellites caractéristiques</li>
    <li>Infiltrat annulaire (réaction immune)</li>
    <li>Progression lente (&gt;48h entre consultations)</li>
    <li>Hypopion fréquent et épais</li>
    <li>Résistance aux antibiotiques</li>
  </ul></div>
</div>
<div class="retenir"><strong>À retenir</strong>Penser à la kératite fongique devant tout ulcère cornéen résistant aux antibiotiques, surtout après traumatisme végétal ou chirurgie cornéenne.</div>
<div class="section-title">Bilan</div>
<table class="kanski-table">
  <tr><th>Examen</th><th>Méthode / Commentaire</th></tr>
  <tr><td>Préparation KOH</td><td>Rapide, visualisation directe des hyphes</td></tr>
  <tr><td>Blanc de calcofluor (fluorescence)</td><td>Très utile, marquage des parois fongiques</td></tr>
  <tr><td>Culture Sabouraud</td><td>Référence. Délai 3–7 jours</td></tr>
  <tr><td>PCR cornéenne</td><td>Sensibilité ~90 %. Examen de choix si disponible</td></tr>
  <tr><td>Biopsie cornéenne</td><td>Si grattages négatifs à J7, champignons profonds</td></tr>
</table>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Antifongiques topiques (toutes les heures × 48h initialement)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Candida</strong> : Amphotéricine B 0,15 % ou Econazole 1 %</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Filamenteux</strong> : Natamycine 5 % ou Voriconazole 1–2 %</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Systémique si formes graves : Voriconazole 400 mg × 2/j J1 puis 200 mg × 2/j</div></div>
</div>`,

    'ch7-inter': () => `
<div class="page-title"><em>Cornée</em> — Kératites interstitielles</div>
<div class="page-subtitle">Chapitre 7 · Pages 229–232</div>
<div class="section-title">Introduction</div>
<p class="body-text">Inflammation du stroma cornéen sans atteinte primaire de l'épithélium ou de l'endothélium. La KI syphilitique en est l'archétype. Étiologies diverses : HSV, VZV, tuberculose, Lyme, sarcoïdose, syndrome de Cogan.</p>
<div class="section-title">Kératite interstitielle syphilitique</div>
<div class="card-grid">
  <div class="card"><h4>Caractéristiques</h4><ul>
    <li>Syphilis congénitale le plus souvent (5–25 ans)</li>
    <li>Bilatérale dans 80 % (non simultanée)</li>
    <li>Phase aiguë : tache saumonée (néovascularisation profonde)</li>
    <li>Phase cicatricielle : vaisseaux fantômes, taie stromale duveteuse</li>
    <li>Uvéite antérieure granulomateuse associée</li>
  </ul></div>
  <div class="card red"><h4>Triade de Hutchinson</h4><ul>
    <li>Kératite interstitielle</li>
    <li>Dents de Hutchinson (entaillées)</li>
    <li>Surdité de perception</li>
  </ul></div>
</div>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div>Corticoïdes topiques + cycloplégiques pour la KI active</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Traitement systémique de la syphilis (pénicilline) immédiat — supervisé par infectiologue</div></div>
</div>
<div class="divider"></div>
<div class="section-title">Syndrome de Cogan</div>
<p class="body-text">Vascularite auto-immune rare. Jeunes adultes. Association inflammation oculaire + dysfonction audiovestibulaire (surdité, acouphènes, vertiges). Manifestations systémiques (vascularite) dans 30 % des cas.</p>
<div class="card-grid">
  <div class="card blue"><h4>Signes oculaires</h4><ul>
    <li>Opacités stromales périphériques bilatérales</li>
    <li>Néovascularisation stromale intermédiaire progressive</li>
    <li>Uvéite, sclérite, vascularite rétinienne</li>
  </ul></div>
  <div class="card"><h4>Traitement</h4><ul>
    <li>Corticoïdes systémiques urgents pour les symptômes audiovestibulaires (prévient surdité irréversible)</li>
    <li>Immunosuppresseurs si résistance</li>
    <li>Prise en charge multidisciplinaire</li>
  </ul></div>
</div>`,

    'ch7-amib': () => `
<div class="page-title"><em>Cornée</em> — Kératite amibienne</div>
<div class="page-subtitle">Chapitre 7 · Pages 232–234</div>
<div class="retenir"><strong>À retenir</strong>La douleur est souvent intense et disproportionnée par rapport aux signes cliniques. Souvent confondue avec une kératite herpétique initialement.</div>
<div class="section-title">Pathogenèse</div>
<p class="body-text">Acanthamoeba spp. — protozoaires ubiquitaires. Forme kystique très résistante. Dans les pays développés : quasi-exclusivement port de LC (eau du robinet pour le rinçage).</p>
<div class="card-grid">
  <div class="card red"><h4>FDR</h4><ul>
    <li>Port de LC souple +++</li>
    <li>Rinçage LC à l'eau du robinet</li>
    <li>Natation avec LC</li>
    <li>Eau contaminée (lac, piscine)</li>
  </ul></div>
  <div class="card blue"><h4>Signes cliniques</h4><ul>
    <li>Surface épithéliale irrégulière grisâtre (précoce)</li>
    <li>Pseudo-dendrites épithéliales (DD herpès)</li>
    <li><strong>Kératonévrite radiaire</strong> (quasi pathognomonique)</li>
    <li>Abcès annulaire (stade évolué)</li>
    <li>Fonte stromale périphérique possible</li>
    <li>Sclérite adjacente (réactionnelle)</li>
  </ul></div>
</div>
<div class="section-title">Traitement</div>
<div class="alert"><strong>Résistance des kystes</strong>Les kystes d'Acanthamoeba résistent à la plupart des antiseptiques. Traitement prolongé sur plusieurs mois impératif.</div>
<div class="protocol">
  <div class="protocol-item"><div class="dot"></div><div>Débridement épithélial initial</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>PHMB 0,02 %</strong> + <strong>Chlorhexidine 0,02 %</strong> en bithérapie — kysticides</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Propamidine (Brolène®) ou hexamidine en association</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Fréquence horaire initiale, décroissance très progressive sur plusieurs mois</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Corticoïdes : éviter. Si nécessaires, seulement après ≥2 semaines d'antiamibien</div></div>
</div>`,

    'ch7-marg': () => `
<div class="page-title"><em>Cornée</em> — Kératites marginales, Phlycténulose & Rosacée</div>
<div class="page-subtitle">Chapitre 7 · Pages 234–237</div>
<div class="section-title">Kératite marginale</div>
<p class="body-text">Réaction d'hypersensibilité aux exotoxines staphylococciques. Infiltrats périphériques stériles avec zone claire entre le limbe et l'infiltrat (caractéristique). Blépharite chronique associée constamment.</p>
<div class="card-grid">
  <div class="card blue"><h4>Signes</h4><ul>
    <li>Infiltrats marginaux sous-épithéliaux séparés du limbe par une zone claire</li>
    <li>Ulcère épithélial limité (≪ zone d'infiltration)</li>
    <li>Peu de réaction de chambre antérieure</li>
    <li>Blépharite chronique ++</li>
    <li>Guérison spontanée 1–4 semaines</li>
  </ul></div>
  <div class="card"><h4>Traitement</h4><ul>
    <li>Fluorométholone ou prednisolone 0,5 % × 4/j ± antibiotique topique</li>
    <li>Doxycycline orale si récurrences</li>
    <li>Traitement de la blépharite</li>
  </ul></div>
</div>
<div class="info-box"><strong>DD kératite infectieuse</strong>Kératite marginale stérile : périphérique, souvent multiple, peu douloureuse, ulcère épithélial limité, cultures négatives.</div>
<div class="divider"></div>
<div class="section-title">Rosacée oculaire</div>
<p class="body-text">Complications oculaires chez 6–18 % des rosacéens. Mécanisme : dysfonction meibomius, inflammation, Demodex.</p>
<div class="card-grid">
  <div class="card"><h4>Signes</h4><ul>
    <li>Télangiectasies du bord libre, blépharite postérieure</li>
    <li>EPE inférieures, vascularisation inférieure</li>
    <li>Kératite marginale-like, KI progressive possible</li>
    <li>Perforation rare (formes sévères)</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Doxycycline 50–100 mg/j × plusieurs mois (anti-inflammatoire + anticollagénase)</li>
    <li>Hygiène palpébrale rigoureuse</li>
    <li>Lubrifiants, ciclosporine topique</li>
    <li>Corticoïdes topiques faibles en crise</li>
  </ul></div>
</div>`,

    'ch7-puk': () => `
<div class="page-title"><em>Cornée</em> — Ulcère / Amincissement cornéen périphérique</div>
<div class="page-subtitle">Chapitre 7 · Pages 238–241</div>
<div class="alert"><strong>À retenir</strong>Toute kératite ulcérante périphérique sans pathologie oculaire évidente doit faire rechercher une maladie auto-immune systémique potentiellement mortelle.</div>
<div class="section-title">Ulcère de Mooren</div>
<p class="body-text">Ulcération cornéenne périphérique idiopathique, progressive, douloureuse, sans pathologie systémique. Probable mécanisme auto-immun.</p>
<div class="card-grid">
  <div class="card blue"><h4>Deux formes</h4><ul>
    <li><strong>Type 1 (limité)</strong> : unilatéral, âge moyen, répond aux corticoïdes</li>
    <li><strong>Type 2 (agressif)</strong> : bilatéral, jeune, origine africaine, pronostic sévère</li>
  </ul></div>
  <div class="card"><h4>Signes</h4><ul>
    <li>Ulcération semi-lunaire périlimbique avec surplomb (overhanging edge)</li>
    <li>Progression centripète et circumférentielle</li>
    <li>Pas de zone saine entre ulcère et limbe</li>
  </ul></div>
</div>
<div class="section-title">KUP & Maladies auto-immunes systémiques</div>
<table class="kanski-table">
  <tr><th>Maladie systémique</th><th>Particularité</th></tr>
  <tr><td>Polyarthrite rhumatoïde (PR)</td><td>La plus fréquente. Bilatérale dans 30 %. Stade avancé de PR</td></tr>
  <tr><td>Granulomatose de Wegener</td><td>2e. Manifestation inaugurale dans 50 %</td></tr>
  <tr><td>Périartérite noueuse, Lupus, Crohn</td><td>Moins fréquents</td></tr>
</table>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div>Immunosuppression systémique en collaboration avec rhumatologue</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Doxycycline (anticollagénase)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Corticoïdes topiques : à éviter (aggravent l'amincissement)</div></div>
</div>`,

    'ch7-neuro': () => `
<div class="page-title"><em>Cornée</em> — Kératite neurotrophique & d'exposition</div>
<div class="page-subtitle">Chapitre 7 · Pages 241–243</div>
<div class="section-title">Kératite neurotrophique</div>
<p class="body-text">Secondaire à la perte de l'innervation trigéminée → anesthésie cornéenne. Perte de stimulus sensoriel + neuropeptides trophiques → ulcère persistant progressant vers la fonte stromale.</p>
<div class="card-grid">
  <div class="card blue"><h4>Classification par stades</h4><ul>
    <li>Stade 1 : épithéliopathie ponctuée, petits ulcères focaux</li>
    <li>Stade 2 : ulcère épithélial persistant, bords enroulés</li>
    <li>Stade 3 : fonte stromale, infection secondaire, perforation rapide possible</li>
  </ul></div>
  <div class="card red"><h4>Causes</h4><ul>
    <li>Kératite à HSV ou VZV +++</li>
    <li>Ablation du ganglion trijumeau</li>
    <li>AVC, tumeur du tronc cérébral</li>
    <li>Post-chirurgie cornéenne (LASIK, KP)</li>
    <li>Neuropathie diabétique</li>
  </ul></div>
</div>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div>Lubrifiants topiques non conservés +++</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Cénégermine (Oxervate®)</strong> — NGF recombinant humain. AMM ulcère neurotrophique</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Tarsorraphie, ptosis toxinique, greffe membrane amniotique</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Neurotisation cornéenne chirurgicale</div></div>
</div>
<div class="divider"></div>
<div class="section-title">Kératite d'exposition</div>
<p class="body-text">Fermeture incomplète des paupières → exposition cornéenne. Zone interpalpébrale touchée (1/3 inférieur de la cornée).</p>
<div class="card-grid">
  <div class="card red"><h4>Causes</h4><ul><li>Paralysie faciale (VII)</li><li>Exophtalmie (Basedow)</li><li>Cicatrices palpébrales</li><li>Lagophtalmie nocturne</li></ul></div>
  <div class="card blue"><h4>Traitement</h4><ul><li>Lubrifiants +++, chambre humide nocturne</li><li>Tarsorraphie temporaire ou permanente</li><li>Implant d'or palpébral (paralysie faciale)</li></ul></div>
</div>`,

    'ch7-dystro': () => `
<div class="page-title"><em>Cornée</em> — Dystrophies cornéennes</div>
<div class="page-subtitle">Chapitre 7 · Pages 252–261</div>
<div class="retenir"><strong>À retenir</strong>Les dystrophies cornéennes sont bilatérales, affectent principalement une couche de la cornée, sont génétiques et lentement progressives.</div>
<div class="section-title">Dystrophies stromales majeures</div>
<table class="kanski-table">
  <tr><th>Dystrophie</th><th>Gène / Histologie</th><th>Signes clés</th></tr>
  <tr><td><strong>Grillagée type I</strong></td><td>TGFB1 — dépôts amyloïdes (rouge Congo)</td><td>Points réfringents + réseau filamenteux fin. Érosions dès 10 ans. LASIK CI</td></tr>
  <tr><td><strong>Granulaire type 1</strong></td><td>TGFB1 — hyaline (rouge Masson)</td><td>Dépôts blancs "miettes de pain", nets, séparés par stroma clair. Épargne limbe</td></tr>
  <tr><td><strong>Avellino (Granulaire 2)</strong></td><td>TGFB1 — mixte</td><td>Aspect grillagé + granulaire. LASIK accélère — CI</td></tr>
  <tr><td><strong>Maculaire</strong></td><td>CHST6 — glycosaminoglycanes (AR)</td><td>Taches gris-blanc mal délimitées. La plus grave. Récidive après KP</td></tr>
  <tr><td><strong>Schnyder</strong></td><td>UBIAD1 — lipides</td><td>Haze central précoce, cristaux dans 50 %, arc proéminent</td></tr>
</table>
<div class="section-title">Dystrophies épithéliales</div>
<div class="card-grid">
  <div class="card"><h4>Cogan (membrane basale)</h4><ul><li>Souvent sporadique (dégénérative)</li><li>Points, microkystes, motifs en carte</li><li>Érosions récidivantes dans 10 %</li></ul></div>
  <div class="card"><h4>Meesmann</h4><ul><li>AD — kératines K3/K12</li><li>Myriade de petits kystes uniformes, denses au centre</li></ul></div>
</div>
<div class="section-title">Dystrophie endothéliale de Fuchs</div>
<p class="body-text">La plus importante en pratique. Perte accélérée des cellules endothéliales. Mutation TCF4 (sporadique) ou COL8A2 (forme précoce). Femmes &gt; hommes.</p>
<div class="card-grid">
  <div class="card blue"><h4>Évolution</h4><ul>
    <li>Cornea guttata (excroissances sur Descemet)</li>
    <li>Aspect "argent battu" (réflexion spéculaire)</li>
    <li>Œdème stromal (vision floue le matin ++)</li>
    <li>Kératopathie bulleuse (douleur)</li>
  </ul></div>
  <div class="card"><h4>Traitement</h4><ul>
    <li>NaCl 5 % topique, réduction PIO, sèche-cheveux</li>
    <li><strong>DMEK</strong> ou <strong>DSAEK</strong> — gold standard</li>
    <li>Inhibiteur ROCK topique (expérimental)</li>
  </ul></div>
</div>
<div class="retenir"><strong>Chirurgie cataracte</strong>ECC préopératoire &gt;630 μm = risque accru d'œdème cornéen persistant. Mesure préopératoire obligatoire.</div>`,

    'ch7-degen': () => `
<div class="page-title"><em>Cornée</em> — Dégénérescences cornéennes</div>
<div class="page-subtitle">Chapitre 7 · Pages 261–268</div>
<div class="section-title">Dégénérescences liées à l'âge</div>
<table class="kanski-table">
  <tr><th>Dégénérescence</th><th>Description</th><th>Signification</th></tr>
  <tr><td>Arc sénile (gérontoxon)</td><td>Dépôts lipidiques circumférentiels séparés du limbe par zone claire</td><td>Fréquent chez l'âgé. Si &lt;50 ans : bilan lipidique (hypercholestérolémie)</td></tr>
  <tr><td>Kératopathie en bandelette</td><td>Dépôts de calcium dans couche de Bowman (zone interpalpébrale)</td><td>Secondaire : uvéite chronique (AJI +++), hypercalcémie, neuropathie</td></tr>
  <tr><td>Nœuds de Salzmann</td><td>Nodules sous-épithéliaux gris-bleuâtres surélevés</td><td>Secondaire à inflammation cornéenne chronique, trachome</td></tr>
</table>
<div class="section-title">Kératopathies métaboliques</div>
<table class="kanski-table">
  <tr><th>Pathologie</th><th>Dépôt</th><th>Aspect cornéen</th></tr>
  <tr><td>Cystinose</td><td>Cristaux de cystine</td><td>Dépôts réfringents en aiguilles dans tout le stroma</td></tr>
  <tr><td>Maladie de Wilson</td><td>Cuivre dans Descemet</td><td>Anneau de Kayser-Fleischer (doré-brun, périphérique)</td></tr>
  <tr><td>Maladie de Fabry</td><td>Glycolipides dans épithélium</td><td>Verticillata : opacités en tourbillon gris-brun (similaire à chloroquine)</td></tr>
  <tr><td>Tyrosinémie type 2</td><td>Cristaux de tyrosine</td><td>Pseudo-dendrites cornéennes, opacités pseudo-herpétiques</td></tr>
</table>
<div class="info-box"><strong>Anneau de Kayser-Fleischer</strong>Maladie de Wilson — présent dans ~100 % des formes neurologiques. Disparaît après chélation (D-pénicillamine). Mieux visible à la gonioscopie.</div>`,

    'ch7-lc': () => `
<div class="page-title"><em>Cornée</em> — Lentilles de contact</div>
<div class="page-subtitle">Chapitre 7 · Pages 268–270</div>
<div class="section-title">Indications thérapeutiques</div>
<div class="card-grid">
  <div class="card blue"><h4>LC souples thérapeutiques</h4><ul>
    <li>Kératite bulleuse (soulagement douloureux)</li>
    <li>Erosions épithéliales récidivantes</li>
    <li>Ulcères épithéliaux persistants</li>
    <li>Kératite filamenteuse</li>
    <li>Protection mécanique (trichiasis)</li>
  </ul></div>
  <div class="card"><h4>LC rigides / sclérales</h4><ul>
    <li>Kératocône (correction optique)</li>
    <li>Astigmatismes irréguliers post-chirurgicaux</li>
    <li>Œil sec sévère (sclérales : réservoir lacrymal)</li>
    <li>Greffes de cornée irrégulières</li>
  </ul></div>
</div>
<div class="section-title">Complications</div>
<div class="card-grid">
  <div class="card red"><h4>Infectieuses</h4><ul>
    <li>Kératite bactérienne (Pseudomonas +++ si port prolongé)</li>
    <li>Kératite amibienne (eau du robinet !)</li>
    <li>Kératite fongique</li>
  </ul></div>
  <div class="card"><h4>Non infectieuses</h4><ul>
    <li>Néovascularisation superficielle (hypoxie)</li>

    <li>Infiltrats stériles (CLPU)</li>
    <li>Abrasions, érosions</li>
  </ul></div>
  <div class="card gold"><h4>Prévention</h4><ul>
    <li>Ne jamais rincer à l'eau du robinet</li>
    <li>Respecter les durées de port</li>
    <li>Renouveler les étuis régulièrement</li>
    <li>Retirer avant douche, natation</li>
    <li>Consultation immédiate si douleur / vision trouble</li>
  </ul></div>
</div>`,

    'ch11-gpn': () => `
<div class="page-title"><em>Glaucome</em> — Glaucome à pression normale</div>
<div class="page-subtitle">Chapitre 11 · Pages 367–370</div>
<div class="section-title">Introduction</div>
<p class="body-text">Le GPN est une variante du GPAO avec une PIO constamment ≤ 21 mmHg mais des lésions glaucomateuses caractéristiques. 30–65 % des glaucomes à angle ouvert peuvent présenter une PIO dans les limites normales au diagnostic initial selon l'ethnie.</p>
<div class="retenir"><strong>À retenir</strong>Des facteurs indépendants de la PIO (vasculaires, structuraux) semblent avoir une importance relative croissante dans le GPN par rapport au GPAO.</div>
<div class="section-title">Facteurs de risque spécifiques</div>
<div class="card-grid">
  <div class="card red"><h4>Facteurs vasculaires</h4><ul>
    <li>Migraine et phénomène de Raynaud</li>
    <li>Hypotension nocturne systémique (&gt;20 % de baisse) +++</li>
    <li>SAOS (apnées du sommeil)</li>
    <li>Diabète, HTA, maladies cardiovasculaires</li>
  </ul></div>
  <div class="card"><h4>Facteurs anatomiques</h4><ul>
    <li>ECC plus faible que dans le GPAO</li>
    <li>Papille souvent plus grande</li>
    <li>Gradient de pression translaminaire augmenté</li>
    <li>Mutations OPTN (optineurine)</li>
    <li>Prédominance féminine et origine japonaise</li>
  </ul></div>
</div>
<div class="section-title">Particularités cliniques</div>
<table class="kanski-table">
  <tr><th>Caractéristique</th><th>GPN vs GPAO</th></tr>
  <tr><td>PIO</td><td>≤ 21 mmHg (tranche haute normale)</td></tr>
  <tr><td>Hémorragies papillaires</td><td>Plus fréquentes +++ (facteur de progression)</td></tr>
  <tr><td>Encoches de l'ANR</td><td>Plus focales et fréquentes</td></tr>
  <tr><td>Déficits CV</td><td>Plus proches de la fixation, profonds, abrupts</td></tr>
  <tr><td>Pâleur ANR</td><td>Disproportionnée → penser au DD neurologique</td></tr>
</table>
<div class="alert"><strong>Indications de neuro-imagerie dans un GPN</strong>Perte d'AV disproportionnée · perte de vision des couleurs · pâleur ANR · progression rapide malgré PIO normale · patient jeune</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Particularités</h4>
  <div class="protocol-item"><div class="dot"></div><div>Pression cible très basse (souvent ≤ 12 mmHg) — réduction ≥ 30 % (étude CNTGS)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Brimonidine : effet neuroprotecteur suggéré (LiGHT study)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Traitement de l'hypotension nocturne si documentée</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Traitement du SAOS si présent</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Éviter les bêta-bloquants systémiques (aggravation hypotension nocturne)</div></div>
</div>`,

    'ch11-psex': () => `
<div class="page-title"><em>Glaucome</em> — Syndrome pseudoexfoliatif</div>
<div class="page-subtitle">Chapitre 11 · Pages 379–381</div>
<div class="retenir"><strong>À retenir</strong>Le SPE est la cause la plus fréquente de glaucome secondaire à angle ouvert. Le GPE progresse plus rapidement que le GPAO. Surveillance maximale : pas plus de 6 mois entre les visites.</div>
<div class="section-title">Pathogenèse</div>
<p class="body-text">Substance fibrillaire gris-blanc provenant d'un métabolisme anormal de la matrice extracellulaire (mutation LOXL1 chromosome 15). Dépôts sur la capsule du cristallin, fibres zonulaires, iris, trabéculum, conjonctive. Manifestation oculaire d'une maladie systémique (association avec surdité et maladies cardiovasculaires).</p>
<div class="section-title">Signes cliniques</div>
<table class="kanski-table">
  <tr><th>Structure</th><th>Signe</th><th>Note</th></tr>
  <tr><td>Capsule antérieure</td><td>Disque central + zone périphérique + zone claire intermédiaire (abrasion pupillaire)</td><td>Pathognomonique — nécessite mydriase !</td></tr>
  <tr><td>Bord pupillaire</td><td>Perte de la collerette + matériel granulaire</td><td>Très évocateur</td></tr>
  <tr><td>Trabéculum</td><td>Hyperpigmentation en patch irrégulière + ligne de Sampaolesi</td><td>Sampaolesi : non pathognomonique (aussi dans SDP)</td></tr>
  <tr><td>Iris</td><td>Transillumination en patch (bord pupillaire)</td><td>≠ SDP (défects radiaires en rayons de roue)</td></tr>
  <tr><td>Endothélium</td><td>Dépôts pigmentaires, densité réduite</td><td>Risque chirurgical augmenté</td></tr>
</table>
<div class="card-grid">
  <div class="card red"><h4>Risques chirurgicaux spécifiques</h4><ul>
    <li>Mydriase insuffisante</li>
    <li>Fragilité zonulaire → subluxation peropératoire</li>
    <li>Phimosis du capsulorhexis</li>
    <li>Pic de PIO post-op</li>
    <li>Luxation tardive de LIO</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Médical : similaire au GPAO mais échec plus fréquent</li>
    <li>SLT très efficace (~30 % de réduction). Ne pas sur-traiter</li>
    <li>Phacoémulsification seule peut abaisser la PIO</li>
    <li>Chirurgie filtrante : taux similaire au GPAO</li>
  </ul></div>
</div>`,

    'ch11-disp': () => `
<div class="page-title"><em>Glaucome</em> — Syndrome de dispersion pigmentaire</div>
<div class="page-subtitle">Chapitre 11 · Pages 381–383</div>
<div class="section-title">Introduction</div>
<p class="body-text">Libération de granules de pigment de l'épithélium pigmentaire de l'iris avec dépôts dans le segment antérieur. Touche préférentiellement les hommes jeunes, blancs, myopes. ~15 % développeront une PIO élevée ou un glaucome dans les 15 ans.</p>
<div class="info-box"><strong>Mécanisme — blocage pupillaire inverse</strong>Bombement postérieur de l'iris périphérique → frottement sur la zonule → libération mélanine. Une iridotomie aplatit l'iris et réduit le contact iridozonulaire.</div>
<div class="section-title">Triade diagnostique</div>
<div class="card-grid">
  <div class="card blue"><h4>Fuseau de Krukenberg</h4><ul>
    <li>Dépôt vertical de pigment sur l'endothélium cornéen</li>
    <li>Non pathognomonique, peut disparaître avec l'âge</li>
  </ul></div>
  <div class="card blue"><h4>Défects iriens radiaires</h4><ul>
    <li>Aspect en « rayons de roue » en transillumination</li>
    <li>Visibles sur iris clairs uniquement</li>
    <li>Pièce sombre + fente courte intense + regard vers le haut</li>
  </ul></div>
  <div class="card blue"><h4>Hyperpigmentation trabéculaire</h4><ul>
    <li>Bande dense homogène sur 4 quadrants</li>
    <li>Différent de la SPE (irrégulière, patchwork)</li>
    <li>Ligne de Sampaolesi peut être présente</li>
  </ul></div>
</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Spécificités</h4>
  <div class="protocol-item"><div class="dot"></div><div>Réduire l'exercice intense si déclencheur de pics de PIO symptomatiques</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Iridotomie périphérique</strong> : indiquée chez les &lt;40 ans avec dispersion active. Réduit les pics intermittents</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>SLT efficace</strong> : ne traiter que 2 quadrants initialement (angle très pigmenté → risque de pic)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Myotiques : théoriquement bénéfiques mais mal tolérés chez jeune myope (spasme, risque DR)</div></div>
</div>`,

    'ch11-neov': () => `
<div class="page-title"><em>Glaucome</em> — Glaucome néovasculaire</div>
<div class="page-subtitle">Chapitre 11 · Pages 383–385</div>
<div class="alert"><strong>Pronostic sévère</strong>50 % de cécité selon la durée du suivi. Espérance de vie réduite (~50 % de la normale).</div>
<div class="section-title">Pathogenèse & Étiologies</div>
<p class="body-text">Ischémie rétinienne → production de VEGF → rubeosis iridis → membrane fibrovasculaire dans l'angle → fermeture et atrophie glaucomateuse rapide.</p>
<div class="badge-list">
  <span class="badge red">OVCR ischémique 35–50 % (glaucome du 100e jour)</span>
  <span class="badge red">Rétinopathie diabétique 10–15 %</span>
  <span class="badge">SIO, OACR</span>
  <span class="badge">Tumeurs, DR chronique, inflammation</span>
</div>
<div class="section-title">Stades cliniques</div>
<table class="kanski-table">
  <tr><th>Stade</th><th>Signes</th><th>PIO</th></tr>
  <tr><td>Précoce</td><td>Petits vaisseaux au bord pupillaire (fort grossissement)</td><td>Souvent normale</td></tr>
  <tr><td>Angle ouvert</td><td>Néovaisseaux en rayons de roue vers l'angle</td><td>Peut s'élever</td></tr>
  <tr><td>Angle fermé</td><td>Membrane fibrovasculaire → SPA → fermeture circulaire</td><td>Très élevée</td></tr>
  <tr><td>Terminal</td><td>Congestion, douleurs, non voyant</td><td>Variable</td></tr>
</table>
<div class="section-title">Traitement</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Anti-VEGF IVT</strong> (bévacizumab 1,25 mg) : régression rapide de la rubeosis. Durée limitée → associer à PPR</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>PPR</strong> : traitement curatif de l'ischémie. Inefficace sur membrane constituée</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Médical</strong> : tous agents sauf myotiques. Atropine 1 % (lutte synéchies + voie uvéosclérale)</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Shunt / trabéculectomie</strong> si AV ≥ CLD et PIO non contrôlée</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content"><strong>Cyclodiode</strong> si faible potentiel visuel → analgésie + réduction congestion</div></div>
</div>`,

    'ch11-inflam': () => `
<div class="page-title"><em>Glaucome</em> — Glaucome inflammatoire & cortico-induit</div>
<div class="page-subtitle">Chapitre 11 · Pages 385–390</div>
<div class="section-title">Mécanismes</div>
<div class="card-grid">
  <div class="card"><h4>Angle fermé + bloc pupillaire</h4><ul>
    <li>Seclusion pupillaire (synéchies 360°) → iris bombé</li>
    <li>Traitement : iridotomie périphérique urgente</li>
  </ul></div>
  <div class="card"><h4>Angle fermé sans bloc pupillaire</h4><ul>
    <li>SAP secondaires à l'inflammation chronique</li>
    <li>Traitement : trabéculectomie si nécessaire</li>
  </ul></div>
  <div class="card blue"><h4>Angle ouvert</h4><ul>
    <li>Obstruction trabéculaire (cellules, débris, fibrine)</li>
    <li>Souvent transitoire — corticoïdes topiques</li>
    <li>Syndrome de Posner-Schlossman : cyclite hypertensive unilatérale récurrente. Évoquer CMV (PCR HA)</li>
  </ul></div>
</div>
<div class="section-title">Glaucome cortico-induit</div>
<div class="info-box"><strong>Mécanisme</strong>Corticoïdes (topiques +++, périoculaires, systémiques) → ↓ drainage trabéculaire. ~30 % des utilisateurs sont « répondeurs ». Généralement réversible à l'arrêt.</div>
<div class="card-grid">
  <div class="card red"><h4>Facteurs de risque de réponse corticoïde</h4><ul>
    <li>GPAO ou antécédents familiaux de glaucome</li>
    <li>Myopie forte</li>
    <li>DT1</li>
    <li>Tissu conjonctif (Marfan, Ehlers-Danlos)</li>
    <li>SPE</li>
  </ul></div>
  <div class="card blue"><h4>Prise en charge</h4><ul>
    <li>Arrêt ou substitution des corticoïdes (fluorométholone ou rimexolone moins hypertensants)</li>
    <li>Traitement médical standard de la PIO</li>
    <li>Chirurgie si irréversible malgré arrêt</li>
  </ul></div>
</div>`,

    'ch11-cong': () => `
<div class="page-title"><em>Glaucome</em> — Glaucome congénital primitif</div>
<div class="page-subtitle">Chapitre 11 · Pages 395–399</div>
<div class="section-title">Définition & Épidémiologie</div>
<p class="body-text">Anomalie isolée du développement de l'angle (dysgénésie trabéculaire) sans autres anomalies oculaires. Incidence : 1/10 000. 65 % bilatéral. Transmission autosomique récessive (mutations CYP1B1). Diagnostic souvent avant l'âge de 1 an.</p>
<div class="section-title">Triade clinique</div>
<div class="card-grid">
  <div class="card red"><h4>Triade classique (chez le nourrisson)</h4><ul>
    <li><strong>Épiphora</strong> (larmoiement) — souvent attribué à tort à une obstruction lacrymale</li>
    <li><strong>Photophobie</strong> (liée à l'œdème cornéen)</li>
    <li><strong>Blépharospasme</strong></li>
  </ul></div>
  <div class="card blue"><h4>Signes oculaires</h4><ul>
    <li><strong>Buphtalmie</strong> : diamètre cornéen ≥ 12 mm avant 1 an</li>
    <li>Œdème cornéen (aspect dépoli)</li>
    <li>Stries de Haab (ruptures de la membrane de Descemet)</li>
    <li>Excavation papillaire (réversible si PIO contrôlée tôt !)</li>
    <li>Myopie axiale progressive</li>
  </ul></div>
</div>
<div class="info-box"><strong>Réversibilité de l'excavation</strong>Contrairement à l'adulte, l'excavation glaucomateuse peut régresser chez le nourrisson si la PIO est contrôlée rapidement (tête du NO encore malléable).</div>
<div class="section-title">Traitement — Chirurgie en urgence</div>
<div class="card-grid">
  <div class="card blue"><h4>1re intention</h4><ul>
    <li><strong>Goniotomie</strong> : incision trabéculum sous gonioscopie directe. Si cornée transparente. Succès 70–90 %</li>
    <li><strong>Trabéculotomie</strong> : incision par voie externe (canal de Schlemm). Si cornée opaque</li>
  </ul></div>
  <div class="card"><h4>Recours</h4><ul>
    <li>Trabéculectomie + MMC si goniotomie/trabéculotomie échoue</li>
    <li>Shunts de drainage (Ahmed, Baerveldt)</li>
    <li>Cyclodiode en dernier recours</li>
  </ul></div>
</div>`,
