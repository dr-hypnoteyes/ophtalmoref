    'ch12-spa': () => `
<div class="page-title"><em>Uvéites</em> — Uvéites & Spondylarthropathies</div>
<div class="page-subtitle">Chapitre 12 · Pages 435–437</div>
<div class="section-title">Généralités</div>
<p class="body-text">Les spondylarthropathies (SpA) sont le groupe le plus fréquemment associé à une uvéite. Uvéite antérieure aiguë, non granulomateuse, récidivante. HLA-B27 positif dans 50–80 % des UAA unilatérales.</p>
<div class="section-title">Spondylarthrite ankylosante</div>
<div class="card-grid">
  <div class="card"><h4>Profil typique</h4><ul>
    <li>Homme jeune 20–40 ans, HLA-B27+ (90–95 %)</li>
    <li>UAA dans ~25–30 % des SA</li>
    <li>Toujours unilatérale alternante (jamais simultanément bilatérale)</li>
    <li>Rémission complète entre les crises</li>
  </ul></div>
  <div class="card blue"><h4>Clinique oculaire</h4><ul>
    <li>Début aigu, douloureux, photophobie intense</li>
    <li>Hyperhémie périkératique +++</li>
    <li>KP fins non granulomateux, tyndall important</li>
    <li>Hypopion possible</li>
    <li>Synéchies postérieures si traitement tardif</li>
  </ul></div>
</div>
<div class="section-title">Autres SpA</div>
<div class="card-grid">
  <div class="card"><h4>Arthrite réactionnelle</h4><ul>
    <li>Triade : arthrite + urétrite/cervicite + conjonctivite (± uvéite)</li>
    <li>Déclenchée 2–4 semaines après infection (Chlamydia, Salmonella, Shigella)</li>
  </ul></div>
  <div class="card"><h4>Rhumatisme psoriasique</h4><ul>
    <li>Uvéite antérieure possible</li>
    <li>Association à des plaques cutanées et dystrophie unguéale</li>
    <li>HLA-B27 moins fréquent</li>
  </ul></div>
</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Traitement de la crise d'UAA</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Corticoïdes topiques</strong> (prednisolone 1 %) : fréquence initiale élevée (H1), décroissance rapide</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Cycloplégique</strong> (atropine 1 % ou cyclopentolate) : prévention des synéchies</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Anti-TNF (infliximab, adalimumab) si UAA sévère récidivante menaçant la vision</div></div>
</div>`,

    'ch12-fuchs': () => `
<div class="page-title"><em>Uvéites</em> — Iridocyclite hétérochromique de Fuchs</div>
<div class="page-subtitle">Chapitre 12 · Pages 437–439</div>
<div class="retenir"><strong>À retenir</strong>IHF = uvéite chronique unilatérale non granulomateuse. Triade : hétérochromie + KP stellaires diffus + ABSENCE de synéchies postérieures. Le glaucome survient dans 60 % des cas.</div>
<div class="section-title">Clinique — Signes distinctifs</div>
<div class="card-grid">
  <div class="card blue"><h4>Triade pathognomonique</h4><ul>
    <li><strong>Hétérochromie</strong> : œil atteint généralement hypochromique (atrophie stromale). Parfois hyperchromique sur iris bleus</li>
    <li><strong>KP stellaires diffus</strong> gris-blanc sur tout l'endothélium (≠ triangulaires inférieurs)</li>
    <li><strong>Absence de synéchies postérieures</strong> sauf après chirurgie</li>
  </ul></div>
  <div class="card"><h4>Autres signes</h4><ul>
    <li>Nodules de Koeppe (bord pupillaire)</li>
    <li>Atrophie irienne diffuse (iris lisse, sphincter proéminent)</li>
    <li>Hyalite antérieure possible</li>
    <li>Cataracte SCP très fréquente</li>
    <li>Signe d'Amsler (hémorragie lors de paracentèse)</li>
  </ul></div>
</div>
<div class="section-title">Complications</div>
<div class="card-grid">
  <div class="card red"><h4>Glaucome (60 % à terme)</h4><ul>
    <li>Mécanismes multiples : néovascularisation angulaire, SAP</li>
    <li>Souvent avancé au diagnostic</li>
    <li>Drainage ou trabéculectomie souvent nécessaire</li>
  </ul></div>
  <div class="card"><h4>Cataracte</h4><ul>
    <li>Extrêmement fréquente</li>
    <li>Risque : hyphéma post-op (vaisseaux angulaires)</li>
    <li>Pas d'OMC post-op (particularité IHF)</li>
  </ul></div>
</div>
<div class="info-box"><strong>Traitement</strong>Corticoïdes topiques au long cours NON indiqués (inflammation bas grade résistante + risque glaucome cortico-induit). Traitement des complications (glaucome, cataracte).</div>`,

    'ch12-aji': () => `
<div class="page-title"><em>Uvéites</em> — Uvéites & Arthrite Juvénile Idiopathique</div>
<div class="page-subtitle">Chapitre 12 · Pages 439–441</div>
<div class="retenir"><strong>À retenir</strong>L'uvéite de l'AJI est souvent ASYMPTOMATIQUE — œil blanc, non douloureux. Détectée uniquement sur dépistage systématique à la LAF. Un traitement immunomodulateur doit être envisagé précocement.</div>
<div class="section-title">Profil de l'uvéite dans l'AJI</div>
<div class="card-grid">
  <div class="card red"><h4>Particularités</h4><ul>
    <li>Uvéite chronique bilatérale asymétrique</li>
    <li>Non granulomateuse, asymptomatique !</li>
    <li>Pas de rougeur, pas de douleur → diagnostic tardif fréquent</li>
    <li>Forme la plus à risque : AJI oligoarticulaire + AAN+ chez la petite fille</li>
  </ul></div>
  <div class="card"><h4>Risque selon forme d'AJI</h4><ul>
    <li><strong>Oligoarticulaire</strong> : ~20 % uvéite. AAN+ chez 75 %</li>
    <li>Polyarticulaire FR+ : risque faible</li>
    <li>Polyarticulaire FR- : risque modéré</li>
    <li>Systémique (Still) : uvéite rare</li>
    <li>Enthésopathique (HLA-B27+) : UAA aiguë</li>
  </ul></div>
</div>
<div class="section-title">Complications redoutées</div>
<div class="card-grid">
  <div class="card red"><h4>Bande kératopathie calcaire</h4><ul>
    <li>Dépôts de calcium dans la couche de Bowman interpalpébrale</li>

    <li>Traitement : EDTA topique + débridement</li>
  </ul></div>
  <div class="card red"><h4>Autres</h4><ul>
    <li>Cataracte (inflammation + corticoïdes)</li>
    <li>Glaucome secondaire</li>
    <li>OMC (cause principale de BAV)</li>

  </ul></div>
</div>
<div class="subsection-title">Protocole de dépistage</div>
<table class="kanski-table">
  <tr><th>Forme</th><th>AAN</th><th>Fréquence LAF</th></tr>
  <tr><td>Oligoarticulaire &lt;7 ans</td><td>Positif</td><td>Tous les 3 mois × 4 ans puis 6 mois</td></tr>
  <tr><td>Oligoarticulaire &lt;7 ans</td><td>Négatif</td><td>Tous les 6 mois × 4 ans</td></tr>
  <tr><td>Oligoarticulaire ≥7 ans</td><td>Positif</td><td>Tous les 6 mois × 4 ans</td></tr>

</table>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Escalade</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Corticoïdes topiques + cycloplégique</strong> : 1re ligne des poussées (insuffisants seuls au long cours)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Méthotrexate SC</strong> : immunomodulateur de 1re ligne si corticostéroïdes insuffisants</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Adalimumab (Humira)</strong> : anti-TNF AMM uvéite AJI non infectieuse ≥2 ans</div></div>
</div>`,

    'ch12-uvint': () => `
<div class="page-title"><em>Uvéites</em> — Uvéite intermédiaire (Pars planite)</div>
<div class="page-subtitle">Chapitre 12 · Pages 443–445</div>
<div class="section-title">Définition</div>
<p class="body-text">Inflammation chronique récurrente avec le vitré comme site principal d'inflammation. La pars planite est la forme idiopathique avec banquises et/ou boules de neige. 15 % de toutes les uvéites.</p>
<div class="badge-list">
  <span class="badge red">SEP +++</span><span class="badge">Sarcoïdose</span><span class="badge">Lyme</span><span class="badge">TB</span><span class="badge gold">Idiopathique ≥50 %</span>
</div>
<div class="section-title">Signes cliniques spécifiques</div>
<div class="card-grid">
  <div class="card blue"><h4>Signes pathognomoniques</h4><ul>
    <li><strong>Boules de neige</strong> : condensations blanchâtres vitréennes inférieures</li>
    <li><strong>Banquise</strong> : plaque fibrovasculaire gris-blanc (pars plana inférieure)</li>
    <li>Périphlébite périphérique (SEP +++)</li>
    <li>Pas de douleur, pas de rougeur</li>
  </ul></div>

    <li><strong>OMC</strong> (50 % des cas) : 1re cause de BAV → OCT systématique</li>
    <li>MER maculaire fréquente</li>
    <li>Néovascularisation périphérique ± prépapillaire</li>
    <li>Cataracte (corticoïdes + inflammation)</li>

  <div class="protocol-item"><div class="dot"></div><div><strong>Corticoïdes systémiques ± immunomodulateurs</strong> si bilatéral sévère</div></div>

    'ch12-vkh': () => `
<div class="page-title"><em>Uvéites</em> — Vogt-Koyanagi-Harada</div>
<div class="page-subtitle">Chapitre 12 · Pages 445–448</div>
<div class="section-title">Introduction</div>
<p class="body-text">Maladie auto-immune multisystémique dirigée contre les mélanocytes (uvée, oreille interne, méninges, peau). Touche préférentiellement les Japonais, Hispaniques, Moyen-Orientaux. Associée à HLA-DR1 et HLA-DR4.</p>
<div class="section-title">Phases évolutives</div>
<div class="card-grid">
  <div class="card"><h4>Phase prodromique (jours)</h4><ul>
    <li>Méningite lymphocytaire (céphalées)</li>
    <li>Acouphènes, vertiges, surdité</li>
    <li>Paralysies nerfs crâniens possibles</li>
  </ul></div>
  <div class="card red"><h4>Phase uvéitique aiguë</h4><ul>
    <li>Panuvéite granulomateuse bilatérale</li>
    <li>Décollements exsudatifs multifocaux +++</li>
    <li>Nodules de Dalen-Fuchs</li>
    <li>Effusion uvéale, hyalite, papillite</li>
  </ul></div>
  <div class="card gold"><h4>Phase de convalescence</h4><ul>
    <li>Alopécie, poliose (blanchissement cils/sourcils)</li>
    <li>Vitiligo</li>
    <li>Fond d'œil « en coucher de soleil » (dépigmentation)</li>
    <li>Signe de Sugiura (dépigmentation limbique)</li>
  </ul></div>
</div>
<div class="subsection-title">Critères diagnostiques — VKH complet</div>
<div class="info-box"><strong>5 critères requis</strong>1. Absence de traumatisme perforant · 2. Pas d'autre maladie oculaire · 3. Uvéite bilatérale · 4. Manifestations neurologiques/auditives · 5. Atteintes cutanées ne précédant pas l'atteinte oculaire/SNC</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Corticothérapie intensive précoce</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Bolus méthylprednisolone IV 500–1000 mg/j × 3 jours</strong> puis relais prednisone 1–2 mg/kg/j</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Décroissance très lente sur 3–6 mois minimum (risque de rechute)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Immunosuppresseurs (MTX, azathioprine) si cortico-dépendance</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Anti-TNF (infliximab) si insuffisance corticoïde précoce</div></div>
</div>`,

    'ch12-sarco': () => `
<div class="page-title"><em>Uvéites</em> — Sarcoïdose oculaire</div>
<div class="page-subtitle">Chapitre 12 · Pages 450–454</div>
<div class="section-title">Introduction</div>
<p class="body-text">Sarcoïdose = pathologie systémique la plus fréquente en uvéologie. Atteinte oculaire chez 25–70 % des patients selon l'ethnie. L'UAG granulomateuse est la manifestation la plus fréquente.</p>
<div class="section-title">7 signes oculaires clés (IWOS 2009)</div>
<div class="card-grid">
  <div class="card blue"><h4>Segment antérieur</h4><ul>
    <li>KP en « graisse de mouton » (mutton fat)</li>
    <li>Nodules de Koeppe (bord pupillaire) et/ou Busacca (stroma)</li>
    <li>Nodules du trabéculum + SAP « en tente »</li>
  </ul></div>
  <div class="card"><h4>Vitré & Rétine</h4><ul>
    <li>Opacités en « boules de neige » et/ou « cordons de perles »</li>
    <li>Lésions choriorétiniennes multiples périphériques</li>
    <li>Périphlébite en « taches de bougie » +++</li>
    <li>Nodule/granulome du nerf optique</li>
  </ul></div>
</div>
<div class="section-title">Bilan systémique</div>
<div class="card-grid">
  <div class="card"><h4>1re intention</h4><ul>
    <li>Rx thorax (adénopathies hilaires bilatérales)</li>
    <li>ECA (sensibilité 60 %)</li>

  </ul></div>

    <li>TDM thoracique haute résolution</li>
    <li>TEP-scanner</li>
    <li>LBA (rapport CD4/CD8 &gt; 3,5)</li>
    <li>Biopsie accessible (histologie = gold standard)</li>
  </ul></div>
</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Corticothérapie ± immunosuppresseurs</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>UAA</strong> : topique + cycloplégique. Souvent résistante → systémique</div></div>

    'ch12-behcet': () => `

<div class="card-grid">
  <div class="card red"><h4>Uvéite typique</h4><ul>
    <li>Panuvéite aiguë récidivante bilatérale</li>

    'ch12-cmv': () => `
<div class="page-title"><em>Uvéites</em> — Uvéites virales (CMV, NRA, NRP)</div>
<div class="page-subtitle">Chapitre 12 · Pages 465–474</div>
<div class="section-title">Rétinite à CMV</div>
<div class="info-box"><strong>Contexte</strong>Immunodépression sévère (CD4 &lt;50/mm³ dans le SIDA principalement). La microangiopathie rétinienne VIH est un marqueur de risque de rétinite à CMV.</div>
<div class="card-grid">
  <div class="card red"><h4>Clinique</h4><ul>
    <li>BAV progressive unilatérale puis bilatérale (50 % sans traitement)</li>
    <li>Zones d'infiltration blanche + hémorragies péri-vasculaires</li>
    <li>Aspect « pizza margherita » ou « fromage et ketchup »</li>
    <li>Forme indolente (périphérique, granuleuse, peu hémorragique)</li>
    <li>Uvéite antérieure légère ou absente</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li><strong>Valganciclovir oral</strong> 900 mg × 2/j × 3 semaines, puis entretien 900 mg/j</li>
    <li><strong>Ganciclovir IV</strong> : formes menaçant la macula ou sévères</li>
    <li>IVT ganciclovir/foscarnet en adjuvant si urgence visuelle</li>
    <li>Arrêt entretien si CD4 &gt;100 sous HAART ≥3–6 mois</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">Nécrose Rétinienne Aiguë (NRA)</div>
<div class="alert"><strong>Urgence</strong>HSV-2 (jeunes), HSV-1/VZV (âgés). Peut survenir chez immunocompétents. DR dans 75 % des cas !</div>
<div class="card-grid">
  <div class="card red"><h4>Critères diagnostiques</h4><ul>
    <li>Nécrose rétinienne périphérique (une ou plusieurs plages)</li>
    <li>Progression rapide sans traitement</li>
    <li>Extension circonférentielle</li>
    <li>Occlusion artérielle périphérique</li>
    <li>Uvéite antérieure ± vitréite</li>
  </ul></div>
  <div class="card blue"><h4>Traitement NRA</h4><ul>
    <li>Aciclovir IV 10 mg/kg × 3/j × 7–10 j → valaciclovir oral 14 j</li>
    <li>Laser barrage prophylactique en arrière des zones nécrotiques</li>
    <li>Corticoïdes systémiques après 24–48h d'antiviraux</li>
    <li>Vitrectomie si DR ou hémorragie</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">Nécrose Rétinienne Progressive (NRP)</div>
<p class="body-text">Forme sévère chez immunodéprimés profonds (CD4 très bas). Lésions blanches multifocales, peu symptomatiques, progression rapide vers l'atrophie sans vasculite. Pronostic sombre.</p>
<div class="badge-list">
  <span class="badge">VZV ou CMV</span><span class="badge red">CD4 très bas</span><span class="badge accent">Antiviraux systémiques + IVT + HAART urgent</span>
</div>`,

    'ch13-rop': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Rétinopathie de la prématurité</div>
<div class="page-subtitle">Chapitre 13 · Pages 536–540</div>
<div class="section-title">Introduction</div>
<p class="body-text">La ROP résulte d'une vascularisation rétinienne incomplète à la naissance. La rétine se vascularise de la papille vers la périphérie entre la 16e et la 40e SA. L'oxygénothérapie et d'autres facteurs → vasoconstriction → néovascularisation proliférante.</p>
<div class="card-grid">
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li>Terme &lt;32 SA ou poids &lt;1500 g (risque majeur)</li>
    <li>Oxygénothérapie intensive</li>
    <li>Infections néonatales, anémie, transfusions</li>
  </ul></div>
</div>
<div class="section-title">Classification ICROP</div>
<div class="subsection-title">Zones (du centre vers la périphérie)</div>
<div class="badge-list">
  <span class="badge red">Zone I : autour de la papille (rayon = 2 × distance papille-macula)</span>
  <span class="badge gold">Zone II : entre Zone I et équateur nasal</span>
  <span class="badge green">Zone III : reste périphérie temporale</span>
</div>
<div class="subsection-title">Stades (sévérité croissante)</div>
<table class="kanski-table">
  <tr><th>Stade</th><th>Description</th></tr>
  <tr><td>1</td><td>Ligne de démarcation entre rétine vascularisée/avasculaire</td></tr>
  <tr><td>2</td><td>Crête (élévation de la ligne)</td></tr>
  <tr><td>3</td><td>Crête + néovascularisation extrarétinienne</td></tr>
  <tr><td>4a</td><td>DR partiel sans atteinte maculaire</td></tr>
  <tr><td>4b</td><td>DR partiel avec atteinte maculaire</td></tr>
  <tr><td>5</td><td>DR total</td></tr>
</table>
<div class="info-box"><strong>Maladie Plus</strong>Dilatation et tortuosités veineuses dans ≥2 quadrants au pôle postérieur. Signe de gravité — indicateur d'activité néovasculaire. Traitement urgent si présent avec stade ≥3.</div>
<div class="section-title">Traitement</div>
<table class="kanski-table">
  <tr><th>Indication</th><th>Traitement</th><th>Délai</th></tr>

  <tr><td>Zone I tout stade + Plus</td><td>Anti-VEGF IVT en urgence (bévacizumab ou ranibizumab)</td><td>Urgence absolue</td></tr>
  <tr><td>Stade 4a</td><td>Vitrectomie ± scléroplombige</td><td>Rapide</td></tr>
</table>`,

    'ch13-macan': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Macroanévrisme & Télangiectasies</div>
<div class="page-subtitle">Chapitre 13 · Pages 540–546</div>
<div class="section-title">Macroanévrisme artériel rétinien</div>
<p class="body-text">Dilatation acquise d'une artère rétinienne aux croisements AV. Femme âgée hypertendue +++. Unilatéral 90 %.</p>
<div class="card-grid">
  <div class="card blue"><h4>Clinique</h4><ul>
    <li>Souvent asymptomatique (découverte fortuite)</li>
    <li>Hémorragie en « sablier » (sous-, intra- et pré-rétinienne)</li>
    <li>Exsudats lipidiques circinés</li>
    <li>BAV si atteinte maculaire</li>
  </ul></div>
  <div class="card green"><h4>Évolution & Traitement</h4><ul>
    <li>Résolution spontanée fréquente (thrombose)</li>
    <li>Laser focal si exsudation maculaire persistante</li>
    <li>Anti-VEGF IVT si OME associé</li>
    <li>Contrôle tensionnel +++ (facteur causal)</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">Maladie de Coats</div>
<p class="body-text">Télangiectasies rétiniennes avec exsudation lipidique massive. Garçon 6–10 ans, unilatéral 95 %. Leucocorie possible → DD rétinoblastome !</p>
<div class="card-grid">
  <div class="card red"><h4>Clinique</h4><ul>
    <li>Leucocorie ou strabisme comme révélation</li>
    <li>Télangiectasies périphériques en « ampoule »</li>
    <li>Exsudats sous-rétiniens massifs jaune-orangés</li>
    <li>DR exsudatif dans les formes évoluées</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Photocoagulation laser des télangiectasies (stades 1–3)</li>
    <li>Cryothérapie si très périphériques</li>
    <li>Anti-VEGF IVT en adjuvant</li>
    <li>Vitrectomie si DR tractionnel</li>
  </ul></div>
</div>`,

    'ch13-autres': () => `
<div class="page-title"><em>Maladies vasculaires</em> — Autres rétinopathies</div>
<div class="page-subtitle">Chapitre 13 · Pages 532–536, 547–550</div>
<div class="section-title">Rétinopathie hypertensive</div>
<table class="kanski-table">

  <tr><td>III</td><td>Nodules cotonneux + hémorragies</td><td>HTA sévère avec ischémie</td></tr>

</table>
<div class="alert"><strong>Crise hypertensive maligne (Grade IV)</strong>Urgence médicale absolue — baisse progressive et contrôlée de la PA.</div>

<div class="section-title">Rétinopathie de Purtscher</div>
<p class="body-text">Rétinopathie après compression thoracique ou maladies systémiques (pancréatite, lupus, embolie graisseuse). Nodules cotonneux péripapillaires + hémorragies.</p>

  <span class="badge">Trauma thoracique/crânien</span><span class="badge">Pancréatite aiguë</span><span class="badge">Lupus, TTP</span><span class="badge red">Nodules cotonneux péripapillaires</span><span class="badge gold">Traitement de la cause</span>
</div>`,

    'ch14-membrane': () => `
<div class="page-title"><em>Pathologies maculaires</em> — Anomalies de l'interface vitréomaculaire</div>
<div class="page-subtitle">Chapitre 14 · Pages 592–597</div>
<div class="section-title">Membrane épirétinienne (MER)</div>
<div class="card-grid">
  <div class="card"><h4>Étiologies</h4><ul>
    <li><strong>Idiopathique</strong> (DPV incomplet) : prévalence 6,5 % adultes âgés</li>
    <li>Secondaire : post-chirurgie DR, déchirure, PPR, vascularite, trauma</li>
  </ul></div>
  <div class="card blue"><h4>Diagnostic OCT</h4><ul>
    <li>Couche hyperréflective en surface rétinienne</li>
    <li>Épaississement rétinien ± déformation vasculaire</li>
    <li>Pseudo-trou maculaire (DD avec trou vrai)</li>
  </ul></div>
</div>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance si légère et non évolutive</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Vitrectomie + pelage MER</strong> : amélioration métamorphopsies 75 %, AV ≥ 2 lignes 75 %</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Amélioration visuelle lente sur plusieurs mois. Récidive rare</div></div>
</div>
<div class="divider"></div>
<div class="section-title">Trou maculaire de pleine épaisseur (TMPE)</div>
<p class="body-text">Défect de pleine épaisseur centré sur la fovéa. Prévalence ~3/1000. Femmes 60–70 ans. Risque œil adelphe ~10 % à 5 ans. Souvent précédé d'une TVM.</p>
<table class="kanski-table">
  <tr><th>Taille (OCT)</th><th>Pronostic chirurgical</th></tr>
  <tr><td>&lt; 250 μm (petit)</td><td>Excellent &gt;90 %</td></tr>
  <tr><td>250–400 μm (moyen)</td><td>Bon ~80 %</td></tr>
  <tr><td>&gt; 400 μm (grand)</td><td>Moins bon 60–70 %</td></tr>
</table>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Vitrectomie + pelage MLI + tamponnement gazeux</strong> (SF6 ou C3F8) : taux de fermeture 90–95 % petits/moyens</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Position face vers le bas 1–2 semaines obligatoire</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Ocriplasmine IVT</strong> : petite TVM &lt;250 μm — lyse enzymatique non chirurgicale</div></div>
</div>`,

    'ch14-omc': () => `
<div class="page-title"><em>Pathologies maculaires</em> — Œdème maculaire cystoïde</div>
<div class="page-subtitle">Chapitre 14 · Pages 602–604</div>
<div class="section-title">Introduction</div>
<p class="body-text">Accumulation de liquide dans les couches plexiforme externe et nucléaire interne formant des microkystes. Réponse non spécifique à diverses agressions. La coalescence → trou lamellaire et BAV irréversible.</p>
<div class="two-col">
<div>
<div class="card"><h4>Étiologies principales</h4><ul>
  <li>Chirurgie oculaire (syndrome d'Irvine-Gass)</li>
  <li>Rétinopathie diabétique (OMD)</li>
  <li>Occlusion veineuse rétinienne</li>
  <li>Uvéite intermédiaire/chronique</li>
  <li>Prostaglandines topiques (glaucome)</li>
  <li>Rétinite pigmentaire</li>
  <li>Traction vitréomaculaire / MER</li>
</ul></div>
</div>
<div>
<div class="card blue"><h4>Diagnostic</h4><ul>
  <li><strong>OCT</strong> : espaces hyporéflectifs intra-rétiniens + épaississement fovéal + perte dépression fovéale</li>
  <li><strong>AFG</strong> : pattern pétalloïde hyperfluorescent tardif (« pétales de fleur »)</li>
</ul></div>
</div>
</div>
<div class="section-title">Traitement selon étiologie</div>
<table class="kanski-table">
  <tr><th>Étiologie</th><th>Traitement de 1re ligne</th></tr>
  <tr><td>Diabétique (OMD)</td><td>Anti-VEGF IVT</td></tr>
  <tr><td>OVR</td><td>Anti-VEGF IVT ou Ozurdex</td></tr>
  <tr><td>Uvéite / inflammatoire</td><td>Corticoïdes (topiques, péri-oculaires, Ozurdex)</td></tr>
  <tr><td>Prostaglandines</td><td>Arrêt + AINS topiques</td></tr>
  <tr><td>Post-chirurgical (Irvine-Gass)</td><td>AINS topiques + corticoïdes topiques ± acétazolamide</td></tr>
  <tr><td>Rétinite pigmentaire</td><td>Acétazolamide oral (Diamox)</td></tr>
  <tr><td>MER / TVM</td><td>Vitrectomie + pelage</td></tr>
</table>`,

    'ch14-myopie': () => `
<div class="page-title"><em>Pathologies maculaires</em> — Myopie dégénérative</div>
<div class="page-subtitle">Chapitre 14 · Pages 604–612</div>
<div class="section-title">Définition & Épidémiologie</div>
<p class="body-text">Myopie pathologique : ≥ −6 D ou longueur axiale ≥ 26 mm, avec modifications choroïdiennes et sclérales. 1re cause de cécité dans certains pays d'Asie du Sud-Est. Associations : Down, Stickler, Marfan, Ehlers-Danlos, prématurité.</p>
<div class="section-title">Lésions du fundus</div>
<div class="card-grid">
  <div class="card"><h4>Aspects typiques</h4><ul>
    <li>Fond d'œil en « mosaïque » (vaisseaux choroïdiens visibles)</li>
    <li>Atrophie choriorétinienne focale ou diffuse</li>
    <li>Dysversion papillaire + croissant temporal</li>
    <li>Staphylome postérieur</li>
    <li>Dégénérescence palissadique fréquente</li>
  </ul></div>
  <div class="card red"><h4>Complications maculaires</h4><ul>
    <li>Ruptures membrane de Bruch → hémorragies en « pièce »</li>
    <li>Tache de Fuchs (cicatrice pigmentée post-hémorragie)</li>
    <li><strong>NVC</strong> (10 % des yeux ≥ −6 D) → anti-VEGF</li>
    <li>Fovéoschisis (rétinoschisis) → vitrectomie si évolutif</li>
    <li>Trou maculaire myopique → DR maculaire</li>
    <li>Cavitation intrachoroïdienne péripapillaire</li>
  </ul></div>
</div>
<div class="section-title">Traitement de la NVC myopique</div>
<div class="protocol">
  <h4>Anti-VEGF IVT</h4>
  <div class="protocol-item"><div class="dot"></div><div>Traitement de référence. Nombre d'injections souvent inférieur à la DMLA</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Risque de DR rhegmatogène plus élevé qu'en DMLA → surveiller</div></div>
  <div class="protocol-item"><div class="dot"></div><div>PDT : alternative si échec anti-VEGF</div></div>
</div>`,

    'ch19-img': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Neuro-imagerie</div>
<div class="page-subtitle">Chapitre 19 · Pages 746–751</div>
<div class="section-title">TDM vs IRM</div>
<div class="card-grid">
  <div class="card blue"><h4>TDM — Indications prioritaires</h4><ul>
    <li>Fractures orbitaires (traumatisme)</li>
    <li>Corps étrangers métalliques intra-orbitaires</li>
    <li>Calcifications (méningiome, craniopharyngiome)</li>
    <li>Hémorragie intracrânienne aiguë (hyperdense)</li>

  </ul></div>
  <div class="card gold"><h4>IRM — Supérieure pour</h4><ul>
    <li>Nerf optique (séquence STIR)</li>
    <li>Lésions de démyélinisation (T2/FLAIR)</li>
    <li>AVC récent (DWI)</li>
    <li>Tumeurs (T1 gadolinium)</li>
    <li>Anévrismes (ARM)</li>
    <li>Fosse postérieure, tronc cérébral</li>
  </ul></div>
</div>
<div class="section-title">Séquences IRM clés</div>
<table class="kanski-table">
  <tr><th>Séquence</th><th>Utilité principale en neuro-ophtalmo</th></tr>
  <tr><td><strong>T2 / FLAIR</strong></td><td>Démyélinisation SEP (plaques périventriculaires), œdème, ischémie</td></tr>

  <tr><td><strong>T1 gadolinium</strong></td><td>Prise de contraste NO (névrite optique), tumeurs, méningiomes</td></tr>
  <tr><td><strong>STIR</strong></td><td>Nerf optique intra-orbitaire (suppression graisse)</td></tr>
  <tr><td><strong>ARM</strong></td><td>Anévrismes (&gt;95 % sensibilité si &gt;3 mm), dissection, thrombose sinus</td></tr>
</table>

  <div class="card red"><h4>IRM/ARM urgente</h4><ul>
