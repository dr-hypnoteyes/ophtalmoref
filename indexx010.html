    'ch18-visionbino': () => `
<div class="page-title"><em>Strabisme</em> — Vision binoculaire</div>
<div class="page-subtitle">Chapitre 18 · Pages 706–709</div>
<div class="section-title">Bases de la vision binoculaire normale</div>
<p class="body-text">La vision binoculaire simple (VBS) est la capacité à fusionner les images des deux yeux en une perception unique. Elle dépend de l'alignement précis des axes visuels, de l'intégrité des voies sensorielles et du développement normal pendant la période critique.</p>
<div class="card-grid">
  <div class="card blue"><h4>Grades de la VBS (Worth)</h4><ul>
    <li><strong>Grade 1</strong> : Perception simultanée (les deux yeux voient en même temps, sans nécessairement fusionner)</li>
    <li><strong>Grade 2</strong> : Fusion (images des deux yeux combinées en une seule)</li>
    <li><strong>Grade 3</strong> : Stéréoscopie (perception de la profondeur par disparité binoculaire)</li>
  </ul></div>
  <div class="card"><h4>Tests cliniques</h4><ul>
    <li><strong>Test des quatre lumières de Worth</strong> : évalue la perception simultanée et détecte la suppression ou la diplopie</li>
    <li><strong>Test de Bagolini</strong> : évalue la fusion et la correspondance rétinienne en condition naturelle</li>
    <li><strong>TNO, Randot, Lang</strong> : stéréoacuité (en secondes d'arc — normal : &lt;60 arc secondes)</li>
    <li><strong>Synoptophore</strong> : mesure tous grades de VBS, utile en rééducation</li>
  </ul></div>
</div>
<div class="section-title">Correspondance rétinienne</div>
<div class="card-grid">
  <div class="card"><h4>CRN vs CRA</h4><ul>
    <li><strong>Correspondance rétinienne normale (CRN)</strong> : deux fovéas correspondent. Condition normale</li>
    <li><strong>Correspondance rétinienne anormale (CRA)</strong> : la fovéa d'un œil correspond à une zone non fovéale de l'autre œil. Adaptation sensorielle au strabisme chronique précoce</li>
    <li>La CRA est une adaptation qui empêche la diplopie mais bloque la fusion véritable</li>
    <li>Valeur pronostique pour le résultat fonctionnel de la chirurgie</li>
  </ul></div>
</div>
<div class="section-title">Neutralisation (suppression)</div>
<p class="body-text">Dans le strabisme de l'enfant, le cortex visuel apprend à ignorer activement l'image de l'œil dévié pour éviter la diplopie et la confusion. Cette neutralisation est une adaptation fonctionnelle qui prévient la diplopie mais aboutit à l'amblyopie si non traitée.</p>`,

    'ch18-evaluation': () => `
<div class="page-title"><em>Strabisme</em> — Évaluation clinique</div>
<div class="page-subtitle">Chapitre 18 · Pages 709–726</div>
<div class="section-title">Anamnèse</div>
<div class="card-grid">
  <div class="card"><h4>Points clés de l'histoire</h4><ul>
    <li>Âge d'apparition du strabisme (précoce = congénital)</li>
    <li>Constance vs intermittence</li>
    <li>Œil dévié (constant = risque d'amblyopie élevé)</li>
    <li>Diplopie (adulte surtout)</li>
    <li>Couverture d'un œil (soleil, exotropie intermittente)</li>
    <li>Antécédents familiaux de strabisme</li>
    <li>Antécédents médicaux : prématurité, retard de développement, NF1</li>
  </ul></div>
</div>
<div class="section-title">Examen systématique</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>AV monoculaire et binoculaire</strong> : indispensable avant tout. Tester chaque œil séparément</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Motilité oculaire</strong> : 9 positions du regard. Versions (binoculaire) et ductions (monoculaire)</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Reflet cornéen de Hirschberg</strong> : 15° ≈ 1 mm de déviation du reflet</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Cover test + cover-uncover test</strong> : mettre en évidence tropie et phorie</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content"><strong>Mesure avec prismes</strong> (prisme + cover test) : quantifier la déviation en dioptries prismatiques (Δ)</div></div>
  <div class="step"><div class="step-num">6</div><div class="step-content"><strong>Réfraction sous cycloplégie</strong> : obligatoire chez l'enfant (atropine 1 % ou cyclopentolate 1 %)</div></div>
  <div class="step"><div class="step-num">7</div><div class="step-content"><strong>Fond d'œil</strong> : éliminer cause organique (rétinoblastome, DR, tumeur…)</div></div>
</div>
<div class="section-title">Prescriptions optiques</div>
<div class="card-grid">
  <div class="card blue"><h4>Quand corriger ?</h4><ul>
    <li><strong>Hypermétropie</strong> : &gt;4 D sans strabisme. Totalité si strabisme présent (même avant 2 ans)</li>
    <li><strong>Astigmatisme</strong> : &gt;1,5 D à corriger (risque amblyopie méridionale)</li>
    <li><strong>Myopie</strong> : correction selon âge et activités visuelles</li>
    <li><strong>Anisométropie</strong> : corriger toute différence &gt;1 D</li>
  </ul></div>
</div>`,

    'ch18-paralytique': () => `
<div class="page-title"><em>Strabisme</em> — Strabisme paralytique & Restriction mécanique</div>
<div class="page-subtitle">Chapitre 18 · Pages 737–742</div>
<div class="section-title">Paralysie monoculaire de l'élévation</div>
<p class="body-text">Absence d'élévation unilatérale dans les deux yeux (adduction et abduction). Peut être paralytique (grand oblique + droit supérieur) ou restrictive (fibrose). Hypotropie homolatérale en position primaire avec position compensatrice menton élevé.</p>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Ptosis homolatéral fréquent (neurogène ou mécanique)</li>
    <li>Hypotropie en position primaire</li>
    <li>Torticolis (menton relevé)</li>
    <li>Test de duction forcée : distingue paralysie de restriction</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Recul du droit inférieur ipsilatéral (désinsertion de la restriction)</li>
    <li>Transposition de Knapp (droits médiaux et latéraux vers la papille)</li>
    <li>Traitement du ptosis secondairement si nécessaire</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">Syndrome de Brown</div>
<div class="retenir"><strong>À retenir</strong>Limitation de l'élévation en adduction par restriction du tendon du muscle oblique supérieur dans sa trochlée. Congénital le plus souvent. Traitement uniquement si hypotropie en position primaire ou torticolis invalidant.</div>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Élévation limitée en adduction (signe cardinal)</li>
    <li>Abaissement en adduction possible (formes sévères)</li>
    <li>Hypotropie en position primaire (formes sévères)</li>
    <li>Torticolis : menton relevé + tête tournée côté opposé</li>
    <li>« Clic syndrome » : bruit audible (forme congénitale)</li>
  </ul></div>
  <div class="card"><h4>Formes acquises</h4><ul>
    <li>Traumatisme de la trochlée</li>
    <li>Polyarthrite rhumatoïde (inflammation tendineuse)</li>
    <li>Pansinusite</li>
    <li>Sclérite</li>
    <li>Traitement de la cause ± corticoïdes péritrochlée</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">Syndromes alphabétiques (A et V)</div>
<p class="body-text">Modification de la déviation horizontale selon l'élévation ou l'abaissement du regard. Un syndrome V : ésotropie plus grande en haut, exotropie plus grande en bas (ouverture en V). Un syndrome A : l'inverse.</p>
<div class="badge-list">
  <span class="badge">Syndrome V : hyperaction des muscles obliques inférieurs +++</span>
  <span class="badge">Syndrome A : hyperaction des muscles obliques supérieurs</span>
  <span class="badge blue">Traitement : affaiblissement des obliques ± déplacement vertical des droits</span>
</div>`,

    // ── CH20 ENRICHISSEMENT ────────────────────────────────
    'ch20-iris': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Tumeurs de l'iris & Corps ciliaire</div>
<div class="page-subtitle">Chapitre 20 · Pages 838–844</div>
<div class="section-title">Tumeurs de l'iris</div>
<div class="card-grid">
  <div class="card"><h4>Nævus de l'iris</h4><ul>
    <li>Tumeur iriéenne la plus fréquente</li>
    <li>Plage pigmentée plate, limite nette, surface régulière</li>
    <li>Non vascularisée, &lt;3 mm, pas de croissance</li>
    <li>Surveillance photographique annuelle</li>
  </ul></div>
  <div class="card red"><h4>Mélanome de l'iris</h4><ul>
    <li>10 % des mélanomes uvéaux (meilleur pronostic que choroïdien)</li>
    <li>Masse nodulaire pigmentée (&gt;3 mm, épaisse), croissance documentée</li>
    <li>Ectropion uvéal, distorsion pupillaire</li>
    <li>Glaucome secondaire par invasion de l'angle</li>
    <li>FDR : peau claire, yeux clairs, exposition UV, nævi multiples</li>
    <li>Traitement : résection chirurgicale ou radiothérapie (protons/plaque)</li>
  </ul></div>
  <div class="card"><h4>Mélanocytome papillaire</h4><ul>
    <li>Tumeur bénigne à pigmentation noire intense péripapillaire</li>
    <li>Peut envahir le vitré (bénin)</li>
    <li>1 % de risque de transformation maligne</li>
    <li>Surveillance photographique</li>
  </ul></div>
</div>
<div class="section-title">Tumeurs du corps ciliaire</div>
<div class="card-grid">
  <div class="card"><h4>Médulloépithéliome</h4><ul>
    <li>Rare, enfants &lt;10 ans le plus souvent</li>
    <li>Masse kystique brune-blanche du corps ciliaire</li>
    <li>Extension segment antérieur possible</li>
    <li>DD rétinoblastome (chez l'enfant)</li>
    <li>Exérèse chirurgicale</li>
  </ul></div>
  <div class="card red"><h4>Mélanome du corps ciliaire</h4><ul>
    <li>Extension souvent silencieuse jusqu'à atteinte de la chambre antérieure</li>
    <li>Dilatation des vaisseaux épiscléraux sentinelles</li>
    <li>Cataracte asymétrique sectorielle par contact</li>
    <li>Traitement : protonthérapie ou énucléation si volumineuse</li>
  </ul></div>
</div>
<div class="section-title">Hémangiome choroïdien (rappel)</div>
<div class="info-box"><strong>Hémangiome circonscrit vs diffus</strong>Circonscrit : isolé, sporadique, traitable par PDT. Diffus : associé au syndrome de Sturge-Weber (angiome facial + glaucome congénital + hémangiome ipsilatéral). Traitement difficile, risque de DR exsudatif diffus.</div>`,

    'ch20-vasculaires': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Tumeurs vasculaires rétiniennes</div>
<div class="page-subtitle">Chapitre 20 · Pages 874–882</div>
<div class="section-title">Hémangioblastome rétinien (Angiomatose de Von Hippel)</div>
<div class="retenir"><strong>À retenir</strong>L'hémangioblastome rétinien est la manifestation oculaire de la maladie de Von Hippel-Lindau (VHL). Dans la maladie VHL, les tumeurs sont multifocales et bilatérales. Dépistage systémique indispensable.</div>
<div class="card-grid">
  <div class="card blue"><h4>Clinique</h4><ul>
    <li>Masse rouge-orange vasculaire</li>
    <li>Vaisseaux nourriciers dilatés et tortueux (artère et veine)</li>
    <li>Exsudats lipidiques, hémorragies, DSR exsudatif</li>
    <li>Localisations : périphérie (classique) ou papillaire (forme endophytique)</li>
    <li>Peut être asymptomatique si périphérique</li>
  </ul></div>
  <div class="card red"><h4>Maladie de VHL (chromosome 3p25)</h4><ul>
    <li>AD, gène VHL suppresseur de tumeur</li>
    <li>Hémangioblastomes rétiniens (bilatéraux dans 50 %)</li>

function buildNav() {
  const nav = document.getElementById('nav-tree');
  CHAPTERS.forEach(ch => {
    const group = document.createElement('div');
    group.className = 'chapter-group';
    group.dataset.chId = ch.id;

    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.innerHTML = `<span class="chapter-num">${ch.num}</span>${ch.title}`;
    btn.onclick = () => {
      toggleChapter(ch.id);
      navigate(ch.id, ch.title, `Chapitre ${ch.num}`);
    };
    group.appendChild(btn);

    const list = document.createElement('div');
    list.className = 'section-list';
    list.id = `section-list-${ch.id}`;

    ch.sections.forEach(sec => {
      const sb = document.createElement('button');
      sb.className = 'section-btn';
      sb.textContent = sec.title;
      sb.dataset.secId = sec.id;
      sb.onclick = (e) => {
        e.stopPropagation();
        navigate(sec.id, sec.title, ch.title);
      };
      list.appendChild(sb);

      if (sec.subs && sec.subs.length) {
        const subList = document.createElement('div');
        subList.className = 'subsection-list';
        subList.id = `sub-list-${sec.id}`;
        sec.subs.forEach(sub => {
          const ssb = document.createElement('button');
          ssb.className = 'subsection-btn';
          ssb.textContent = sub;
          ssb.onclick = (e) => {
            e.stopPropagation();
            navigate(sec.id, sec.title, ch.title);
          };
          subList.appendChild(ssb);
        });
        list.appendChild(subList);
        sb.onclick = (e) => {
          e.stopPropagation();
          const sl = document.getElementById(`sub-list-${sec.id}`);
          sl.classList.toggle('open');
          navigate(sec.id, sec.title, ch.title);
        };
      }
    });
    group.appendChild(list);
    nav.appendChild(group);
  });
}

function toggleChapter(chId) {
  const list = document.getElementById(`section-list-${chId}`);
  list.classList.toggle('open');
}

function navigate(id, title, parent) {
  // Update active states
  document.querySelectorAll('.chapter-btn, .section-btn, .subsection-btn').forEach(b => b.classList.remove('active'));

  const chId = id.split('-').slice(0,1).join('') + id.split('-')[1] ? id.match(/^ch\d+/)?.[0] : id;
  const btn = document.querySelector(`[data-sec-id="${id}"]`) || document.querySelector(`[data-ch-id="${id}"] .chapter-btn`);
  if (btn) btn.classList.add('active');

  // Update breadcrumb
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = `<span>Kanski</span><span class="sep">›</span><span>${parent}</span>` + (title !== parent ? `<span class="sep">›</span><span style="color:var(--text)">${title}</span>` : '');

  // Render content
  const area = document.getElementById('content-area');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';
  area.innerHTML = getContent(id) || defaultSection(id);
  area.scrollTop = 0;

  // Open parent chapter
  const chMatch = id.match(/^(ch\d+)/);
  if (chMatch) {
    const chId = chMatch[1];
    document.getElementById(`section-list-${chId}`)?.classList.add('open');
    const chBtn = document.querySelector(`[data-ch-id="${chId}"] .chapter-btn`);
    if (chBtn) chBtn.classList.add('active');
  }
}

function toggleBlock(header) {
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

function searchNav(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.section-btn').forEach(btn => {
    const visible = !q || btn.textContent.toLowerCase().includes(q);
    btn.style.display = visible ? '' : 'none';
    if (visible && q) btn.parentElement.classList.add('open');
  });
  document.querySelectorAll('.chapter-btn').forEach(btn => {
    const group = btn.parentElement;
    const anyVisible = [...group.querySelectorAll('.section-btn')].some(b => b.style.display !== 'none');
    btn.style.display = (!q || anyVisible || btn.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════════════
//  WELCOME SCREEN CARDS
// ═══════════════════════════════════════════════════════════
function buildWelcomeCards() {
  const container = document.getElementById('welcome-cards');
  CHAPTERS.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'ch-card';
    card.innerHTML = `<div class="num">Chapitre ${ch.num}</div><div class="name">${ch.title}</div>`;
    card.onclick = () => navigate(ch.id, ch.title, `Chapitre ${ch.num}`);
    container.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
buildNav();
buildWelcomeCards();

// Make toggleBlock global
window.toggleBlock = toggleBlock;
</script>
