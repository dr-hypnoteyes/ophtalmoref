<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanski — Ophtalmologie Clinique</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f1117;
  --surface: #161b27;
  --surface2: #1e2535;
  --border: #2a3348;
  --accent: #4a9eff;
  --accent2: #7fb3ff;
  --gold: #e8c97a;
  --gold2: #f5dfa0;
  --text: #e2e8f5;
  --text2: #9daec8;
  --text3: #6b7fa0;
  --danger: #f87171;
  --success: #4ade80;
  --warn: #fbbf24;
  --sidebar-w: 300px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#sidebar-header h1 {
  font-family: 'Crimson Pro', serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.02em;
  line-height: 1.2;
}

#sidebar-header p {
  font-size: 0.72rem;
  color: var(--text3);
  margin-top: 3px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

#search-box {
  margin: 12px 12px 8px;
  padding: 8px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.8rem;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  width: calc(100% - 24px);
  transition: border-color 0.2s;
}
#search-box:focus { border-color: var(--accent); }
#search-box::placeholder { color: var(--text3); }

#nav-tree {
  overflow-y: auto;
  flex: 1;
  padding: 6px 0 20px;
}

#nav-tree::-webkit-scrollbar { width: 4px; }
#nav-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.chapter-group { margin-bottom: 2px; }

.chapter-btn {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 9px 16px 9px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text2);
  font-size: 0.8rem;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  border-radius: 0 6px 6px 0;
  margin-right: 8px;
}

.chapter-btn:hover { background: var(--surface2); color: var(--text); }
.chapter-btn.active { border-left-color: var(--gold); color: var(--gold); background: rgba(232,201,122,0.07); }

.chapter-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--text3);
  background: var(--surface2);
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
}

.chapter-btn.active .chapter-num { background: rgba(232,201,122,0.15); color: var(--gold); }

.section-list {
  display: none;
  padding: 0 0 4px 22px;
}
.section-list.open { display: block; }

.section-btn {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 5px 12px 5px 8px;
  cursor: pointer;
  color: var(--text3);
  font-size: 0.74rem;
  font-family: 'DM Sans', sans-serif;
  border-left: 1px solid var(--border);
  margin-left: 4px;
  transition: all 0.15s;
  border-radius: 0 4px 4px 0;
  line-height: 1.4;
}
.section-btn:hover { color: var(--accent2); border-left-color: var(--accent); }
.section-btn.active { color: var(--accent); border-left-color: var(--accent); background: rgba(74,158,255,0.06); }

.subsection-list {
  display: none;
  padding-left: 12px;
}
.subsection-list.open { display: block; }

.subsection-btn {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 4px 8px;
  cursor: pointer;
  color: var(--text3);
  font-size: 0.7rem;
  font-family: 'DM Sans', sans-serif;
  border-left: 1px dashed var(--border);
  margin-left: 4px;
  transition: all 0.15s;
  border-radius: 0 3px 3px 0;
  line-height: 1.3;
}
.subsection-btn:hover { color: var(--accent2); }
.subsection-btn.active { color: var(--accent); background: rgba(74,158,255,0.04); }

/* ── MAIN CONTENT ────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#topbar {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 8px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 0.75rem;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.breadcrumb span { color: var(--text2); }
.breadcrumb .sep { color: var(--text3); }

#content-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px 60px;
}
#content-area::-webkit-scrollbar { width: 6px; }
#content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── CONTENT STYLES ──────────────────────────────────────── */
.page-title {
  font-family: 'Crimson Pro', serif;
  font-size: 2.2rem;
  font-weight: 300;
  color: var(--text);
  margin-bottom: 8px;
  line-height: 1.2;
}
.page-title em { color: var(--gold); font-style: normal; }

.page-subtitle {
  font-size: 0.8rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-family: 'Crimson Pro', serif;
  font-size: 1.55rem;
  font-weight: 600;
  color: var(--gold);
  margin: 36px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(232,201,122,0.2);
}

.subsection-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent2);
  margin: 24px 0 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.82rem;
}

.sub2-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  margin: 18px 0 8px;
}

p.body-text {
  color: var(--text2);
  font-size: 0.88rem;
  line-height: 1.75;
  margin-bottom: 12px;
}

/* Cards */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin: 16px 0;
}

.card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--accent); }
.card h4 {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.card ul { list-style: none; }
.card ul li {
  font-size: 0.81rem;
  color: var(--text2);
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  line-height: 1.5;
}
.card ul li:last-child { border-bottom: none; }
.card ul li::before { content: '›'; color: var(--accent); margin-right: 6px; font-size: 0.9rem; }

.card.gold { border-color: rgba(232,201,122,0.3); }
.card.gold h4 { color: var(--gold); }
.card.red { border-color: rgba(248,113,113,0.3); }
.card.red h4 { color: var(--danger); }
.card.green { border-color: rgba(74,222,128,0.3); }
.card.green h4 { color: var(--success); }
.card.blue { border-color: rgba(74,158,255,0.3); }
.card.blue h4 { color: var(--accent); }

/* À RETENIR box */
.retenir {
  background: rgba(232,201,122,0.08);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin: 16px 0;
  font-size: 0.84rem;
  color: var(--gold2);
  line-height: 1.65;
  font-style: italic;
}
.retenir strong { font-style: normal; color: var(--gold); display: block; margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }

/* Warning / Alert box */
.alert {
  background: rgba(248,113,113,0.08);
  border-left: 3px solid var(--danger);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin: 16px 0;
  font-size: 0.84rem;
  color: #fca5a5;
  line-height: 1.65;
}
.alert strong { color: var(--danger); display: block; margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }

/* Info box */
.info-box {
  background: rgba(74,158,255,0.07);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin: 16px 0;
  font-size: 0.84rem;
  color: var(--accent2);
  line-height: 1.65;
}
.info-box strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }

/* Table */
.kanski-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 0.8rem;
}
.kanski-table th {
  background: var(--surface2);
  color: var(--gold);
  text-align: left;
  padding: 9px 12px;
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 2px solid var(--border);
}
.kanski-table td {
  padding: 8px 12px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
  vertical-align: top;
}
.kanski-table tr:hover td { background: rgba(255,255,255,0.02); }
.kanski-table .tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
}
.tag-red { background: rgba(248,113,113,0.15); color: #fca5a5; }
.tag-green { background: rgba(74,222,128,0.15); color: #86efac; }
.tag-blue { background: rgba(74,158,255,0.15); color: var(--accent2); }
.tag-gold { background: rgba(232,201,122,0.15); color: var(--gold); }

/* Two-col layout */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
@media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }

/* Badge list */
.badge-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
}
.badge.accent { border-color: rgba(74,158,255,0.4); color: var(--accent2); background: rgba(74,158,255,0.08); }
.badge.gold { border-color: rgba(232,201,122,0.4); color: var(--gold); background: rgba(232,201,122,0.08); }
.badge.red { border-color: rgba(248,113,113,0.4); color: #fca5a5; background: rgba(248,113,113,0.08); }
.badge.green { border-color: rgba(74,222,128,0.4); color: #86efac; background: rgba(74,222,128,0.08); }

/* Numbered steps */
.steps { counter-reset: step; margin: 12px 0; }
.step {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
  align-items: flex-start;
}
.step-num {
  counter-increment: step;
  flex-shrink: 0;
  width: 24px; height: 24px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  margin-top: 1px;
}
.step-content { font-size: 0.84rem; color: var(--text2); line-height: 1.65; }
.step-content strong { color: var(--text); }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 28px 0; }

/* Welcome screen */
#welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px;
}
#welcome h2 {
  font-family: 'Crimson Pro', serif;
  font-size: 2.8rem;
  font-weight: 300;
  color: var(--gold);
  margin-bottom: 12px;
}
#welcome p { color: var(--text3); font-size: 0.9rem; max-width: 420px; line-height: 1.7; }

.chapter-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 32px;
  width: 100%;
  max-width: 700px;
}
.ch-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.ch-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.ch-card .num { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text3); }
.ch-card .name { font-size: 0.82rem; font-weight: 500; color: var(--text2); margin-top: 4px; line-height: 1.3; }

/* Anatomy layers */
.layer-stack { margin: 16px 0; }
.layer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-left: 3px solid var(--border);
  margin-bottom: 6px;
  background: var(--surface2);
  border-radius: 0 8px 8px 0;
  transition: border-color 0.2s;
}
.layer:hover { border-left-color: var(--accent); }
.layer-name { font-weight: 600; color: var(--text); font-size: 0.82rem; min-width: 160px; }
.layer-desc { font-size: 0.79rem; color: var(--text2); line-height: 1.5; }
.layer-num { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text3); background: var(--bg); padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }

/* Pathology block */
.path-block {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 14px 0;
  overflow: hidden;
}
.path-block-header {
  padding: 12px 16px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  color: var(--text);
  font-size: 0.88rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
.path-block-header:hover { background: rgba(255,255,255,0.05); }
.path-block-body {
  padding: 14px 16px;
  display: none;
}
.path-block-body.open { display: block; }
.path-block-header .toggle { color: var(--text3); font-size: 1rem; transition: transform 0.2s; }
.path-block-header.open .toggle { transform: rotate(45deg); }

/* Treatment protocol */
.protocol {
  background: var(--surface2);
  border: 1px solid rgba(74,158,255,0.2);
  border-radius: 10px;
  padding: 16px;
  margin: 14px 0;
}
.protocol h4 {
  color: var(--accent);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
  font-weight: 600;
}
.protocol-item {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 0.82rem;
  color: var(--text2);
  line-height: 1.6;
}
.protocol-item .dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
}

/* Search highlight */
.highlight { background: rgba(232,201,122,0.25); border-radius: 2px; padding: 0 2px; }

</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>Kanski</h1>
    <p>Ophtalmologie Clinique · 9e éd.</p>
  </div>
  <input type="text" id="search-box" placeholder="Rechercher une section…" oninput="searchNav(this.value)">
  <nav id="nav-tree"></nav>
</aside>

<!-- MAIN -->
<main id="main">
  <div id="topbar">
    <div class="breadcrumb" id="breadcrumb">
      <span>Kanski</span>
    </div>
  </div>
  <div id="content-area">
    <div id="welcome">
      <h2>Ophtalmologie Clinique</h2>
      <p>Naviguez dans les chapitres prioritaires du Kanski, extraits fidèlement du livre et présentés de manière structurée.</p>
      <div class="chapter-cards" id="welcome-cards"></div>
    </div>
  </div>
</main>

    'ch7': () => chapterHome('Cornée','7','La cornée est une structure complexe responsable des ¾ du pouvoir optique de l\'œil, densément innervée et avasculaire.',
      ['Introduction','Kératites bactériennes','Kératites fongiques','Kératites herpétiques','Zona ophtalmique','Kératites interstitielles','Kératite amibienne','Kératites marginales','Ulcère cornéen périphérique','Kératite neurotrophique','Ectasies cornéennes','Dystrophies cornéennes','Dégénérescences','Lentilles de contact']),

    'ch7-intro': () => `
<div class="page-title"><em>Cornée</em> — Introduction</div>
<div class="page-subtitle">Chapitre 7 · Anatomie, physiologie, sémiologie</div>

<div class="section-title">Anatomie et physiologie</div>
<p class="body-text">La cornée est une structure complexe qui assure environ <strong style="color:var(--text)">¾ du pouvoir optique de l'œil</strong> (≈ 43 D sur 58 D totaux). Elle est <strong style="color:var(--text)">avasculaire</strong> — nutriments apportés par l'humeur aqueuse en arrière et les larmes en avant — et constitue le tissu le plus densément innervé de l'organisme (première division du V).</p>

<div class="retenir"><strong>À retenir</strong>La cornée est densément innervée ; une abrasion cornéenne s'associe à une douleur intense, une photophobie et un larmoiement réflexe.</div>

<div class="subsection-title">Dimensions</div>
<div class="card-grid">
  <div class="card blue"><h4>Diamètres</h4><ul>
    <li>Vertical : 11,5 mm</li>
    <li>Horizontal : 12 mm</li>
  </ul></div>
  <div class="card blue"><h4>Épaisseur</h4><ul>
    <li>Centre : ≈ 540 μm (ECC)</li>
    <li>Plus épaisse en périphérie</li>
    <li>Déterminant clé de la PIO mesurée</li>
  </ul></div>
</div>

<div class="subsection-title">Structure en 5 (ou 6) couches</div>
<div class="layer-stack">
  <div class="layer"><span class="layer-num">1</span><span class="layer-name">Épithélium</span><span class="layer-desc">Stratifié, pavimenteux, non kératinisé. 5-6 couches : basales (hémidesmosomes) → intermédiaires (wing cells) → superficielles. Cellules souches au limbe (palissades de Vogt). Se renouvelle tous les 7 jours.</span></div>
  <div class="layer"><span class="layer-num">2</span><span class="layer-name">Couche de Bowman</span><span class="layer-desc">Couche acellulaire superficielle du stroma. Composée de fibres de collagène. Ne se régénère pas.</span></div>
  <div class="layer"><span class="layer-num">3</span><span class="layer-name">Stroma</span><span class="layer-desc">90 % de l'épaisseur. Lamelles de collagène régulières + protéoglycanes (chondroïtine & kératane sulfate) + kératocytes. L'arrangement régulier assure la transparence. Peut former des cicatrices mais ne se régénère pas.</span></div>
  <div class="layer"><span class="layer-num">4</span><span class="layer-name">Membrane de Descemet</span><span class="layer-desc">Zone antérieure striée (in utero) + zone postérieure non striée (sécrétée toute la vie par l'endothélium). Potentiel régénératif.</span></div>
  <div class="layer"><span class="layer-num">5</span><span class="layer-name">Endothélium</span><span class="layer-desc">Monocouche de cellules polygonales. Maintient la déturgescence par pompe ionique active. Densité adulte jeune : ~3 000 cells/mm². Perte ~0,6 %/an. Irremplaçable : en dessous de ~500 cells/mm² → œdème cornéen.</span></div>
  <div class="layer" style="border-left-color:var(--text3)"><span class="layer-num">?</span><span class="layer-name">Couche de Dua</span><span class="layer-desc">Couche hypothétique entre stroma postérieur et membrane de Descemet. Existence débattue.</span></div>
</div>

<div class="section-title">Signes en cas de pathologie cornéenne</div>
<div class="subsection-title">Lésions superficielles</div>
<table class="kanski-table">
  <tr><th>Signe</th><th>Description</th><th>Étiologies principales</th></tr>
  <tr><td><strong>EPE</strong> (érosions épithéliales ponctuées)</td><td>Ulcérations marquées à la fluorescéine/rose Bengale</td><td>Supérieures : vernale, Chlamydia, KCS sup. | Interpalpébrales : sécheresse | Inférieures : blépharite, lagophtalmie</td></tr>
  <tr><td><strong>KPE</strong> (kératite ponctuée épithéliale)</td><td>Cellules gonflées opalescentes, intraépithéliales</td><td>Adénovirus, Chlamydia, HSV/VZV précoce, Thygeson, toxicité</td></tr>
  <tr><td><strong>Infiltrats sous-épithéliaux</strong></td><td>Foyers inflammatoires sous la surface, ne prenant pas le colorant</td><td>Adénovirus sévère, zona, conjonctivite à inclusions, Thygeson</td></tr>
  <tr><td><strong>Filaments</strong></td><td>Bandes mucus+épithélium attachées par une extrémité, marquées rose Bengale</td><td>Sécheresse oculaire +++ , KCS limbique supérieure</td></tr>
  <tr><td><strong>Œdème épithélial</strong></td><td>Vésicules puis bulles, perte du reflet brillant</td><td>Décompensation endothéliale, PIO aiguë</td></tr>
  <tr><td><strong>Pannus</strong></td><td>Néovascularisation superficielle + altérations sous-épithéliales</td><td>Trachome, KCS limbique sup., hypoxie (LC)</td></tr>
</table>

<div class="subsection-title">Lésions profondes</div>
<div class="alert"><strong>Clé diagnostique : PEDAL</strong>Pain · Epithelial defect · Discharge · Anterior chamber reaction · Location → Distinguer infiltrat infectieux vs stérile</div>

<table class="kanski-table">
  <tr><th>Critère</th><th>Infectieux</th><th>Stérile</th></tr>
  <tr><td>Taille</td><td>Plus volumineux</td><td>Plus petit</td></tr>
  <tr><td>Progression</td><td>Rapide</td><td>Lente</td></tr>
  <tr><td>Ulcère épithélial</td><td>Fréquent, large</td><td>Rare, petit</td></tr>
  <tr><td>Douleur</td><td>Modérée à sévère</td><td>Légère</td></tr>
  <tr><td>Écoulement</td><td>Purulent</td><td>Mucopurulent</td></tr>
  <tr><td>Multiplicité</td><td>Généralement unique</td><td>Souvent multiple</td></tr>
  <tr><td>Latéralité</td><td>Unilatéral</td><td>Souvent bilatéral</td></tr>
  <tr><td>Réaction CA</td><td>Sévère</td><td>Légère</td></tr>
  <tr><td>Localisation</td><td>Souvent centrale</td><td>Périphérique +++</td></tr>
</table>`,

    'ch7-bact': () => `
<div class="page-title"><em>Cornée</em> — Kératites bactériennes</div>
<div class="page-subtitle">Chapitre 7 · Pages 209–216</div>

<div class="section-title">Pathogenèse</div>
<div class="subsection-title">Agents pathogènes</div>
<p class="body-text">Les kératites bactériennes ne se développent généralement que lorsque les défenses oculaires sont affaiblies. Exceptions : <em>N. gonorrhoeae</em>, <em>N. meningitidis</em>, <em>C. diphtheriae</em> et <em>H. influenzae</em> peuvent pénétrer à travers un épithélium sain.</p>

<div class="card-grid">
  <div class="card red"><h4>Agents principaux</h4><ul>
    <li><strong>Pseudomonas aeruginosa</strong> — BGN, ubiquitaire. Infection très agressive. >60 % des kératites sur LC</li>
    <li><strong>Staphylococcus aureus</strong> — CG+ coag+. Infiltrat focal bien délimité, jaune-blanc</li>
    <li><strong>Streptococcus pyogenes / pneumoniae</strong> — CG+ commensal. Souvent agressif</li>
  </ul></div>
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li>Port de LC (principal FDR) — souples > rigides perméables au gaz. Mauvaise hygiène +++</li>
    <li>Traumatismes (dont chirurgie réfractive : LASIK → mycobactéries atypiques)</li>
    <li>Maladies de surface : kératite herpétique, kératopathie bulleuse, sécheresse, blépharite</li>
    <li>Immunosuppression locale ou systémique, diabète, carence vitamine A</li>
  </ul></div>
</div>

<div class="retenir"><strong>À retenir</strong>Exclure un ulcère bactérien chez tout porteur de LC présentant un œil rouge douloureux avec vision trouble.</div>

<div class="section-title">Manifestations cliniques</div>
<div class="card-grid">
  <div class="card"><h4>Symptômes</h4><ul>
    <li>Douleur</li>
    <li>Photophobie</li>
    <li>Vision floue</li>
    <li>Écoulement mucopurulent ou purulent</li>
  </ul></div>
  <div class="card"><h4>Signes précoces</h4><ul>
    <li>Ulcère épithélial avec infiltrat étendu</li>
    <li>Hyperhémie périkératique importante</li>
    <li>Œdème stromal</li>
    <li>Plis de la membrane de Descemet</li>
  </ul></div>
  <div class="card"><h4>Signes sévères</h4><ul>
    <li>Uvéite antérieure ± hypopion</li>
    <li>Synéchies postérieures</li>
    <li>Chémosis, gonflement palpébral</li>
    <li>Descemétocèle ± perforation (Pseudomonas +++)</li>
    <li>Sclérite périlimbique possible</li>
  </ul></div>
</div>

<div class="section-title">Bilan</div>
<div class="subsection-title">Grattage cornéen</div>
<p class="body-text">Indiqué dans la plupart des cas d'ulcère cornéen afin d'identifier l'organisme et sa sensibilité. Peut être différé si petit infiltrat sans ulcère épithélial, à distance de l'axe visuel.</p>

<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Anesthésique topique sans conservateur</strong> (oxybuprocaïne 0,5 % en France)</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Grattage</strong> — lame Bard-Parker n°11, aiguille 20-21G, ou spatule de Kimura. Retirer d'abord le mucus et tissu nécrotique</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Étalement</strong> : frottis mince sur lames pour coloration de Gram (et autres), puis milieux de culture séparés</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Milieux en routine</strong> : gélose au sang + gélose chocolat + Sabouraud</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content">Récupérer étuis LC + flacons solution + les LC elles-mêmes (ne pas les nettoyer !)</div></div>
</div>

<table class="kanski-table">
  <tr><th>Milieu</th><th>Utilité</th></tr>
  <tr><td>Gélose au sang</td><td>Plupart des bactéries et champignons (sauf Neisseria, Haemophilus, Moraxella)</td></tr>
  <tr><td>Gélose chocolat</td><td>Bactéries fastidieuses : H. influenzae, Neisseria, Moraxella</td></tr>
  <tr><td>Sabouraud</td><td>Champignons</td></tr>
  <tr><td>Gélose non nutritive + E. coli</td><td>Amibes</td></tr>
  <tr><td>Löwenstein-Jensen</td><td>Mycobactéries, Nocardia</td></tr>
  <tr><td>Bouillon BHI</td><td>Organismes difficiles à cultiver, streptocoques</td></tr>
</table>

<table class="kanski-table" style="margin-top:12px">
  <tr><th>Coloration</th><th>Organismes détectés</th></tr>
  <tr><td>Gram</td><td>Bactéries, champignons, microsporidies</td></tr>
  <tr><td>Giemsa</td><td>Bactéries, champignons, amibes, microsporidies</td></tr>
  <tr><td>Blanc de calcofluor (fluorescence)</td><td>Amibes, champignons, microsporidies</td></tr>
  <tr><td>Ziehl-Neelsen / auramine O</td><td>Mycobacterium, Nocardia</td></tr>
  <tr><td>Gomori-Grocott (argent)</td><td>Champignons, amibes, microsporidies</td></tr>
</table>

<div class="section-title">Traitement</div>
<div class="subsection-title">Principes généraux</div>
<div class="card-grid">
  <div class="card"><h4>Mesures initiales</h4><ul>
    <li>Arrêt obligatoire des LC</li>
    <li>Hospitalisation si mauvaise observance prévisible ou atteinte agressive (œil unique)</li>
    <li>Coque plastique transparente si amincissement/perforation</li>
  </ul></div>
  <div class="card blue"><h4>Traitement empirique</h4><ul>
    <li>FQ topique (ciprofloxacine, ofloxacine) en monothérapie large spectre — avantage majeur : moins de résistance croisée</li>
    <li>Association possible : céphalosporine + aminoside</li>
    <li>Régime intensif : 1 goutte / heure H24 initiale, puis espacement progressif</li>
  </ul></div>
  <div class="card green"><h4>Traitement adjuvant</h4><ul>
    <li>Cycloplégique (atropine 1 %)</li>
    <li>Corticoïdes topiques : controversés, après J2-J3, si amélioration microbiologique confirmée</li>
    <li>Colle tissulaire ± LC thérapeutique si perforation imminente</li>
    <li>Kératoplastie en urgence si perforation</li>
  </ul></div>
</div>

<div class="protocol">
  <h4>Protocole de fort antibiotique topique (cornée en danger)</h4>
  <div class="protocol-item"><div class="dot"></div><div>Ciprofloxacine 0,3 % ou ofloxacine : 1 goutte toutes les 30 min à 1h pendant 24–48h, puis toutes les 2h le jour pendant 3–5j, puis espacement selon évolution</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Alternative bicéphale : céphalosporine + aminoside (fortifiés si disponibles)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Adapter secondairement aux résultats du grattage et de la sensibilité</div></div>
</div>`,

    'ch7-herp': () => `
<div class="page-title"><em>Cornée</em> — Kératites herpétiques</div>
<div class="page-subtitle">Chapitre 7 · Pages 218–224</div>

<div class="retenir"><strong>À retenir</strong>L'herpès simplex est la cause infectieuse la plus fréquente de cécité cornéenne dans les pays développés. Jusqu'à 10 millions de personnes dans le monde sont touchées par la maladie oculaire herpétique.</div>

<div class="section-title">Introduction — HSV</div>
<div class="card-grid">
  <div class="card"><h4>Biologie</h4><ul>
    <li>ADN double brin, capsule cuboïde</li>
    <li>HSV-1 : infections au-dessus de la ceinture (face, lèvres, yeux)</li>
    <li>HSV-2 : infections génitales (rarement oculaires)</li>
    <li>Réside dans tous les ganglions sensitifs (latence dans le ganglion trijumeau)</li>
  </ul></div>
  <div class="card"><h4>Histoire naturelle</h4><ul>
    <li>Primo-infection : souvent infraclinique, fièvre + malaise ± blépharoconjonctivite folliculaire</li>
    <li>Latence : dans le ganglion trijumeau, inéradiquable</li>
    <li>Réactivations : stress, UV, fièvre, traumatismes, chirurgie</li>
    <li>Taux de récurrence : 10 % à 1 an, 50 % à 10 ans</li>
  </ul></div>
  <div class="card red"><h4>Facteurs de risque de forme sévère</h4><ul>
    <li>Terrain atopique oculaire</li>
    <li>Enfance</li>
    <li>Immunodépression / immunosuppression</li>
    <li>Malnutrition, rougeole, paludisme</li>
    <li>Corticoïdes topiques inappropriés !</li>
  </ul></div>
</div>

<div class="section-title">Kératite épithéliale (dendritique ou géographique)</div>
<div class="info-box"><strong>Mécanisme</strong>Réplication active du virus dans l'épithélium cornéen.</div>

<div class="subsection-title">Manifestations cliniques</div>
<div class="card-grid">
  <div class="card"><h4>Symptômes</h4><ul>
    <li>Gêne légère à modérée</li>
    <li>Rougeur</li>
    <li>Photophobie</li>
    <li>Larmoiement</li>
    <li>Vision floue</li>
  </ul></div>
  <div class="card blue"><h4>Signes (chronologique)</h4><ul>
    <li>Cellules épithéliales opaques, gonflées, en étoile</li>
    <li>Ulcère dendritique avec bourgeons terminaux (fluorescéine ++)</li>
    <li>Bords marqués au rose Bengale (cellules virales)</li>
    <li>Sensibilité cornéenne ↓</li>
    <li>Haze sous-épithélial léger</li>
    <li>PIO souvent élevée</li>
  </ul></div>
  <div class="card red"><h4>Évolution sans traitement</h4><ul>
    <li>Ulcère géographique si corticoïdes topiques administrés !</li>
    <li>Haze sous-épithélial résiduel des semaines</li>
    <li>Fibrose progressive à chaque récidive</li>
    <li>Récurrences possibles après greffe de cornée</li>
  </ul></div>
</div>

<div class="alert"><strong>Contre-indication absolue</strong>Les corticoïdes topiques sont formellement contre-indiqués dans la kératite herpétique épithéliale — risque de perforation cornéenne.</div>

<div class="subsection-title">Traitement — Kératite épithéliale</div>
<div class="protocol">
  <h4>Antiviraux topiques</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Aciclovir 3 % pommade</strong> : 5 fois/j jusqu'à guérison épithéliale (J7–J14)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Ganciclovir 0,15 % gel</strong> : 5 fois/j — bonne tolérance, efficacité équivalente</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Trifluridine</strong> : 9 fois/j jusqu'à fermeture épithéliale, puis 5 fois/j (moins utilisée)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Efficacité : 99 % de guérison en 2 semaines</div></div>
</div>
<div class="protocol" style="border-color: rgba(74,222,128,0.2)">
  <h4 style="color:var(--success)">Antiviraux systémiques (si indiqués)</h4>
  <div class="protocol-item"><div class="dot" style="background:var(--success)"></div><div><strong>Aciclovir 200–400 mg × 5/j × 5–10 jours</strong> — immunodéprimés, enfants, atteinte sévère</div></div>
  <div class="protocol-item"><div class="dot" style="background:var(--success)"></div><div><strong>Valaciclovir</strong> ou <strong>Famciclovir</strong> — fréquence réduite, meilleure tolérance</div></div>
  <div class="protocol-item"><div class="dot" style="background:var(--success)"></div><div>Alternative si topique mal toléré ou cas résistants</div></div>
</div>

<div class="divider"></div>
<div class="section-title">Kératite disciforme (endothélite)</div>
<div class="info-box"><strong>Mécanisme</strong>Infection active des kératocytes/endothélium par HSV, ou réaction d'hypersensibilité à un antigène viral. Étiologie non clairement établie.</div>

<div class="card-grid">
  <div class="card"><h4>Symptômes</h4><ul>
    <li>Vision floue progressive</li>
    <li>Halos autour des lumières</li>
    <li>Gêne et rougeur (moins marquées que forme épithéliale)</li>
  </ul></div>
  <div class="card blue"><h4>Signes</h4><ul>
    <li>Œdème stromal central ± œdème épithélial sus-jacent</li>
    <li>Précipités cornéens volumineux (granulomateux) sous l'œdème</li>
    <li>Plis de la membrane de Descemet (formes graves)</li>
    <li>Anneau de Wessely : haze stromal profond périphérique (complexes Ag-Ac)</li>
    <li>PIO souvent élevée</li>
    <li>Sensibilité cornéenne ↓↓</li>
  </ul></div>
</div>

<div class="subsection-title">Traitement — Kératite disciforme</div>
<div class="protocol">
  <h4>Traitement initial</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Corticoïdes topiques</strong> (prednisolone 1 % ou dexaméthasone 0,1 %) 4 fois/j + couverture antivirale (aciclovir pommade)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Décroissance progressive sur ≥ 4 semaines selon l'évolution</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance PIO obligatoire (risque cortico-induit + herpétique)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Éviter les prostaglandines si traitement antiglaucomateux nécessaire (peuvent favoriser réactivation)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Ciclosporine topique 0,05 % si ulcère épithélial associé ou sevrage difficile</div></div>
</div>

<div class="divider"></div>
<div class="section-title">Prophylaxie au long cours</div>
<div class="retenir"><strong>À retenir</strong>L'aciclovir oral au long cours réduit le taux de récurrence de la kératite épithéliale et stromale d'environ 50 %.</div>
<div class="protocol">
  <h4>Indications de la prophylaxie</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Aciclovir 400 mg × 2/j</strong> — dose standard</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Valaciclovir 500 mg × 1/j</strong> — alternative avec fréquence réduite</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Indication : ≥ 2 récidives/an, kératite stromale récidivante, en péri-opératoire (chirurgie cornéenne)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Durée minimale : 12 mois (étude HEDS)</div></div>
</div>`,

    'ch7-zona': () => `
<div class="page-title"><em>Cornée</em> — Zona ophtalmique</div>
<div class="page-subtitle">Chapitre 7 · Pages 224–229</div>

<div class="section-title">Introduction</div>
<p class="body-text">Le zona ophtalmique (Herpes zoster ophthalmicus) résulte de la réactivation du virus varicelle-zona (VZV) dans le ganglion trigéminal (ganglion de Gasser). Il est responsable de 10–25 % de tous les zonas. Le VZV est plus neurotrope que HSV-1 et provoque une inflammation plus intense des structures oculaires.</p>

<div class="info-box"><strong>Signe de Hutchinson</strong>Atteinte de la pointe et de l'aile du nez (nerf nasociliaire) = risque d'atteinte oculaire × 3–4. Valeur prédictive positive élevée.</div>

<div class="section-title">Zona aigu</div>
<div class="card-grid">
  <div class="card"><h4>Prodromes</h4><ul>
    <li>Douleur/paresthésies dans le territoire V1 (front, paupière)</li>
    <li>Malaise, céphalées (1–5 jours avant l'éruption)</li>
  </ul></div>
  <div class="card"><h4>Phase éruptive</h4><ul>
    <li>Rash vésiculaire unilatéral dans le territoire V1</li>
    <li>Respecte strictement la ligne médiane</li>
    <li>Croûtes J7–10, cicatrisation J2–4 semaines</li>
    <li>Adénopathies régionales</li>
  </ul></div>
</div>

<div class="section-title">Atteintes oculaires</div>
<div class="card-grid">
  <div class="card"><h4>Paupières & conjonctive</h4><ul>
    <li>Blépharite, ptosis</li>
    <li>Conjonctivite papillaire ou folliculaire</li>
    <li>Cicatrices palpébrales, trichiasis, entropion</li>
  </ul></div>
  <div class="card blue"><h4>Cornée (50–65 % des cas)</h4><ul>
    <li>EPE diffuses précoces</li>
    <li>Pseudo-dendrites (mucus sur cellules mortes — moins arborées que HSV)</li>
    <li>Infiltrats sous-épithéliaux nummulaires</li>
    <li>Kératite interstitielle</li>
    <li>Kératite neurotrophique (anesthésie cornéenne)</li>
    <li>Kératite d'exposition</li>
  </ul></div>
  <div class="card"><h4>Uvéite (40 %)</h4><ul>
    <li>Uvéite antérieure granulomateuse</li>
    <li>Synéchies, hypertonie</li>
    <li>Atrophie irienne sectorielle</li>
    <li>Nécroses rétiniennes (immunodéprimés)</li>
  </ul></div>
  <div class="card red"><h4>Autres</h4><ul>
    <li>Paralysie des nerfs oculomoteurs (III, IV, VI)</li>
    <li>Névrite optique</li>
    <li>Sclérite</li>
    <li>Glaucome secondaire</li>
  </ul></div>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Antiviraux systémiques (à débuter dans les 72h de l'éruption)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Valaciclovir 1000 mg × 3/j × 7 jours</strong> — traitement de référence</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Famciclovir 500 mg × 3/j × 7 jours</strong> — alternative</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Aciclovir IV</strong> si immunodéprimé sévère ou forme disséminée</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Réduisent la durée et la sévérité de l'éruption, et probablement la névralgie post-zostérienne</div></div>
</div>
<div class="protocol" style="border-color:rgba(232,201,122,0.2)">
  <h4 style="color:var(--gold)">Traitement oculaire</h4>
  <div class="protocol-item"><div class="dot" style="background:var(--gold)"></div><div>Corticoïdes topiques pour les formes sévères de kératite et uvéite (sous couverture antivirale)</div></div>
  <div class="protocol-item"><div class="dot" style="background:var(--gold)"></div><div>Cycloplégique si uvéite</div></div>
  <div class="protocol-item"><div class="dot" style="background:var(--gold)"></div><div>Lubrifiants (kératite neurotrophique / d'exposition)</div></div>
  <div class="protocol-item"><div class="dot" style="background:var(--gold)"></div><div>Traitement du glaucome si PIO élevée</div></div>
</div>

<div class="subsection-title">Névralgie post-zostérienne</div>
<p class="body-text">Complication la plus fréquente chez les sujets âgés. Définie comme une douleur persistant >1 mois après l'éruption. Prévalence : 10–15 % à 3 mois chez les >50 ans.</p>
<div class="badge-list">
  <span class="badge">Amitriptyline</span>
  <span class="badge">Gabapentine</span>
  <span class="badge">Prégabaline</span>
  <span class="badge">Lidocaïne patch</span>
  <span class="badge">Capsaïcine topique</span>
  <span class="badge accent">Vaccination préventive VZV !</span>
</div>`,

    'ch7-ectasie': () => `
<div class="page-title"><em>Cornée</em> — Ectasies cornéennes</div>
<div class="page-subtitle">Chapitre 7 · Pages 248–252</div>

<div class="section-title">Kératocône (KC)</div>
<p class="body-text">Le kératocône est une pathologie d'évolution progressive caractérisée par un amincissement stromal cornéen central ou paracentral avec protrusion apicale et astigmatisme irrégulier. Les deux yeux sont presque toujours atteints au moins topographiquement.</p>

<div class="two-col">
<div>
<div class="subsection-title">Épidémiologie</div>
<div class="card"><h4>Profil typique</h4><ul>
  <li>Début : adolescence ou vingtaine</li>
  <li>Présentation initialement unilatérale</li>
  <li>~50 % des yeux adelphes « normaux » évolueront vers KC en 16 ans</li>
  <li>Seulement ~10 % d'antécédents familiaux (transmission AD pénétrance incomplète)</li>
</ul></div>
<div class="card red" style="margin-top:12px"><h4>Associations systémiques</h4><ul>
  <li>Syndrome de Down</li>
  <li>Ehlers-Danlos</li>
  <li>Marfan</li>
  <li>Ostéogenèse imparfaite</li>
</ul></div>
</div>
<div>
<div class="subsection-title">Associations oculaires</div>
<div class="card"><h4>Pathologies oculaires associées</h4><ul>
  <li>Kératoconjonctivite vernale</li>
  <li>Sclérotique bleue</li>
  <li>Aniridie</li>
  <li>Amaurose congénitale de Leber</li>
  <li>Rétinite pigmentaire</li>
  <li><strong>Frottement oculaire persistant</strong> (toute cause)</li>
</ul></div>
</div>
</div>

<div class="subsection-title">Classification de sévérité (puissance de l'axe cambré)</div>
<div class="badge-list">
  <span class="badge green">Léger : &lt; 48 D</span>
  <span class="badge gold">Modéré : 48–54 D</span>
  <span class="badge red">Sévère : &gt; 54 D</span>
</div>

<div class="subsection-title">Diagnostic — Signes à la lampe à fente</div>
<table class="kanski-table">
  <tr><th>Signe</th><th>Description</th><th>Valeur diagnostique</th></tr>
  <tr><td><strong>Stries de Vogt</strong></td><td>Lignes de contrainte stromale très fines, verticales, profondes</td><td>Pathognomonique — disparaissent à la pression sur le globe</td></tr>
  <tr><td><strong>Anneau de Fleischer</strong></td><td>Dépôts de fer à la base du cône (filtre bleu cobalt)</td><td>Très spécifique</td></tr>
  <tr><td><strong>Protrusion cornéenne</strong></td><td>Cône typique, amincissement apical</td><td>Signe évocateur</td></tr>
  <tr><td><strong>Signe de Munson</strong></td><td>Bombement de la paupière inférieure dans le regard vers le bas</td><td>Formes avancées</td></tr>
  <tr><td><strong>Reflet en « huile »</strong></td><td>À l'ophtalmoscopie directe à 50 cm</td><td>Sensible mais peu spécifique</td></tr>
  <tr><td><strong>Rétinoscopie</strong></td><td>Distorsion du reflet, effet de ciseau irrégulier</td><td>Utile en dépistage</td></tr>
</table>

<div class="subsection-title">Hydrops aigu</div>
<div class="alert"><strong>Complication aiguë</strong>Rupture de la membrane de Descemet étirée → afflux hydrique dans la cornée. Douleur, photophobie, baisse brutale de vision, œdème diffus. Guérison spontanée 6–10 semaines avec fibrose variable (parfois bénéfique en aplatissant le cône).</div>

<div class="subsection-title">Topographie cornéenne</div>
<p class="body-text">Outil indispensable au dépistage et à la surveillance. Évolution caractéristique : astigmatisme symétrique en nœud papillon → asymétrique → cône à pentes abruptes avec déplacement inférotemporal.</p>

<div class="subsection-title">Traitement — Escalade thérapeutique</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Éviter le frottement oculaire</strong> — facteur de progression démontré</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Lunettes ou LC souples</strong> — formes légères</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>LC rigides perméables au gaz ou sclérales</strong> — pour les astigmatismes élevés (surface réfractive régulière)</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Réticulation du collagène (cross-linking — CXL)</strong> : riboflavine + UV-A → stabilisation voire inversion de l'ectasie. Utilisé après documentation de la progression. Peut être combiné avec segments d'anneau.</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content"><strong>Anneaux intracornéens</strong> — amélioration visuelle modérée, facilite la tolérance des LC</div></div>
  <div class="step"><div class="step-num">6</div><div class="step-content"><strong>Kératoplastie</strong> (transfixiante ou DALK) — formes sévères. LASIK contre-indiqué !</div></div>
</div>`,

    'ch11': () => chapterHome('Glaucome','11','2e cause de cécité mondiale. Neuropathie optique chronique progressive avec altérations de la papille et de la RNFL, et perte du champ visuel.',
      ['Introduction','Hypertension oculaire','GPAO','Glaucome à pression normale','GPAF','Pseudoexfoliation','Syndrome de dispersion pigmentaire','Glaucome néovasculaire','Glaucome inflammatoire','Glaucome cortico-induit','Traitement médical','Traitement chirurgical','Glaucome congénital']),

    'ch11-intro': () => `
<div class="page-title"><em>Glaucome</em> — Introduction</div>
<div class="page-subtitle">Chapitre 11 · Pages 346–348</div>

<div class="section-title">Production d'humeur aqueuse</div>
<p class="body-text">L'humeur aqueuse est produite par l'épithélium ciliaire de la pars plicata par combinaison de sécrétion active (transport actif, anhydrase carbonique) et passive (ultrafiltration). Le système sympathique module la sécrétion : récepteurs β2 (↑ sécrétion) et α2 (↓ sécrétion).</p>

<div class="section-title">Voies d'écoulement de l'humeur aqueuse</div>
<div class="card-grid">
  <div class="card blue"><h4>Voie trabéculaire (90 %)</h4><ul>
    <li>Trabéculum uvéal → cornéoscléral → juxtacanaliculaire (cribriforme = résistance principale)</li>
    <li>Canal de Schlemm → canaux collecteurs → veines épisclérales</li>
    <li>Voie sensible à la pression</li>
    <li>Modifiée par les myotiques, prostaglandines, bêta-bloquants</li>
  </ul></div>
  <div class="card"><h4>Voie uvéosclérale (10 %)</h4><ul>
    <li>Humeur aqueuse → face du corps ciliaire → espace suprachoroïdien</li>
    <li>Drainage veineux du corps ciliaire, choroïde, sclère</li>
    <li>Augmentée par les prostaglandines et les mydriatiques</li>
  </ul></div>
</div>

<div class="section-title">Pression intraoculaire</div>
<div class="info-box"><strong>Définition de la normale</strong>Moyenne : 16 mmHg. Limite supérieure « normale » : 21 mmHg (2 SD) chez les adultes. Chez les >70 ans : 23 mmHg. Distribution gaussienne avec skew à droite.</div>

<div class="card-grid">
  <div class="card"><h4>Variations physiologiques</h4><ul>
    <li>Variation diurne (tendance à ↑ le matin)</li>
    <li>Rythme cardiaque et respiratoire</li>
    <li>Tension artérielle</li>
    <li>Les yeux glaucomateux ont une fluctuation plus importante</li>
  </ul></div>
  <div class="card gold"><h4>Concept clé</h4><ul>
    <li>Une PIO &gt; 21 mmHg n'est pas synonyme de glaucome</li>
    <li>Un glaucome peut exister avec une PIO normale (GPN)</li>
    <li>La PIO est UN facteur modifiable essentiel, pas le seul</li>
    <li>D'autres facteurs : vascularisation du NO, vulnérabilité structurelle de la lamina cribrosa</li>
  </ul></div>
</div>

<div class="section-title">Classification du glaucome</div>
<div class="two-col">
<div>
<div class="card"><h4>Par mécanisme (angle)</h4><ul>
  <li><strong>Angle ouvert</strong> : résistance trabéculaire augmentée</li>
  <li><strong>Angle fermé</strong> : obstruction mécanique de l'angle</li>
</ul></div>
</div>
<div>
<div class="card"><h4>Par étiologie</h4><ul>
  <li><strong>Primaire</strong> : sans cause identifiée</li>
  <li><strong>Secondaire</strong> : cause oculaire ou générale identifiable</li>
  <li><strong>Congénital</strong> : développemental</li>
</ul></div>
</div>
</div>`,

    'ch11-gpao': () => `
<div class="page-title"><em>Glaucome</em> — GPAO</div>
<div class="page-subtitle">Chapitre 11 · Pages 349–367</div>

<div class="section-title">Définition & Épidémiologie</div>
<p class="body-text">Le GPAO est une neuropathie optique chronique progressive de l'adulte, caractérisée par un amincissement de la RNFL, une altération glaucomateuse du nerf optique, et une perte du champ visuel. L'angle est ouvert, sans signe de glaucome secondaire. La PIO est un facteur de risque modifiable essentiel.</p>

<div class="card-grid">
  <div class="card"><h4>Épidémiologie</h4><ul>
    <li>2–3 % des >40 ans (50 % non diagnostiqués)</li>
    <li>2e cause de cécité mondiale</li>
    <li>>70 ans : ~6 % blancs, ~16 % noirs, ~3 % asiatiques</li>
    <li>Sexes égaux</li>
  </ul></div>
  <div class="card red"><h4>Facteurs de risque</h4><ul>
    <li><strong>PIO élevée</strong> (principal facteur modifiable)</li>
    <li><strong>Âge avancé</strong></li>
    <li><strong>ECC fine</strong> (&lt;555 μm)</li>
    <li><strong>Rapport C/D élevé</strong></li>
    <li>Ethnie africaine ou afro-antillaise</li>
    <li>Antécédents familiaux (1er degré × 2–3 risque)</li>
    <li>Myopie forte</li>
    <li>Asymétrie PIO ≥ 4 mmHg</li>
  </ul></div>
</div>

<div class="retenir"><strong>À retenir</strong>Dans l'étude EMGT (Early Manifest Glaucoma Trial), le taux moyen de perte de champ visuel chez les non-traités : GPAO élevé –1,31 dB/an, GPN –0,36 dB/an, GPEX –3,13 dB/an. Progression de la vision normale à la cécité en ~25 ans sans traitement.</div>

<div class="section-title">Diagnostic</div>
<div class="subsection-title">Évaluation de la tête du nerf optique</div>
<table class="kanski-table">
  <tr><th>Paramètre</th><th>Signes évocateurs de glaucome</th></tr>
  <tr><td>Rapport C/D</td><td>&gt; 0,6 ou asymétrie &gt; 0,2 entre les deux yeux</td></tr>
  <tr><td>Encoche de l'anneau neurorétinien</td><td>Amincissement focal, particulièrement en inférieur ou supérieur (règle ISNT)</td></tr>
  <tr><td>Règle ISNT</td><td>Normalement : Inférieur ≥ Supérieur ≥ Nasal ≥ Temporal. Violation = suspect</td></tr>
  <tr><td>Hémorragie péripapillaire</td><td>Splinter hemorrhage : facteur de risque de progression +++</td></tr>
  <tr><td>RNFL</td><td>Amincissement sectoriel (OCT : inférieur et supérieur le + touché)</td></tr>
  <tr><td>Zone β atrophie péripapillaire</td><td>Agrandissement de la zone β (atrophie choriocapillaire)</td></tr>
</table>

<div class="subsection-title">Périmétrie automatisée (Humphrey)</div>
<div class="card-grid">
  <div class="card"><h4>Anomalies précoces</h4><ul>
    <li>Dépression du parastep nasale</li>
    <li>Scotome de Bjerrum (paracentrals)</li>
    <li>Scotome arciforme</li>
    <li>Dépression nasale</li>
  </ul></div>
  <div class="card"><h4>Stades évolués</h4><ul>
    <li>Constriction tubulaire</li>
    <li>Préservation ilot temporal</li>
    <li>Préservation fixation jusqu'à un stade tardif</li>
  </ul></div>
  <div class="card blue"><h4>Progression</h4><ul>
    <li>Taux de progression MD (dB/an) : clé pour pronostic</li>
    <li>Perte rapide : &gt; 2 dB/an</li>
    <li>VFI et GPA (guided progression analysis)</li>
  </ul></div>
</div>

<div class="section-title">Traitement médical du GPAO</div>
<div class="info-box"><strong>Objectif</strong>Réduire la PIO en dessous d'une « pression cible » individualisée (généralement réduction ≥ 25–30 % de la PIO de base) pour stopper ou ralentir la progression.</div>

<table class="kanski-table">
  <tr><th>Classe</th><th>Mécanisme</th><th>Efficacité (↓PIO)</th><th>Effets indésirables principaux</th></tr>
  <tr><td><strong>Analogues des prostaglandines</strong> (latanoprost, bimatoprost, travoprost)</td><td>↑ drainage uvéoscléral</td><td>25–35 %</td><td>Hyperémie conjonctivale, changement couleur iris, hypertrichose, effets pro-inflammatoires</td></tr>
  <tr><td><strong>Bêta-bloquants</strong> (timolol, bétaxolol)</td><td>↓ production HA</td><td>20–25 %</td><td>Bradycardie, bronchospasme, CI si asthme/BPCO, dépression, fatigue</td></tr>
  <tr><td><strong>IAC systémiques</strong> (acétazolamide)</td><td>↓ production HA (anhydrase carbonique)</td><td>30–40 %</td><td>Paresthésies, hypokaliémie, acidose, lithiases, aplasie (rare). CI sulfa</td></tr>
  <tr><td><strong>IAC topiques</strong> (dorzolamide, brinzolamide)</td><td>↓ production HA</td><td>15–20 %</td><td>Goût amer, picotements, acidose cornéenne</td></tr>
  <tr><td><strong>Agonistes α2</strong> (brimonidine, apraclonidine)</td><td>↓ production + ↑ uvéosclérale</td><td>20–25 %</td><td>Allergie locale fréquente, sédation, CI chez nourrissons</td></tr>
  <tr><td><strong>Myotiques</strong> (pilocarpine)</td><td>↑ drainage trabéculaire</td><td>20–30 %</td><td>Myosis, spasme ciliaire, vision floue, céphalées frontales. Usage limité</td></tr>
</table>`,

    'ch11-gpaf': () => `
<div class="page-title"><em>Glaucome</em> — Glaucome primitif à angle fermé</div>
<div class="page-subtitle">Chapitre 11 · Pages 370–377</div>

<div class="section-title">Introduction</div>
<p class="body-text">Le GPAF inclut plusieurs entités liées à la fermeture de l'angle iridocornéen. Dans les pays occidentaux, il représente 25–30 % des cas. Prévalence très élevée chez les Asiatiques. La fermeture primitive de l'angle (FPA) peut être latente, intermittente, aiguë ou chronique.</p>

<div class="card-grid">
  <div class="card red"><h4>Facteurs anatomiques prédisposants</h4><ul>
    <li>Chambre antérieure peu profonde (profondeur &lt; 2,5 mm)</li>
    <li>Cornée petite</li>
    <li>Cristallin épais ou antéposé</li>
    <li>Axe antéro-postérieur court</li>
    <li>Sexe féminin</li>
    <li>Âge (cristallin grossit avec l'âge)</li>
    <li>Hypermétropie</li>
    <li>Antécédents familiaux</li>
  </ul></div>
  <div class="card"><h4>Mécanismes</h4><ul>
    <li><strong>Bloc pupillaire</strong> (le plus fréquent) : HA ne peut franchir la pupille → bombement irien antérieur → fermeture de l'angle</li>
    <li><strong>Plateau d'iris</strong> : insertion antérieure du corps ciliaire → iris plissé contre le trabéculum</li>
    <li><strong>Cristallin</strong> : phacomorphique, phacolytique</li>
  </ul></div>
</div>

<div class="section-title">Crise aiguë de fermeture de l'angle</div>
<div class="alert"><strong>Urgence ophtalmologique absolue</strong>Pression intraoculaire pouvant dépasser 50–60 mmHg. Nécrose ischémique du nerf optique possible en quelques heures si non traitée.</div>

<div class="card-grid">
  <div class="card red"><h4>Symptômes</h4><ul>
    <li>Douleur oculaire et péri-orbitaire intense (parfois nausées, vomissements)</li>
    <li>Baisse brutale de vision</li>
    <li>Vision de halos colorés (œdème cornéen)</li>
    <li>Céphalées hémicrâniennes</li>
  </ul></div>
  <div class="card"><h4>Signes</h4><ul>
    <li>PIO très élevée (40–70 mmHg)</li>
    <li>Cornée œdémateuse (aspect dépoli)</li>
    <li>Pupille semi-mydriase, aréflexique</li>
    <li>Chambre antérieure étroite</li>
    <li>Hyperhémie périkératique</li>
    <li>Chémosis</li>
    <li>Congestion irienne</li>
  </ul></div>
</div>

<div class="subsection-title">Traitement de la crise aiguë</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Traitement médical immédiat pour abaisser rapidement la PIO</strong> :
    Acétazolamide IV 500 mg, puis oral 250 mg × 4/j. Bêta-bloquant topique (timolol 0,5 %). IAC topique. Agoniste α2 (brimonidine). Éviter les myotiques jusqu'à la baisse de la PIO (cornée œdémateuse, iris ischémique).</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Mannitol IV</strong> 1–2 g/kg si PIO résistante au traitement médical topique</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Pilocarpine 1–2 %</strong> — une fois la PIO &lt; 40 mmHg : myosis pour ouvrir l'angle</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Iridotomie périphérique au laser Nd:YAG</strong> — dès que la cornée est suffisamment claire (traitement curatif). Réaliser aussi en prophylactique sur l'œil adelphe !</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content"><strong>Extraction du cristallin</strong> si angle résiduel fermé ou synéchies importantes</div></div>
</div>`,

    'ch11-traito': () => `
<div class="page-title"><em>Glaucome</em> — Traitement médical</div>
<div class="page-subtitle">Chapitre 11 · Pages 404–411</div>

<div class="section-title">Principes généraux du traitement médical</div>
<p class="body-text">L'objectif est de maintenir la qualité de vie du patient en préservant la fonction visuelle à un coût acceptable (effets indésirables, observance, coût financier). La réduction de la PIO reste le seul traitement prouvé.</p>

<div class="retenir"><strong>À retenir</strong>Le traitement précoce réduit le risque de conversion de l'HTO en glaucome et ralentit la progression du GPAO. Individualiser la pression cible (généralement ↓25–30 % de la PIO de base).</div>

<div class="section-title">Classes thérapeutiques</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Analogues des prostaglandines (1re ligne) <span class="toggle">+</span></div>
  <div class="path-block-body open">
    <div class="badge-list"><span class="badge gold">Latanoprost 0,005 %</span><span class="badge gold">Bimatoprost 0,01/0,03 %</span><span class="badge gold">Travoprost 0,004 %</span><span class="badge gold">Tafluprost</span></div>
    <div class="card-grid">
      <div class="card blue"><h4>Mécanisme</h4><ul><li>Agonistes récepteurs FP des prostaglandines</li><li>↑ drainage uvéoscléral (voie non trabéculaire)</li></ul></div>
      <div class="card green"><h4>Efficacité</h4><ul><li>↓ PIO 25–35 %</li><li>1 instillation/soir</li><li>Meilleure compliance de toutes les classes</li></ul></div>
      <div class="card red"><h4>Effets indésirables</h4><ul><li>Hyperhémie conjonctivale (transitoire)</li><li>Changement couleur iris (irréversible)</li><li>Hypertrichose / pigmentation périoculaire</li><li>Recrudescence inflammation (uvéite, HSV) → utiliser avec précaution</li><li>OMC (rare, surtout post-chirurgie)</li></ul></div>
    </div>
  </div>
</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Bêta-bloquants <span class="toggle">+</span></div>
  <div class="path-block-body">
    <div class="badge-list"><span class="badge">Timolol 0,25–0,5 %</span><span class="badge">Bétaxolol 0,25 % (β1 sélectif)</span><span class="badge">Cartéolol 1–2 %</span></div>
    <div class="card-grid">
      <div class="card blue"><h4>Mécanisme</h4><ul><li>Antagonistes β-adrénergiques</li><li>↓ production HA (par les procès ciliaires)</li></ul></div>
      <div class="card green"><h4>Efficacité</h4><ul><li>↓ PIO 20–25 %</li><li>2 fois/j (timolol gel 1 fois/j)</li></ul></div>
      <div class="card red"><h4>Contre-indications</h4><ul><li>Asthme / BPCO sévère (CI absolue)</li><li>Bradycardie sévère, BAV</li><li>Insuffisance cardiaque décompensée</li><li>Diabète insulino-dépendant (masque l'hypoglycémie)</li><li>Dépression</li></ul></div>
    </div>
  </div>
</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Inhibiteurs de l'anhydrase carbonique (IAC) <span class="toggle">+</span></div>
  <div class="path-block-body">
    <div class="badge-list"><span class="badge accent">Dorzolamide 2 % (topique)</span><span class="badge accent">Brinzolamide 1 % (topique)</span><span class="badge red">Acétazolamide (oral/IV)</span></div>
    <div class="card-grid">
      <div class="card blue"><h4>Mécanisme</h4><ul><li>Inhibition anhydrase carbonique II (procès ciliaires)</li><li>↓ production HA</li></ul></div>
      <div class="card"><h4>Topique vs systémique</h4><ul><li>Topique : ↓ PIO 15–20 %, 2–3 fois/j</li><li>Systémique (acétazolamide) : ↓ PIO 30–40 %, urgences</li><li>IAC systémiques : CI allergie sulfa, insuffisance rénale</li></ul></div>
    </div>
  </div>
</div>

<div class="path-block">
  <div class="path-block-header" onclick="toggleBlock(this)">Agonistes α2 adrénergiques <span class="toggle">+</span></div>
  <div class="path-block-body">
    <div class="badge-list"><span class="badge">Brimonidine 0,1–0,2 %</span><span class="badge">Apraclonidine 0,5–1 %</span></div>
    <div class="card-grid">
      <div class="card blue"><h4>Mécanisme</h4><ul><li>↓ production HA (stimulation α2 pré-synaptique)</li><li>↑ drainage uvéoscléral</li><li>Effet neuroprotecteur possible (données limitées)</li></ul></div>
      <div class="card red"><h4>Effets indésirables</h4><ul><li>Allergie locale très fréquente (~20 % à 1 an)</li><li>Sédation, sécheresse buccale</li><li>CI absolue chez enfants &lt; 2 ans (dépression respiratoire)</li></ul></div>
    </div>
  </div>
</div>`,

    'ch11-traita': () => `
<div class="page-title"><em>Glaucome</em> — Traitement chirurgical et laser</div>
<div class="page-subtitle">Chapitre 11 · Pages 408–422</div>

<div class="section-title">Trabéculoplastie laser</div>
<div class="two-col">
<div>
<div class="card"><h4>ALT (Argon Laser Trabeculoplasty)</h4><ul>
  <li>Spots d'argon sur le trabéculum pigmenté</li>
  <li>Mécanisme : thermocoagulation → ↑ écoulement</li>
  <li>Efficacité : ↓ 20–25 % de la PIO</li>
  <li>Durabilité limitée (5 ans en moyenne)</li>
  <li>Peut être répétée (plus faible efficacité)</li>
</ul></div>
</div>
<div>
<div class="card blue"><h4>SLT (Selective Laser Trabeculoplasty)</h4><ul>
  <li>Laser pulsé Nd:YAG (532 nm)</li>
  <li>Sélectif pour cellules mélaniques du trabéculum</li>
  <li>Efficacité similaire à ALT</li>
  <li><strong>Reproductible</strong> (peut être répétée sans dommages thermiques)</li>
  <li>Tendance à devenir 1re ligne (étude LiGHT)</li>
</ul></div>
</div>
</div>

<div class="section-title">Trabéculectomie</div>
<p class="body-text">Chirurgie filtrante standard, créant une fistule entre la chambre antérieure et l'espace sous-conjonctival (bulle de filtration). Reste le gold standard chirurgical du GPAO sévère.</p>

<div class="card-grid">
  <div class="card"><h4>Technique</h4><ul>
    <li>Volet scléral superficiel</li>
    <li>Ostium trabéculaire profond</li>
    <li>Iridectomie périphérique</li>
    <li>Antimitotiques (mitomycine C ou 5-FU) pour ↑ survie de la bulle</li>
  </ul></div>
  <div class="card green"><h4>Résultats</h4><ul>
    <li>Réduction PIO ≥ 30–40 %</li>
    <li>Succès complet (sans médicament) : ~50 % à 5 ans</li>
    <li>Succès qualifié (avec médicament) : ~80 % à 5 ans</li>
  </ul></div>
  <div class="card red"><h4>Complications</h4><ul>
    <li>Précoces : hypotonie, chambre plate, hyphéma, choroïde décollée</li>
    <li>Tardives : endophtalmie (bulle avascular), cataracte, fibrose de la bulle</li>
  </ul></div>
</div>

<div class="section-title">MIGS (Micro-Invasive Glaucoma Surgery)</div>
<p class="body-text">Ensemble de techniques mini-invasives combinant souvent une petite réduction de PIO avec un profil de risque favorable. Souvent associées à la chirurgie de la cataracte.</p>

<div class="card-grid">
  <div class="card blue"><h4>Voie trabéculaire</h4><ul>
    <li>iStent / iStent inject (microstent trabéculaire)</li>
    <li>Hydrus Microstent (canal de Schlemm)</li>
    <li>Trabectome (goniotomie ablative)</li>
    <li>GATT (gonioscopy-assisted transluminal trabeculotomy)</li>
  </ul></div>
  <div class="card"><h4>Voie sous-conjonctivale</h4><ul>
    <li>Xen Gel Stent (collagène porcin, espace sous-conjonctival)</li>
    <li>Preserflo (espace sous-conjonctival)</li>
    <li>Réduction de PIO plus importante que voie trabéculaire</li>
  </ul></div>
  <div class="card"><h4>Voie suprachoroïdienne</h4><ul>
    <li>Cypass (retiré du marché)</li>
    <li>Drainage vers l'espace suprachoroïdien</li>
  </ul></div>
</div>`,

    'ch12': () => chapterHome('Uvéites','12','Inflammation intraoculaire touchant uvée (iris, corps ciliaire, choroïde). 2,8 % de la cécité dans les pays développés. Classification anatomique fondamentale.',
      ['Classification & Caractéristiques','Bilan & Traitement','Uvéites & Spondylarthropathies','Iridocyclite de Fuchs','Uvéites & AJI','Uvéite intermédiaire','Vogt-Koyanagi-Harada','Sarcoïdose','Maladie de Behçet','Toxoplasmose','Uvéites virales']),

    'ch12-class': () => `
<div class="page-title"><em>Uvéites</em> — Classification & Caractéristiques cliniques</div>
<div class="page-subtitle">Chapitre 12 · Pages 424–432</div>

<div class="section-title">Classification (SUN 2005)</div>
<table class="kanski-table">
  <tr><th>Type</th><th>Localisation</th><th>Entités principales</th></tr>
  <tr><td><strong>Uvéite antérieure</strong></td><td>Chambre antérieure ± corps ciliaire antérieur</td><td>Iritis, iridocyclite, cyclite antérieure</td></tr>
  <tr><td><strong>Uvéite intermédiaire</strong></td><td>Vitré antérieur, pars plana, rétine périphérique</td><td>Pars planite, cyclite périphérique</td></tr>
  <tr><td><strong>Uvéite postérieure</strong></td><td>Rétine, choroïde, hyaloïde postérieure</td><td>Rétinite, coroïdite, neurétinite</td></tr>
  <tr><td><strong>Panuvéite</strong></td><td>Toutes les structures</td><td>Sarcoïdose, VKH, syphilis, Behçet</td></tr>
</table>

<div class="subsection-title">Classification chronologique</div>
<div class="badge-list">
  <span class="badge">Aiguë (&lt;3 mois)</span>
  <span class="badge">Chronique (≥3 mois)</span>
  <span class="badge gold">Récurrente (rechutes &gt;3 mois d'intervalle)</span>
</div>

<div class="section-title">Uvéite antérieure</div>
<div class="subsection-title">Présentation clinique</div>
<div class="card-grid">
  <div class="card"><h4>Symptômes</h4><ul>
    <li>Douleur oculaire (uvéite granulomateuse souvent indolore)</li>
    <li>Photophobie</li>
    <li>Larmoiement</li>
    <li>Vision floue (si tyndall important)</li>
    <li>Œil rouge (périkératique)</li>
  </ul></div>
  <div class="card blue"><h4>Signes à la lampe à fente</h4><ul>
    <li><strong>Tyndall</strong> : cellules en CA (grade 0 à 4+)</li>
    <li><strong>Flare</strong> : protéines en CA (grade 0 à 4+)</li>
    <li><strong>Précipités cornéens (PC)</strong> : KP fins (non granulo) ou granulomateux</li>
    <li>Synéchies postérieures (iris → cristallin)</li>
    <li>Nodules iriens (Koeppe au bord pupillaire, Busacca dans le stroma)</li>
    <li>Hypopion (rare, AHLAs, Behçet)</li>
    <li>Rubeosis iridis (néovascularisation)</li>
  </ul></div>
</div>

<div class="subsection-title">Précipités cornéens granulomateux vs non granulomateux</div>
<table class="kanski-table">
  <tr><th>Critère</th><th>Granulomateux</th><th>Non granulomateux</th></tr>
  <tr><td>KP</td><td>Gros, graisseux (mutton fat), triangulaires inférieurs</td><td>Fins, ponctués</td></tr>
  <tr><td>Nodules iriens</td><td>Koeppe et Busacca fréquents</td><td>Rares</td></tr>
  <tr><td>Début</td><td>Insidieux, chronique</td><td>Aigu, douloureux</td></tr>
  <tr><td>Étiologies</td><td>Sarcoïdose, syphilis, VKH, Fuchs, tuberculose</td><td>HLA-B27, AJI, zona, herpès</td></tr>
</table>

<div class="section-title">Complications de l'uvéite</div>
<div class="card-grid">
  <div class="card red"><h4>Complications visuelles</h4><ul>
    <li>Cataracte sous-capsulaire postérieure (corticoïdes + inflammation)</li>
    <li>Glaucome (synéchies, trabéculum)</li>
    <li>Œdème maculaire cystoïde (2e cause de BAV en uvéite)</li>
    <li>Décollement de rétine</li>
    <li>Membrane épirétinienne</li>
    <li>Bande kératopathie calcaire</li>
  </ul></div>
  <div class="card"><h4>Signes de gravité à rechercher</h4><ul>
    <li>PIO élevée</li>
    <li>Synéchies &gt;270° (risque de glaucome)</li>
    <li>Œdème maculaire (OCT)</li>
    <li>Hyalite dense (uvéite postérieure)</li>
    <li>Vascularite rétinienne</li>
  </ul></div>
</div>`,

    'ch12-bilan': () => `
<div class="page-title"><em>Uvéites</em> — Bilan & Traitement</div>
<div class="page-subtitle">Chapitre 12 · Pages 429–435</div>

<div class="section-title">Examens complémentaires</div>
<p class="body-text">Le bilan étiologique dépend de la présentation clinique. Une uvéite antérieure aiguë unilatérale récurrente chez un adulte jeune peut ne nécessiter qu'un bilan minimal. En revanche, une panuvéite bilatérale granulomateuse justifie un bilan exhaustif.</p>

<div class="card-grid">
  <div class="card"><h4>Bilan de 1re intention (systématique)</h4><ul>
    <li>NFS, VS, CRP</li>
    <li>Sérologie syphilis (TPHA/VDRL)</li>
    <li>IDR à la tuberculine ou IGRA (Quantiféron)</li>
    <li>Radiographie thoracique (sarcoïdose, tuberculose)</li>
    <li>ECA (enzyme de conversion de l'angiotensine)</li>
    <li>HLA-B27 si uvéite antérieure aiguë non granulomateuse</li>
  </ul></div>
  <div class="card blue"><h4>Selon contexte</h4><ul>
    <li>ANA (anticorps antinucléaires) : AJI</li>
    <li>FR, anti-CCP : polyarthrite rhumatoïde</li>
    <li>Sérologies toxoplasmose, CMV, HSV, VZV</li>
    <li>PCR humeur aqueuse ou vitré (viral, bactérien)</li>
    <li>Lysozyme, calcium sérique (sarcoïdose)</li>
    <li>TDM thoracique si Rx anormale</li>
    <li>IRM cérébrale si signes neurologiques (VKH, SEP, Behçet)</li>
  </ul></div>
  <div class="card gold"><h4>Imagerie oculaire</h4><ul>
    <li>OCT maculaire : recherche OMC, décollements séreux</li>
    <li>Angiographie fluorescéine : vascularite, OMC, néovaisseaux</li>
    <li>ICG : granulomes choroïdiens (sarcoïdose, VKH)</li>
    <li>Autofluorescence : atteinte EPR</li>
    <li>Échographie B : si hyalite dense (prise de masse)</li>
  </ul></div>
</div>

<div class="section-title">Traitement</div>
<div class="subsection-title">Corticoïdes</div>
<div class="protocol">
  <h4>Voies d'administration selon localisation</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Topique</strong> (prednésolone 1 %, dexaméthasone) : uvéite antérieure. Fréquence selon sévérité (H1 → 4 fois/j → décroissance)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Périoculaire</strong> (injection sous-ténon ou trans-septale) : uvéite postérieure/intermédiaire unilatérale, OMC</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Intravitréen</strong> (triamcinolone, implant de dexaméthasone Ozurdex®) : OMC réfractaire, uvéite postérieure</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Systémique</strong> (prednisone ≥ 1 mg/kg/j) : uvéites sévères bilatérales, pan-uvéites</div></div>
</div>

<div class="subsection-title">Immunomodulateurs (épargne corticoïde)</div>
<table class="kanski-table">
  <tr><th>Agent</th><th>Indication principale</th><th>Suivi</th></tr>
  <tr><td>Méthotrexate</td><td>AJI, sarcoïdose, VKH</td><td>NFS, transaminases (mensuel)</td></tr>
  <tr><td>Azathioprine</td><td>VKH, uvéites chroniques</td><td>NFS, foie (mensuel)</td></tr>
  <tr><td>Mycophénolate mofétil</td><td>Uvéites auto-immunes bilatérales</td><td>NFS (mensuel)</td></tr>
  <tr><td>Ciclosporine</td><td>Behçet (VKH en 2e intention)</td><td>Créatinine, PA (mensuel)</td></tr>
  <tr><td>Anti-TNF (infliximab, adalimumab)</td><td>Uvéite réfractaire, Behçet, SpA, AJI</td><td>Bilan TB avant. Risque infectieux</td></tr>
  <tr><td>Adalimumab (HUMIRA)</td><td>1re biothérapie AMM uvéite non infectieuse adulte/enfant</td><td>Injections SC tous les 15j</td></tr>
</table>

<div class="alert"><strong>Avant tout immunosuppresseur</strong>Éliminer une uvéite infectieuse (toxoplasmose, HSV, VZV, CMV, syphilis, tuberculose) — risque d'aggravation dramatique sous immunosuppression.</div>`,

    'ch12-toxo': () => `
<div class="page-title"><em>Uvéites</em> — Toxoplasmose oculaire</div>
<div class="page-subtitle">Chapitre 12 · Pages 456–461</div>

<div class="section-title">Pathogenèse</div>
<p class="body-text">Toxoplasma gondii, protozoaire obligatoirement intracellulaire. Hôte définitif : félin. Transmission humaine : viande crue ou insuffisamment cuite, matières fécales de chat, eau souillée, transplacentaire. La toxoplasmose oculaire est la principale cause d'uvéite postérieure infectieuse dans les pays développés (~25 % des uvéites postérieures).</p>

<div class="card-grid">
  <div class="card"><h4>Formes acquises vs congénitales</h4><ul>
    <li>Congénitale : souvent bilatérale, maculaire, cicatrices précoces, séquelles graves</li>
    <li>Acquise (réactivation) : responsable de la grande majorité des uvéites à Toxoplasma chez l'adulte</li>
    <li>Primo-infection acquise : possible, clinique similaire</li>
    <li>Immunodéprimé : formes extensives, bilatérales, atypiques</li>
  </ul></div>
</div>

<div class="section-title">Manifestations cliniques</div>
<div class="retenir"><strong>À retenir</strong>Foyer de rétinite blanc-jaunâtre avec hyalite adjacente (« headlights in the fog »), souvent à proximité d'une ancienne cicatrice pigmentée.</div>

<div class="card-grid">
  <div class="card blue"><h4>Signes oculaires typiques</h4><ul>
    <li>Foyer de rétinite actif : blanc-jaunâtre, bords flous, œdème</li>
    <li>Hyalite focale ou diffuse selon sévérité</li>
    <li>Foyer satellite d'une cicatrice ancienne ++ (choriorétinite pigmentée)</li>
    <li>Vascularite rétinienne adjacente</li>
    <li>Uvéite antérieure (KP fins, tyndall)</li>
    <li>Possible NVC secondaire</li>
  </ul></div>
  <div class="card"><h4>Localisations particulières</h4><ul>
    <li>Papillite en cas de foyer péripapillaire</li>
    <li>OMC si foyer proche de la macula</li>
    <li>Ischémie si vascularite sévère</li>
    <li>DR en cas de nécrose étendue</li>
  </ul></div>
</div>

<div class="section-title">Bilan</div>
<div class="card-grid">
  <div class="card"><h4>Sérologie</h4><ul>
    <li>IgG anti-Toxoplasma positives : exposition antérieure</li>
    <li>IgG négatives : diagnostic très improbable (sauf immunodéprimés)</li>
    <li>IgM rarement utiles (faux positifs, persistance)</li>
  </ul></div>
  <div class="card blue"><h4>PCR humeur aqueuse</h4><ul>
    <li>Sensibilité ~50–60 %, spécificité élevée</li>
    <li>Utile si diagnostic incertain (forme atypique, immunodéprimé)</li>
    <li>Gold standard pour confirmation biologique</li>
  </ul></div>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Traitement classique (TMP-SMX préféré en France)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Cotrimoxazole (TMP-SMX)</strong> — 1 cp fort × 2/j — Efficacité équivalente aux trithérapies classiques, meilleure tolérance, faible coût</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Trithérapie classique</strong> : Pyriméthamine 50–75 mg/j + Sulfadiazine 2–4 g/j + Acide folinique 25 mg/j (prévenir toxicité hématologique)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Durée : 4–6 semaines (jusqu'à cicatrisation)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Corticoïdes systémiques</strong> (prednisone 0,5–1 mg/kg/j) si hyalite dense, menace maculaire, foyer péripapillaire. Débutés 24–48h après l'antiparasitaire</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Immunodéprimés : cotrimoxazole IV si forme sévère, TMP-SMX prophylaxie secondaire à vie si CD4 &lt;100</div></div>
</div>`,
