    'ch19-chiasma': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Chiasma</div>
<div class="page-subtitle">Chapitre 19 · Pages 786–792</div>
<div class="section-title">Anatomie fonctionnelle</div>
<p class="body-text">Au chiasma, les fibres nasales (champs temporaux) se croisent. Les fibres temporales (champs nasaux) restent ipsilatérales. Une lésion chiasmatique entraîne classiquement une hémianopsie bitemporale.</p>
<div class="retenir"><strong>À retenir</strong>Un déficit du CV chez un patient avec tumeur hypophysaire → extension suprasellaire comprimant le chiasma.</div>
<div class="section-title">Adénomes hypophysaires</div>
<div class="card-grid">
  <div class="card"><h4>Classification</h4><ul>
    <li>Microadénome &lt;10 mm : confiné à la selle</li>
    <li>Macroadénome ≥10 mm : extension suprasellaire fréquente</li>
    <li>Sécrétants : prolactinome (le + fréquent), GH, ACTH, TSH</li>
    <li>Non sécrétants : symptômes visuels révélateurs</li>
  </ul></div>
  <div class="card red"><h4>Atteinte chiasmatique typique</h4><ul>
    <li>Hémianopsie bitemporale (quadrant supérieur en premier)</li>
    <li>Asymétrie fréquente</li>
    <li>DPAR si asymétrique</li>
    <li>Atrophie optique tardive</li>
  </ul></div>
</div>
<div class="section-title">Autres causes chiasmatiques</div>
<table class="kanski-table">
  <tr><th>Étiologie</th><th>Particularités</th></tr>
  <tr><td>Craniopharyngiome</td><td>Enfant/adulte jeune. Calcifications (TDM). Kystes</td></tr>
  <tr><td>Méningiome du tubercule sellaire</td><td>Femme d'âge moyen. Junctional scotoma</td></tr>
  <tr><td>Gliome des voies optiques</td><td>Enfant avec NF1 +++. Bilatéral. Évolution lente</td></tr>
  <tr><td>Anévrisme ACoA</td><td>Hémianopsie bitemporale + diplopie si III</td></tr>
</table>
<div class="section-title">Prise en charge</div>
<div class="protocol">
  <h4>Selon étiologie</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>IRM hypothalamo-hypophysaire</strong> avec gadolinium + séquences dédiées</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Bilan hormonal</strong> : prolactinémie, IGF-1, cortisol, TSH, LH/FSH</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Prolactinome</strong> : cabergoline (agoniste dopaminergique) → chirurgie si résistance</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Autres adénomes compressifs</strong> : chirurgie transsphénoïdale ± radiothérapie</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Suivi champ visuel + OCT RNFL pour surveillance de la récupération</div></div>
</div>`,

    'ch19-retro': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Voies rétrochiasmiques</div>
<div class="page-subtitle">Chapitre 19 · Pages 792–795</div>
<div class="section-title">Principe fondamental</div>
<p class="body-text">Au-delà du chiasma, les fibres visuelles homolatérales au champ visuel controlatéral cheminent ensemble. Une lésion rétrochiasmique → hémianopsie homonyme (même hémi-champ dans les deux yeux, CÔTÉ OPPOSÉ à la lésion).</p>
<div class="section-title">Localisation des lésions par le déficit</div>
<table class="kanski-table">
  <tr><th>Site lésionnel</th><th>Déficit typique</th><th>Congruence</th><th>Étiologies</th></tr>
  <tr><td>Bandelette optique</td><td>HH peu congruente + atrophie NO bilatérale asymétrique</td><td>Peu</td><td>Tumeur temporale</td></tr>
  <tr><td>Corps géniculé latéral</td><td>Sectoranopsie congruente en « coin »</td><td>Très</td><td>AVC thalamique</td></tr>
  <tr><td>RI pied (temporal)</td><td>Quadranopsie sup. HH (« pie dans le ciel »)</td><td>Congruente</td><td>AVC ACM</td></tr>
  <tr><td>RI couronne (pariétale)</td><td>Quadranopsie inf. HH</td><td>Congruente</td><td>AVC pariétal</td></tr>
  <tr><td>Cortex occipital (V1)</td><td>HH congruente + <strong>préservation maculaire</strong></td><td>Très</td><td>AVC ACP, tumeur</td></tr>
</table>
<div class="info-box"><strong>Préservation maculaire dans les AVC occipitaux</strong>Double vascularisation de la représentation maculaire corticale (ACP + ACM) + grande surface corticale → souvent épargnée.</div>
<div class="card-grid">
  <div class="card blue"><h4>Règles d'or</h4><ul>
    <li>HH → lésion CONTROLATÉRALE</li>
    <li>Plus la lésion est postérieure → plus le déficit est congruent</li>
    <li>Pas d'atrophie papillaire dans les lésions post-CGL</li>
    <li>Préservation maculaire → AVC occipital</li>
  </ul></div>
</div>`,

    'ch19-nystagmus': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Nystagmus</div>
<div class="page-subtitle">Chapitre 19 · Pages 809–814</div>
<div class="section-title">Classification</div>
<div class="card-grid">
  <div class="card"><h4>Types</h4><ul>
    <li><strong>À ressort (jerk)</strong> : phase lente (dérive) + phase rapide (saccade). Nommé par direction de la phase rapide</li>
    <li><strong>Pendulaire</strong> : oscillations symétriques, pas de phase rapide définie</li>
  </ul></div>
  <div class="card"><h4>Caractéristiques à noter</h4><ul>
    <li>Direction : horizontal, vertical, torsionnel</li>
    <li>Amplitude (faible/grande)</li>
    <li>Fréquence (haute/basse)</li>
    <li>Angle null (position neutre)</li>
    <li>Position déclenchante</li>
  </ul></div>
</div>
<div class="section-title">Nystagmus acquis — Localisation</div>
<table class="kanski-table">
  <tr><th>Type</th><th>Localisation</th><th>Étiologies clés</th></tr>
  <tr><td>Battant vers le bas</td><td>Jonction cervicomédullaire, vermis</td><td><strong>Chiari I +++</strong>, SEP, médicaments (lithium, antiépileptiques)</td></tr>
  <tr><td>Battant vers le haut</td><td>Tronc cérébral ventral, vermis</td><td>SEP, ischémie tronc, Wernicke</td></tr>
  <tr><td>Torsionnel</td><td>Bulbe (syndrome de Wallenberg)</td><td>AVC bulbaire, SEP</td></tr>
  <tr><td>Seesaw</td><td>Région chiasmatique</td><td>Craniopharyngiome, lésion diencéphalique</td></tr>
  <tr><td>INO (nystagmus abducteur)</td><td>Faisceau longitudinal médial</td><td>SEP (jeune bilatéral), AVC (vieux unilatéral)</td></tr>
</table>
<div class="alert"><strong>Nystagmus battant vers le bas</strong>IRM fosse postérieure + jonction cervicomédullaire obligatoire (malformation de Chiari I +++)</div>
<div class="section-title">Nystagmus du nourrisson</div>
<div class="card-grid">
  <div class="card red"><h4>Sensoriel congénital</h4><ul>
    <li>Déficit visuel précoce (aniridie, albinisme, achromatopsie)</li>
    <li>Traitement de la cause</li>
  </ul></div>
  <div class="card blue"><h4>Moteur idiopathique</h4><ul>
    <li>Pas de déficit visuel</li>
    <li>Horizontal pur, ↓ à l'accommodation</li>
    <li>Position nulle (torticolis)</li>
    <li>Traitement : prismes ou chirurgie de Kestenbaum si torticolis important</li>
  </ul></div>
</div>`,

    'ch19-nf': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Neurofibromatose</div>
<div class="page-subtitle">Chapitre 19 · Pages 819–820</div>
<div class="section-title">NF1 — Maladie de Von Recklinghausen</div>
<p class="body-text">AD, chromosome 17q11.2 (gène NF1/neurofibromine). Prévalence 1/3000. Pénétrance complète, expressivité très variable.</p>
<div class="subsection-title">Critères diagnostiques NF1 (2 critères ou plus)</div>
<div class="badge-list">
  <span class="badge gold">≥6 taches café au lait (&gt;5 mm avant puberté, &gt;15 mm après)</span>
  <span class="badge gold">≥2 neurofibromes ou 1 plexiforme</span>
  <span class="badge">Éphélides axillaires ou inguinales</span>
  <span class="badge red">Gliome des voies optiques</span>
  <span class="badge blue">≥2 nodules de Lisch</span>
  <span class="badge">Lésion osseuse caractéristique</span>
  <span class="badge">1er degré atteint</span>
</div>
<div class="section-title">Manifestations oculaires NF1</div>
<div class="card-grid">
  <div class="card blue"><h4>Nodules de Lisch</h4><ul>
    <li>Hamartomes mélanocytaires iriens</li>
    <li>Présents chez &gt;95 % des adultes NF1</li>
    <li>Petits dômes translucides pigmentés</li>
    <li>Asymptomatiques (valeur diagnostique)</li>
  </ul></div>
  <div class="card red"><h4>Gliome des voies optiques</h4><ul>
    <li>15–20 % des NF1</li>
    <li>Astrocytome pilocytique bas grade</li>
    <li>Signes : BAV, DPAR, proptose, nystagmus</li>
    <li>IRM annuelle chez l'enfant NF1</li>
    <li>Traitement : chimiothérapie (carboplatine + vincristine) si progression</li>
  </ul></div>
  <div class="card"><h4>Autres</h4><ul>
    <li>Neurofibrome plexiforme palpébral</li>
    <li>Nodules choroïdiens hyperréflectifs OCT (&gt;80 % des NF1 — très sensibles)</li>
    <li>Ectropion uvéal congénital</li>
    <li>Glaucome congénital</li>
  </ul></div>
</div>
<div class="divider"></div>
<div class="section-title">NF2</div>
<p class="body-text">Chromosome 22q12 (gène NF2/mérline). Plus rare (1/25 000). Schwannomes vestibulaires bilatéraux pathognomoniques + méningiomes multiples.</p>
<div class="badge-list">
  <span class="badge red">Schwannomes vestibulaires bilatéraux</span>
  <span class="badge">Cataracte SCP précoce</span>
  <span class="badge">MER</span>
  <span class="badge accent">IRM cérébrale annuelle + audiométrie</span>
</div>`,

    'ch19-migraine': () => `
<div class="page-title"><em>Neuro-ophtalmologie</em> — Migraine</div>
<div class="page-subtitle">Chapitre 19 · Pages 820–823</div>
<div class="retenir"><strong>À retenir</strong>La migraine est la cause la plus fréquente d'aura visuelle (avec et sans céphalées). Prévalence : 18 % des femmes, 6 % des hommes.</div>
<div class="section-title">Formes cliniques</div>
<div class="card-grid">
  <div class="card"><h4>Migraine sans aura</h4><ul>
    <li>Céphalée unilatérale pulsatile, modérée à sévère</li>
    <li>Nausées/vomissements, photo/phonophobie</li>
    <li>Durée 4–72h, aggravée par l'activité physique</li>
    <li>Douleur rétro-orbitaire possible → DD glaucome, OACR</li>
  </ul></div>
  <div class="card blue"><h4>Migraine avec aura (classique)</h4><ul>
    <li>Aura précède la céphalée (20–60 min)</li>
    <li><strong>Scotome scintillant (fortification spectra)</strong> +++</li>
    <li>Phosphènes, lignes en zigzag lumineux</li>
    <li>Progression centrifuge en 20–30 min</li>
    <li>Hémianopsie transitoire possible</li>
    <li>Paresthésies, dysarthrie</li>
  </ul></div>
</div>
<div class="section-title">Formes atypiques — à connaître</div>
<div class="card-grid">
  <div class="card red"><h4>Migraine basilaire (Bickerstaff)</h4><ul>
    <li>Aura d'origine tronculaire : diplopie, vertiges, ataxie</li>
    <li>Vision floue/cécité bilatérale transitoire</li>
    <li>DD AVC vertébro-basilaire → IRM-DWI si début de novo ou &gt;45 ans</li>
  </ul></div>
  <div class="card red"><h4>Migraine ophtalmoplégique</h4><ul>
    <li>Paralysie du III (ou IV, VI) pendant/après la céphalée</li>
    <li>Rare, récidivante, souvent enfant</li>
    <li>IRM obligatoire (exclure anévrisme)</li>
    <li>Actuellement : neuropathie crânienne douloureuse récurrente</li>
  </ul></div>
  <div class="card"><h4>Migraine rétinienne</h4><ul>
    <li>Déficit monoculaire transitoire (≠ binoculaire)</li>
    <li>Très rare, diagnostic d'exclusion strict</li>
    <li>DD embolie rétinienne → bilan vasculaire obligatoire</li>
  </ul></div>
</div>
<div class="section-title">Traitement</div>
<div class="two-col">
<div>
<div class="card blue"><h4>Crise</h4><ul>
  <li>Triptans : sumatriptan 50–100 mg (référence)</li>
  <li>AINS : ibuprofène, naproxène</li>
  <li>Antiémétiques si nausées</li>
</ul></div>
</div>
<div>
<div class="card"><h4>Traitement de fond (≥2–3 crises/mois)</h4><ul>
  <li>Propranolol, métoprolol</li>
  <li>Amitriptyline, valproate, topiramate</li>
  <li>Anti-CGRP (erenumab, fremanezumab)</li>
</ul></div>
</div>
</div>`,
    // ── CH9 Épisclère & Sclère ──────────────────────────────
    'ch9': () => chapterHome('Épisclère et sclère','9','Distinction fondamentale : épisclérite (bénigne, autolimitée) vs sclérite (inflammation de pleine épaisseur, potentiellement cécitante). La sclérite nécrosante est une urgence rhumatologique.',
      ['Introduction & Anatomie','Épisclérite','Sclérite dysimmunitaire','Sclérite nécrosante','Scléromalacie perforante','Sclérite postérieure','Associations systémiques','Sclérite infectieuse']),

    'ch9-intro': () => `
<div class="page-title"><em>Épisclère & Sclère</em> — Introduction</div>
<div class="page-subtitle">Chapitre 9 · Pages 291–292</div>
<div class="section-title">Anatomie</div>
<p class="body-text">La sclère est une enveloppe fibreuse rigide (collagène + protéoglycanes) représentant 5/6 de la tunique externe de l'œil. Elle est recouverte de l'épisclère (tissu conjonctif lâche vascularisé) et de la conjonctive. Le plexus vasculaire épiscléral superficiel est distinct du plexus profond scléral — clé pour distinguer épisclérite de sclérite.</p>
<div class="info-box"><strong>Clé diagnostique — Phényléphrine 10 %</strong>Instillation de phényléphrine 10 % : constricte les vaisseaux conjonctivaux et épiscléraux superficiels (épisclérite → blanchit) mais PAS le plexus profond scléral (sclérite → reste rouge/violacé).</div>
<div class="card-grid">
  <div class="card blue"><h4>Épisclérite vs Sclérite</h4><ul>
    <li><strong>Épisclérite</strong> : inflammation épisclérale superficielle → rougeur vive, douleur légère, autolimitée</li>
    <li><strong>Sclérite</strong> : inflammation de pleine épaisseur sclérale → rougeur violacée profonde, douleur sévère, risque visuel</li>
  </ul></div>
</div>`,

    'ch9-episclerite': () => `
<div class="page-title"><em>Épisclère & Sclère</em> — Épisclérite</div>
<div class="page-subtitle">Chapitre 9 · Pages 292–293</div>
<div class="retenir"><strong>À retenir</strong>L'épisclérite aiguë est courante, généralement idiopathique et de bon pronostic visuel. Elle est souvent autolimitée en 1–3 semaines.</div>
<div class="section-title">Clinique</div>
<div class="card-grid">
  <div class="card"><h4>Épisclérite simple (75 %)</h4><ul>
    <li>Femme d'âge moyen</li>
    <li>Récidivante dans 60 % des cas</li>
    <li>Inconfort absent à modéré (sensation de grain de sable)</li>
    <li>Rougeur sectorielle (2/3) ou diffuse, distribution interpalpébrale</li>
    <li>Maximum en 24 heures, régresse spontanément</li>
    <li>AV normale, pas de douleur sévère</li>
  </ul></div>
  <div class="card"><h4>Épisclérite nodulaire (25 %)</h4><ul>
    <li>Évolution plus longue et insidieuse</li>
    <li>Nodule vasculaire rouge, tendre, interpalpébral</li>
    <li>Faisceau de LAF : surface sclérale PLATE (≠ sclérite)</li>
    <li>PIO élevée rare</li>
    <li>&gt;10 % évoluent vers une sclérite nécrosante si non traités</li>
  </ul></div>
</div>
<div class="section-title">Associations systémiques</div>
<div class="badge-list">
  <span class="badge">PR, connectivites</span>
  <span class="badge">Zona ophtalmique</span>
  <span class="badge">Goutte</span>
  <span class="badge">Maladie de Crohn</span>
  <span class="badge">Sécheresse oculaire, rosacée</span>
  <span class="badge gold">Idiopathique dans la majorité des cas</span>
</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Selon sévérité</h4>
  <div class="protocol-item"><div class="dot"></div><div>Légère : compresses froides + larmes artificielles réfrigérées</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Modérée : corticoïde topique faible (fluorométholone 0,1 % × 4/j pendant 1–2 semaines)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>AINS topique : alternative aux corticoïdes</div></div>
  <div class="protocol-item"><div class="dot"></div><div>AINS oral (ibuprofène 200 mg × 3/j) si topique insuffisant</div></div>
</div>`,

    'ch9-sclerite': () => `
<div class="page-title"><em>Épisclère & Sclère</em> — Sclérite dysimmunitaire</div>
<div class="page-subtitle">Chapitre 9 · Pages 293–301</div>
<div class="alert"><strong>La sclérite nécrosante est une urgence rhumatologique</strong>Elle nécessite une immunothérapie systémique pour contrôler l'inflammation et préserver la vision. Souvent première manifestation d'une maladie systémique sévère.</div>

<div class="section-title">Classification (tableau 9.1)</div>
<div class="card-grid">
  <div class="card"><h4>Sclérite antérieure non nécrosante</h4><ul>
    <li><strong>Diffuse</strong> (la plus fréquente) : congestion vasculaire diffuse, œdème, douleur irradiant vers le visage. Translucidité sclérale gris-bleu après résolution</li>
    <li><strong>Nodulaire</strong> : nodule(s) bleu-rouge immobiles, faisceau de LAF montre une surface sclérale surélevée (≠ épisclérite)</li>
  </ul></div>
  <div class="card red"><h4>Sclérite antérieure nécrosante</h4><ul>
    <li>Avec inflammation : vaso-occlusive ou granulomateuse</li>
    <li>Apparition plus tardive (~60 ans), bilatérale dans 60 %</li>
    <li>Douleur sévère irradiant vers tempe/front/mâchoire</li>
    <li>Zones de nécrose sclérales (aspect gris avasculaire)</li>
    <li>Fortes associations avec PR, ANCA-vascularites</li>
  </ul></div>
  <div class="card red"><h4>Scléromalacie perforante</h4><ul>
    <li>Nécrose SANS inflammation (paradoxe)</li>
    <li>Presque exclusivement chez femmes avec PR sévère ancienne</li>
    <li>Zones de nécrose indolores, aspect jaunâtre</li>
    <li>Uvée visible à travers la sclère amincie</li>
    <li>Perforation spontanée possible</li>
  </ul></div>
  <div class="card blue"><h4>Sclérite postérieure</h4><ul>
    <li>Souvent méconnue (derrière l'équateur)</li>
    <li>Douleur +++ , céphalées, restriction des mouvements</li>
    <li>Proptose, plis choroïdiens, DSR, anneau choroïdien</li>
    <li>Écho B : épaississement scléral + signe du « T » (liquide)</li>
    <li>DD mélanome uvéal, lymphome, métastase</li>
  </ul></div>
</div>

<div class="section-title">Associations systémiques importantes</div>
<table class="kanski-table">
  <tr><th>Maladie</th><th>Type de sclérite associé</th></tr>
  <tr><td>Polyarthrite rhumatoïde</td><td>Toutes formes + scléromalacie perforante</td></tr>
  <tr><td>Granulomatose avec polyangéite (Wegener)</td><td>Nécrosante +++ (ANCA-c)</td></tr>
  <tr><td>PAN, Churg-Strauss</td><td>Nécrosante</td></tr>
  <tr><td>LED</td><td>Diffuse ou nodulaire</td></tr>
  <tr><td>Zona ophtalmique</td><td>Nodulaire ou diffuse</td></tr>
  <tr><td>Tuberculose, syphilis, herpès</td><td>Sclérite infectieuse</td></tr>
</table>

<div class="section-title">Bilan</div>
<div class="badge-list">
  <span class="badge">NFS, VS, CRP</span><span class="badge">FR, anti-CCP</span>
  <span class="badge red">ANCA (c et p)</span><span class="badge">ANA, anti-ADN</span>
  <span class="badge">Sérologies syphilis, TB (IDR/IGRA)</span>
  <span class="badge gold">Rx thorax</span><span class="badge blue">Écho B si sclérite postérieure</span>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Escalade systémique selon sévérité</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Non nécrosante légère</strong> : AINS oral (ibuprofène, indométacine 25–50 mg × 3/j)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Non nécrosante sévère ou rechute</strong> : prednisone orale 1 mg/kg/j avec décroissance progressive</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Nécrosante</strong> : corticoïdes IV (méthylprednisolone 1 g/j × 3 j) + immunosuppresseurs (méthotrexate, mycophénolate, cyclophosphamide si vasculite)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Anti-TNF (infliximab) ou rituximab si résistance</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Traitement de la maladie systémique sous-jacente impératif</div></div>
</div>`,

    // ── CH10 Cristallin ────────────────────────────────────
    'ch10': () => chapterHome('Cristallin','10','Le cristallin est le seul tissu transparent avasculaire de l\'organisme. La cataracte est la 1re cause de cécité réversible mondiale.',
      ['Cataracte liée à l\'âge','Cataractes secondaires','Cataracte congénitale','Ectopie cristallinienne','Anomalies de forme','Prise en charge chirurgicale','Complications postopératoires']),

    'ch10-intro': () => `
<div class="page-title"><em>Cristallin</em> — Cataracte acquise</div>
<div class="page-subtitle">Chapitre 10 · Pages 308–346</div>

<div class="retenir"><strong>À retenir</strong>La cataracte est la 1re cause mondiale de cécité réversible. La phacoémulsification est la technique de référence dans les pays développés. La cataracte liée à l'âge est la forme la plus fréquente.</div>

<div class="section-title">Types de cataracte liée à l'âge</div>
<div class="card-grid">
  <div class="card blue"><h4>Sous-capsulaire postérieure (SCP)</h4><ul>
    <li>Localisée au niveau du pôle postérieur</li>
    <li>Aspect granuleux/en plaque (faisceau oblique) ou noire vacuolée (rétro-illumination)</li>
    <li>Très gênante pour la vision de près et en lumière vive (myosis)</li>
    <li>Éblouissement +++</li>
    <li>Associée à : corticoïdes, RP, uvéite, diabète, radiation</li>
  </ul></div>
  <div class="card"><h4>Nucléaire sclérosante</h4><ul>
    <li>Exagération du vieillissement normal du cristallin</li>
    <li>Teinte jaunâtre (urochrome) → brune → noire</li>
    <li>Myopie d'indice → « seconde vue des vieux » (lit sans lunettes)</li>
    <li>Vision de loin altérée, vision de près préservée temporairement</li>
  </ul></div>
  <div class="card"><h4>Corticale</h4><ul>
    <li>Opacités cunéiformes (en coin) radiaires</li>
    <li>Débute souvent en inféronasal</li>
    <li>Éblouissement fréquent</li>
    <li>Cataracte morgagnienne : liquéfaction totale + noyau tombant</li>
  </ul></div>
</div>

<div class="section-title">Cataractes dans les maladies systémiques</div>
<table class="kanski-table">
  <tr><th>Maladie</th><th>Type de cataracte</th><th>Particularités</th></tr>
  <tr><td>Diabète sucré</td><td>Flocons de neige (classique, rare) ou liée à l'âge précoce</td><td>Fluctuation de la réfraction selon glycémie</td></tr>
  <tr><td>Dystrophie myotonique</td><td>Opacités irisées → stellaire SCP</td><td>3e décennie. Chercher myotonie, ptosis</td></tr>
  <tr><td>Dermatite atopique</td><td>Plaque SCA + SCP</td><td>2e-4e décennie, bilatérale</td></tr>
  <tr><td>NF2</td><td>SCP ou capsulaire postérieure</td><td>&gt;60 % des patients</td></tr>
  <tr><td>Corticoïdes</td><td>SCP</td><td>Dose et durée dépendante</td></tr>
  <tr><td>Hypocalcémie</td><td>Opacités ponctuées, multicolores</td><td>Hypoparathyroïdie</td></tr>
  <tr><td>Syndrome de Down</td><td>Cataracte précoce</td><td>Diverses formes</td></tr>
</table>

<div class="section-title">Prise en charge chirurgicale</div>
<div class="subsection-title">Indications</div>
<p class="body-text">Basées sur le retentissement fonctionnel (activités de vie quotidienne, conduite, lecture) et non sur le seul critère d'acuité visuelle. Certaines situations imposent la chirurgie quel que soit le retentissement visuel : glaucome phacomorphique ou phacolytique, nécessité de visualiser le segment postérieur.</p>

<div class="subsection-title">Biométrie</div>
<div class="card-grid">
  <div class="card blue"><h4>Mesures nécessaires</h4><ul>
    <li>Longueur axiale (IOLMaster ou Lenstar — cohérence optique préférée)</li>
    <li>Kératométrie (courbure cornéenne)</li>
    <li>Profondeur de chambre antérieure</li>
    <li>Épaisseur du cristallin</li>
  </ul></div>
  <div class="card"><h4>Formules de calcul de LIO</h4><ul>
    <li>3e génération : SRK/T, Holladay 1, Hoffer Q (selon longueur axiale)</li>
    <li>4e génération : Haigis, Holladay 2, Barrett Universal</li>
    <li>Post-réfractive : formules spécifiques (Hill-RBF, Barrett True-K)</li>
    <li>Cible réfractive : discuter avec le patient (emmétrope, myopie légère de près)</li>
  </ul></div>
</div>

<div class="subsection-title">Phacoémulsification — Technique standard</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Incision</strong> : cornéenne claire (2,2–2,8 mm) ou scléro-cornéenne. Auto-hermétique</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Capsulorhexis continu circulaire</strong> : 5–5,5 mm. Clé pour la stabilité de la LIO</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Hydrodissection/hydrodelineation</strong> : cliver le noyau de la capsule</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Phacoémulsification du noyau</strong> : ultrasons + aspiration + irrigation</div></div>
  <div class="step"><div class="step-num">5</div><div class="step-content"><strong>Aspiration du cortex</strong> : nettoyage de la chambre capsulaire</div></div>
  <div class="step"><div class="step-num">6</div><div class="step-content"><strong>Implant de LIO</strong> dans le sac capsulaire (LIO souple pliable)</div></div>
</div>

<div class="subsection-title">Complications peropératoires</div>
<div class="card-grid">
  <div class="card red"><h4>Complications majeures</h4><ul>
    <li><strong>Rupture capsulaire postérieure</strong> (1–2 %) → chute de fragments dans le vitré → vitrectomie différée</li>
    <li><strong>Hémorragie suprachoroïdienne</strong> : rare mais grave. Arrêt immédiat, suture de l'incision</li>
    <li>Déchirure du capsulorhexis</li>
    <li>Syndrome IFIS (floppy iris) : tamsulosine, autres α-bloquants</li>
  </ul></div>
</div>

<div class="section-title">Complications postopératoires</div>
<div class="card-grid">
  <div class="card"><h4>Opacification capsulaire postérieure (OCP)</h4><ul>
    <li>La plus fréquente (~20 % à 5 ans)</li>
    <li>Prolifération de cellules épithéliales résiduelles sur la capsule postérieure</li>
    <li>BAV progressive ± éblouissement</li>
    <li>Traitement : capsulotomie postérieure au laser Nd:YAG</li>
  </ul></div>
  <div class="card red"><h4>Endophtalmie postopératoire</h4><ul>
    <li>Incidence : 0,05–0,1 % (réduite par antibioprophylaxie intracamérulaire)</li>
    <li>Délai aigu (&lt;6 sem) : S. epidermidis, S. aureus, Streptocoque</li>
    <li>Traitement : vitrectomie + injections IVT (vancomycine + ceftazidime)</li>
    <li>Pronostic visuel réservé si sévère</li>
  </ul></div>
  <div class="card"><h4>Autres complications</h4><ul>
    <li>OMC (syndrome d'Irvine-Gass)</li>
    <li>Luxation tardive de LIO (SPE, pseudoexfoliation)</li>
    <li>Glaucome (bloc pupillaire, inflammation)</li>
    <li>Décollement de rétine (myopes forts ++)</li>
    <li>Décompensation cornéenne (dystrophie de Fuchs, SPE)</li>
  </ul></div>
</div>`,

    'ch10-congen': () => `
<div class="page-title"><em>Cristallin</em> — Cataracte congénitale & Ectopie</div>
<div class="page-subtitle">Chapitre 10 · Pages 335–342</div>

<div class="section-title">Cataracte congénitale</div>
<div class="alert"><strong>Urgence ophtalmologique</strong>La cataracte congénitale unilatérale dense doit être opérée idéalement avant 6 semaines de vie pour prévenir une amblyopie irréversible (période critique de plasticité visuelle).</div>

<div class="card-grid">
  <div class="card red"><h4>Étiologies à rechercher</h4><ul>
    <li>Idiopathique (majorité)</li>
    <li>Génétique (AD dans les formes familiales)</li>
    <li>Infections TORCH in utero : rubéole +++, CMV, toxoplasmose</li>
    <li>Métaboliques : galactosémie, hypocalcémie</li>
    <li>Syndromes : Down, Turner, Marfan, Lowe</li>
    <li>Médicaments (corticoïdes maternels)</li>
  </ul></div>
  <div class="card blue"><h4>Types morphologiques</h4><ul>
    <li>Polaire antérieure : souvent stable, petite, surveillance</li>
    <li>Polaire postérieure : risque amblyopie plus important</li>
    <li>Nucléaire : dense, axiale, traitement urgent</li>
    <li>Lamelaire : fréquente, bilatérale, modérée</li>
    <li>Totale : très dense, urgence absolue</li>
  </ul></div>
</div>

<div class="subsection-title">Traitement</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Chirurgie précoce</strong> : aspiration du cristallin + vitrectomie antérieure + capsulotomie postérieure (enfants &lt;6–8 ans)</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Correction optique immédiate</strong> : lunettes/lentilles de contact (pas de LIO avant 2 ans généralement)</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Traitement de l'amblyopie</strong> : occlusion de l'œil sain dès que possible</div></div>
</div>

<div class="section-title">Ectopie cristallinienne</div>
<table class="kanski-table">
  <tr><th>Étiologie</th><th>Direction de luxation</th><th>Particularités</th></tr>
  <tr><td>Marfan</td><td>Supéro-temporale</td><td>Fibrilline-1 (FBN1). Zonules intactes mais allongées</td></tr>
  <tr><td>Homocystinurie</td><td>Inféro-nasale</td><td>Thrombo-embolies. Régime méthionine + vit. B6/B12</td></tr>
  <tr><td>Syndrome de Weill-Marchesani</td><td>Inférieure</td><td>Sphérophakie → bloc pupillaire → glaucome aigu</td></tr>
  <tr><td>Pseudoexfoliation</td><td>Variable (asymétrique)</td><td>Fragilité zonulaire — risque per-opératoire</td></tr>
  <tr><td>Traumatisme</td><td>Variable</td><td>Dialyse zonulaire</td></tr>
</table>`,

    // ── CH15 Dystrophies rétiniennes héréditaires ──────────
    'ch15': () => chapterHome('Dystrophies rétiniennes héréditaires','15','Groupe hétérogène de pathologies génétiques dégénératives de la rétine. L\'ERG et l\'EOG sont les examens fonctionnels clés. La thérapie génique est en plein essor.',
      ['Introduction & Examens complémentaires','Rétinite pigmentaire','Dystrophies atypiques & syndromes','Dystrophie de Stargardt','Maladie de Best','Dystrophies des cônes','Dystrophies choroïdiennes','Vitréorétinopathies héréditaires']),

    'ch15-intro': () => `
<div class="page-title"><em>Dystrophies rétiniennes héréditaires</em> — Introduction & Examens</div>
<div class="page-subtitle">Chapitre 15 · Pages 616–619</div>

<div class="section-title">Introduction</div>
<p class="body-text">Les dystrophies rétiniennes héréditaires (DRH) constituent un groupe cliniquement et génétiquement hétérogène de maladies dégénératives rétiniennes. Elles constituent la cause la plus fréquente de cécité héréditaire d'origine rétinienne dans les pays développés.</p>

<div class="section-title">Examens complémentaires clés</div>
<div class="card-grid">
  <div class="card blue"><h4>Électrorétinographie (ERG)</h4><ul>
    <li>Mesure la réponse électrique de la rétine à la lumière</li>
    <li><strong>Onde a</strong> : photorécepteurs (cônes + bâtonnets)</li>
    <li><strong>Onde b</strong> : cellules bipolaires, cellules de Müller</li>
    <li>ERG scotopique (bâtonnets) vs photopique (cônes)</li>
    <li>ERG full-field : réponse globale de la rétine</li>
    <li>ERG multifocal (mfERG) : cartographie maculaire</li>
  </ul></div>
  <div class="card blue"><h4>Électro-oculogramme (EOG)</h4><ul>
    <li>Mesure le potentiel de standing de l'épithélium pigmentaire</li>
    <li>Indice d'Arden = pic lumière / creux obscurité</li>
    <li>Normal : &gt;1,85 (185 %)</li>
    <li><strong>Très altéré dans la maladie de Best</strong> (indice &lt;1,5) même avant les signes cliniques</li>
  </ul></div>
  <div class="card"><h4>Adaptométrie à l'obscurité</h4><ul>
    <li>Mesure la sensibilité des bâtonnets après éblouissement</li>
    <li>Altérée précocement dans la RP et les dystrophies des bâtonnets</li>
  </ul></div>
  <div class="card gold"><h4>Génétique moléculaire</h4><ul>
    <li>Panel NGS (Next Generation Sequencing) des gènes rétiniens</li>
    <li>Essentiel pour le conseil génétique</li>
    <li>Ouvre l'accès aux essais de thérapie génique</li>
    <li>&gt;270 gènes impliqués dans les DRH</li>
  </ul></div>
</div>`,

    'ch15-rp': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Rétinite pigmentaire</div>
<div class="page-subtitle">Chapitre 15 · Pages 619–627</div>

<div class="retenir"><strong>À retenir</strong>La RP est la dystrophie héréditaire rétinienne la plus fréquente (prévalence ~1/5000). Dystrophie bâtonnet–cône initialement. La triade classique : pigmentation rétinienne périphérique + artères grêles + pâleur papillaire cireuse.</div>

<div class="section-title">Génétique & Modes de transmission</div>
<div class="card-grid">
  <div class="card"><h4>Modes de transmission</h4><ul>
    <li><strong>AD</strong> : meilleur pronostic. Mutation rhodopsine fréquente. Perte de vision centrale après 60 ans</li>
    <li><strong>AR</strong> : sévère. Gènes RPGR, RPE65 (candidat à la thérapie génique)</li>
    <li><strong>XLR</strong> : le plus sévère. Cécité complète dès 3e–4e décennie. Porteuses : reflet doré maculaire ± placards périphériques</li>
    <li><strong>Sporadique</strong> : pronostic variable, souvent favorable</li>
  </ul></div>
</div>

<div class="section-title">Diagnostic</div>
<div class="card-grid">
  <div class="card blue"><h4>Symptômes classiques</h4><ul>
    <li><strong>Nyctalopie</strong> (cécité nocturne) — symptôme inaugural</li>
    <li>Difficultés d'adaptation à l'obscurité</li>
    <li>Rétrécissement progressif du champ visuel</li>
    <li>Photopsies (lumières clignotantes)</li>
    <li>Baisse de l'acuité visuelle centrale tardive</li>
  </ul></div>
  <div class="card blue"><h4>Signes au fond d'œil</h4><ul>
    <li>Pigmentations rétiniennes périvasculaires « en ostéoblastes » bilatérales</li>
    <li>Rétrécissement artériel marqué</li>
    <li>Pâleur papillaire « cireuse »</li>
    <li>Atrophie progressive avec visibilité des vaisseaux choroïdiens (aspect mosaïque)</li>
    <li>OMC maculaire fréquent (traitable)</li>
    <li>Cataracte SCP (très fréquente)</li>
  </ul></div>
</div>

<div class="section-title">RP syndromique — Associations systémiques</div>
<table class="kanski-table">
  <tr><th>Syndrome</th><th>Associations</th><th>Gène</th></tr>
  <tr><td><strong>Usher</strong></td><td>RP + surdité neurosensorielle (la plus fréquente)</td><td>MYO7A, CDH23, etc.</td></tr>
  <tr><td><strong>Bardet-Biedl</strong></td><td>RP + obésité + polydactylie + déficience intellectuelle + néphropathie</td><td>Gènes BBS</td></tr>
  <tr><td><strong>Refsum</strong></td><td>RP + neuropathie périphérique + ataxie + anosmie</td><td>PHYH (accumulation phytanate)</td></tr>
  <tr><td><strong>Kearns-Sayre</strong></td><td>RP + OEPC + BAV + cardiopathie</td><td>ADN mitochondrial</td></tr>
  <tr><td><strong>NPHP (Joubert, Senior-Løken)</strong></td><td>RP + néphronophtise</td><td>Gènes NPHP</td></tr>
</table>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Prise en charge actuelle</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Vitamine A palmitate 15 000 UI/j</strong> : ralentit modestement la progression (controversé)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>OMC</strong> : acétazolamide oral ou topique + bévacizumab IVT si réfractaire</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Cataracte</strong> : phacoémulsification si BAV significative</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Protection UV</strong> : lunettes de soleil (ralentissement théorique)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Thérapie génique</strong> : Luxturna (voretigene neparvovec) pour RPE65 biallelique — AMM FDA/EMA</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Rétine artificielle (Argus II) : cas sévères avec &lt;20/200</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Conseil génétique + bilan systémique (bilan RP syndromique)</div></div>
</div>`,

    'ch15-maculaire': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Stargardt & Maladie de Best</div>
<div class="page-subtitle">Chapitre 15 · Pages 627–634</div>

<div class="section-title">Maladie de Stargardt / Fundus Flavimaculatus</div>
<div class="retenir"><strong>À retenir</strong>Stargardt = dystrophie maculaire héréditaire la plus fréquente (1/8000–10000). Mutations ABCA4 (AR). Accumulation de lipofuscine toxique dans l'EPR.</div>

<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>BAV progressive débutant entre 6–20 ans</li>
    <li>Atrophie maculaire (aspect « martelé »)</li>
    <li>Lésions pisciformes jaunâtres périmaculaires (accumulation lipofuscine)</li>
    <li>Aspect caractéristique en autofluorescence</li>
    <li>Silencing choroïdien à l'AFG (diffusion de lipofuscine masque la fluorescence)</li>
  </ul></div>
  <div class="card blue"><h4>ERG & EOG</h4><ul>
    <li>ERG normal au début, puis altéré (cônes &gt; bâtonnets)</li>
    <li>EOG normal ou légèrement altéré (≠ Best)</li>
    <li>mfERG : altération maculaire précoce</li>
  </ul></div>
</div>

<div class="divider"></div>

<div class="section-title">Maladie de Best (Dystrophie vitelliforme)</div>
<div class="retenir"><strong>À retenir</strong>2e dystrophie maculaire après Stargardt. AD (BEST1/bestrophine). EOG très altéré à TOUS les stades (même les porteurs asymptomatiques — signe spécifique !).</div>

<div class="card-grid">
  <div class="card"><h4>Stades évolutifs</h4><ul>
    <li><strong>Pré-vitelliforme</strong> : EOG anormal, FO normal</li>
    <li><strong>Vitelliforme</strong> : lésion « œuf au plat » (jaune d'œuf intact) — AV souvent bonne</li>
    <li><strong>Pseudo-hypopion</strong> : partie de la lésion régresse, niveau liquide</li>
    <li><strong>Fragmentation</strong> : rupture de la lésion, BAV</li>
    <li><strong>Atrophique</strong> : disparition pigment, cicatrice atrophique</li>
    <li>NVC secondaire possible à tout stade</li>
  </ul></div>
  <div class="card blue"><h4>Examens complémentaires</h4><ul>
    <li>EOG très altéré (Arden &lt;1,5) — pathognomonique</li>
    <li>AFG : hypofluorescence (effet masque du matériel jaunâtre)</li>
    <li>AF : hyperautofluorescence intense (lipofuscine)</li>
    <li>OCT : matériel hyperréflectif sous-rétinien</li>
    <li>ERG : normal (rétine périphérique intacte)</li>
  </ul></div>
</div>`,

    // ── CH18 Strabisme ─────────────────────────────────────
    'ch18': () => chapterHome('Strabisme','18','Désalignement oculaire touchant 3–5 % des enfants. La prise en charge précoce est essentielle pour prévenir l\'amblyopie et restaurer la vision binoculaire.',
      ['Introduction & Définitions','Amblyopie','Vision binoculaire','Pseudostrabisme','Ésotropie','Exotropie','Syndromes congénitaux de dysinnervation','Strabisme paralytique','Chirurgie & Traitement','Toxine botulique']),

    'ch18-intro': () => `
<div class="page-title"><em>Strabisme</em> — Introduction & Définitions</div>
<div class="page-subtitle">Chapitre 18 · Pages 698–726</div>

<div class="section-title">Définitions essentielles</div>
<div class="card-grid">
  <div class="card"><h4>Terminologie de base</h4><ul>
    <li><strong>Tropie</strong> : déviation oculaire manifeste (visible)</li>
    <li><strong>Phorie</strong> : déviation latente (compensée par fusion)</li>
    <li><strong>Ésotropie</strong> : strabisme convergent manifeste</li>
    <li><strong>Exotropie</strong> : strabisme divergent manifeste</li>
    <li><strong>Hypertropie / Hypotropie</strong> : strabisme vertical</li>
    <li><strong>Concomitant</strong> : angle de déviation constant quelle que soit la direction du regard</li>
    <li><strong>Incomitant (paralytique)</strong> : angle de déviation variable selon la direction du regard</li>
  </ul></div>
  <div class="card blue"><h4>Tests clés</h4><ul>
    <li><strong>Cover test</strong> : met en évidence la tropie (couvre l'œil fixateur → l'œil dévié se recentre)</li>
    <li><strong>Cover-uncover test</strong> : met en évidence la phorie</li>
    <li><strong>Reflet cornéen de Hirschberg</strong> : évaluation rapide (chaque mm = 7°)</li>
    <li><strong>Prisme + cover test</strong> : mesure quantitative de la déviation</li>
    <li><strong>Prisme de Maddox</strong> : mesure des phories</li>
  </ul></div>
  <div class="card"><h4>Muscles oculomoteurs</h4><ul>
    <li>4 droits : médial (adduction), latéral (abduction), sup. (élévation en abduction), inf. (abaissement en abduction)</li>
    <li>2 obliques : grand oblique (abaissement+torsion interne en adduction), petit oblique (élévation+torsion externe en adduction)</li>
    <li>Loi de Hering : égale innervation des muscles agonistes conjugués</li>
    <li>Loi de Sherrington : innervation réciproque agoniste/antagoniste</li>
  </ul></div>
</div>

<div class="section-title">Principes thérapeutiques</div>
<div class="steps">
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>Correction de l'amétropie</strong> : lunettes (hypermétropie → ésotropie accommodative)</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>Traitement de l'amblyopie</strong> : occlusion avant toute chirurgie</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>Chirurgie oculomotrice</strong> : recul (affaiblissement) ou résection/plication (renforcement)</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>Rééducation orthoptique</strong> : restauration de la fusion binoculaire</div></div>
</div>`,

    'ch18-amblyopie': () => `
<div class="page-title"><em>Strabisme</em> — Amblyopie</div>
<div class="page-subtitle">Chapitre 18 · Pages 707–726</div>

<div class="retenir"><strong>À retenir</strong>L'amblyopie organique doit être exclue avant de débuter tout traitement. La période sensible s'étend jusqu'à 7–8 ans pour l'amblyopie strabique, plus longtemps (adolescence) pour l'amblyopie anisométropique.</div>

<div class="section-title">Types d'amblyopie</div>
<div class="card-grid">
  <div class="card"><h4>Amblyopie strabique</h4><ul>
    <li>Neutralisation de l'œil dévié pour éviter la diplopie</li>
    <li>Toujours unilatérale</li>
    <li>Traitement : correction optique + occlusion de l'œil dominant</li>
  </ul></div>
  <div class="card"><h4>Amblyopie anisométropique</h4><ul>
    <li>Différence de réfraction entre les deux yeux (parfois dès 1 D)</li>
    <li>Souvent associée à un microstrabisme</li>
    <li>Peut persister jusqu'à l'adolescence</li>
    <li>Traitement : correction optique ± occlusion</li>
  </ul></div>
  <div class="card red"><h4>Amblyopie par privation</h4><ul>
    <li>Opacité des milieux (cataracte, ptosis occlusive)</li>
    <li>La plus sévère si non traitée</li>
    <li>Urgence opératoire + occlusion précoce</li>
  </ul></div>
  <div class="card"><h4>Amblyopie amétropique bilatérale</h4><ul>
    <li>Hypermétropie élevée bilatérale non corrigée</li>
    <li>Astigmatisme méridional si non corrigé</li>
    <li>Traitement : correction optique seule souvent suffisante</li>
  </ul></div>
</div>

<div class="section-title">Traitement de l'amblyopie</div>
<div class="protocol">
  <h4>Principes</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Correction optique optimale</strong> en premier — peut suffire seule pour l'amblyopie anisométropique</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Occlusion de l'œil dominant</strong> : traitement le plus efficace. À temps plein ou partiel selon l'âge et la sévérité. Surveillance régulière des deux yeux (risque d'amblyopie à bascule)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Pénalisation à l'atropine</strong> : rend l'œil dominant flou. Utile si observance médiocre à l'occlusion. Efficace pour amblyopie légère à modérée (≥6/24)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Si pas d'amélioration après 6 mois d'occlusion efficace → improbable de progresser davantage</div></div>
</div>`,

    'ch18-esotropie': () => `
<div class="page-title"><em>Strabisme</em> — Ésotropie</div>
<div class="page-subtitle">Chapitre 18 · Pages 728–733</div>

<div class="section-title">Classification</div>
<table class="kanski-table">
  <tr><th>Type</th><th>Âge d'apparition</th><th>Réfraction</th><th>Traitement</th></tr>
  <tr><td><strong>Précoce (infantile)</strong></td><td>&lt;6 mois</td><td>Normale (&lt;+2 D)</td><td>Chirurgie bilatérale DM (après correction amblyopie)</td></tr>
  <tr><td><strong>Accommodative pure</strong></td><td>2–3 ans</td><td>Hypermétropie +++</td><td>Lunettes + cycloplégie → normalise la déviation. Chirurgie si résiduelle</td></tr>
  <tr><td><strong>Accommodative partielle</strong></td><td>2–4 ans</td><td>Hypermétropie</td><td>Lunettes pour la composante accommodative + chirurgie pour résiduelle</td></tr>
  <tr><td><strong>Non accommodative acquise</strong></td><td>Tout âge</td><td>Variable</td><td>Chirurgie ± lunettes</td></tr>
  <tr><td><strong>Microstrabisme</strong></td><td>Précoce</td><td>Variable</td><td>Traitement amblyopie en priorité</td></tr>
</table>

<div class="subsection-title">Ésotropie précoce — signes spécifiques</div>
<div class="card-grid">
  <div class="card"><h4>Caractéristiques</h4><ul>
    <li>Grand angle (&gt;30 Δ), stable</li>
    <li>Fixation alternée en position primaire</li>
    <li>Fixation croisée dans le regard latéral (simule une paralysie du VI bilatérale)</li>
    <li>Nystagmus optocinétique asymétrique</li>
    <li>Hyperaction oblique inférieure (80 % développeront une DVD)</li>
    <li>DVD (déviation verticale dissociée) dans 80 % des cas à 3 ans</li>
  </ul></div>
</div>`,

    'ch18-exotropie': () => `
<div class="page-title"><em>Strabisme</em> — Exotropie & Syndromes</div>
<div class="page-subtitle">Chapitre 18 · Pages 733–742</div>

<div class="section-title">Exotropie</div>
<div class="card-grid">
  <div class="card"><h4>Exotropie intermittente</h4><ul>
    <li>La plus fréquente des exotropies</li>
    <li>Déviation contrôlée par la fusion binoculaire</li>
    <li>Favorisée par la fatigue, la maladie, la lumière vive</li>
    <li>Fermeture d'un œil à la lumière solaire (signe évocateur)</li>
    <li>Traitement : lunettes si hypermétropie significative, occlusion partielle, chirurgie si fréquente</li>
  </ul></div>
  <div class="card"><h4>Exotropie constante</h4><ul>
    <li>Souvent liée à une mauvaise vision d'un œil (exotropie sensorielle)</li>
    <li>Toujours éliminer une cause organique (rétinoblastome !)</li>
    <li>Traitement : chirurgie</li>
  </ul></div>
</div>

<div class="section-title">Syndrome de Duane</div>
<p class="body-text">Syndrome congénital de dysinnervation du VI : absence partielle ou complète du noyau du VI avec co-innervation du droit latéral par une branche du III. Unilatéral dans 80 %, gauche &gt; droit. Femmes prédominantes.</p>
<div class="card-grid">
  <div class="card blue"><h4>Types (Huber)</h4><ul>
    <li><strong>Type I</strong> (le + fréquent) : limitation d'abduction, rétraction du globe en adduction</li>
    <li><strong>Type II</strong> : limitation d'adduction, exotropie</li>
    <li><strong>Type III</strong> : limitation dans les deux sens</li>
  </ul></div>
  <div class="card"><h4>Signes caractéristiques</h4><ul>
    <li>Rétraction du globe en adduction (co-contraction des muscles)</li>
    <li>Fissure palpébrale se rétrécit en adduction</li>
    <li>Posture compensatrice de la tête (torticolis)</li>
    <li>Chirurgie : uniquement si torticolis significatif ou ésotropie en position primaire</li>
  </ul></div>
</div>`,

    'ch18-chir': () => `
<div class="page-title"><em>Strabisme</em> — Chirurgie du strabisme</div>
<div class="page-subtitle">Chapitre 18 · Pages 739–748</div>

<div class="section-title">Principes chirurgicaux</div>
<div class="card-grid">
  <div class="card blue"><h4>Techniques de base</h4><ul>
    <li><strong>Recul musculaire</strong> (récession) : affaiblissement d'un muscle en le réinsérant en arrière de son insertion originelle. Corrige l'hyperaction</li>
    <li><strong>Résection/plication</strong> : renforcement musculaire en raccourcissant le muscle ou en le plissant. Corrige l'hypoaction</li>
    <li><strong>Fadenoperation</strong> (suture postérieure) : réduit l'action du muscle en position extrême</li>
    <li><strong>Transposition musculaire</strong> : paralysies oculomotrices</li>
  </ul></div>
  <div class="card"><h4>Planification</h4><ul>
    <li>Tableaux de dosage selon l'angle de déviation</li>
    <li>Principes Hering : toujours considérer les deux yeux</li>
    <li>Chirurgie ajustable possible sous anesthésie locale</li>
    <li>Opérer sur 1, 2 ou 3 muscles selon l'angle</li>
  </ul></div>
</div>

<div class="section-title">Complications</div>
<div class="card-grid">
  <div class="card red"><h4>Générales & per-opératoires</h4><ul>
    <li>Réflexe oculo-cardiaque (bradycardie sur traction)</li>
    <li>Nausées post-opératoires fréquentes</li>
    <li>Perforation sclérale (rare mais grave)</li>
  </ul></div>
  <div class="card red"><h4>Postopératoires</h4><ul>
    <li>Sous-correction ou sur-correction (nécessite reprise)</li>
    <li>Glissement musculaire (muscle perdu)</li>
    <li>Diplopie postopératoire (transitoire généralement)</li>
    <li>Ischémie du segment antérieur (si 3 muscles droits opérés)</li>
    <li>Granulome conjonctival, infection rare</li>
  </ul></div>
</div>

<div class="section-title">Toxine botulique (chémodénervation)</div>
<p class="body-text">Injection de toxine botulinique dans un muscle extraoculaire → paralysie temporaire (3–4 mois) → réalignement. Utilisée pour les petites déviations, strabismes paralytiques aigus, chirurgie de la diplopie, et comme alternative ou complément à la chirurgie.</p>
<div class="badge-list">
  <span class="badge">Petites déviations residuelles</span>
  <span class="badge">Ésotropie aiguë (VI) — traitement d'attente</span>
  <span class="badge">Strabisme sensori-moteur adulte</span>
  <span class="badge red">CI : myasthénie, grossesse</span>
</div>`,

    // ── CH20 Tumeurs oculaires ─────────────────────────────
    'ch20': () => chapterHome('Tumeurs oculaires','20','Les tumeurs oculaires comprennent les tumeurs de la surface oculaire, de l\'uvée, de la rétine et de l\'orbite. Le mélanome uvéal est la tumeur intraoculaire maligne la plus fréquente chez l\'adulte.',
      ['Tumeurs bénignes de la surface','Tumeurs malignes de la surface','Tumeurs de l\'iris & corps ciliaire','Nævus choroïdien','Mélanome choroïdien','Rétinoblastome','Tumeurs vasculaires rétiniennes','Lymphome intraoculaire','Métastases choroïdiennes']),

    'ch20-intro': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Surface oculaire</div>
<div class="page-subtitle">Chapitre 20 · Pages 828–840</div>

<div class="section-title">Tumeurs bénignes de la surface oculaire</div>
<div class="card-grid">
  <div class="card"><h4>Nævus conjonctival</h4><ul>
    <li>Tumeur la plus fréquente de la surface</li>
    <li>Pigmentée ou non, bien délimitée, mobile sur le globe</li>
    <li>Kystes épithéliaux inclus fréquents (caractéristique bénigne)</li>
    <li>Surveillance photographique annuelle</li>
    <li>Exérèse si croissance, inflammation récidivante</li>
  </ul></div>
  <div class="card"><h4>Granulome pyogénique</h4><ul>
    <li>Tissus de granulation vasculaire après trauma ou chirurgie</li>
    <li>Rouge vif, pédiculé, saigne facilement</li>
    <li>Traitement : corticoïdes topiques ou exérèse</li>
  </ul></div>
  <div class="card"><h4>Dermolipome & Dermoïde</h4><ul>
    <li>Choristomes (tissus ectopiques)</li>
    <li>Dermoïde limbique : signe de Goldenhar</li>
    <li>Surveillance, exérèse si gênant ou risque amblyopie</li>
  </ul></div>
</div>

<div class="section-title">Tumeurs malignes de la surface oculaire</div>
<div class="card-grid">
  <div class="card red"><h4>Néoplasie intraépithéliale conjonctivale (CIN)</h4><ul>
    <li>Spectre : dysplasie légère → carcinome in situ → carcinome épidermoïde invasif</li>
    <li>Facteurs de risque : UV, VIH, papillomavirus (HPV 16/18), hommes &gt;60 ans</li>
    <li>Aspect gélatineux, leucoplasique, ou vasculaire au limbe</li>
    <li>Traitement : exérèse large + cryothérapie + MMC topique</li>
  </ul></div>
  <div class="card red"><h4>Mélanome conjonctival</h4><ul>
    <li>Tumeur rare mais potentiellement fatale</li>
    <li>Peut se développer sur une mélanose primitive acquise (MPA)</li>
    <li>MPA : pigmentation conjonctivale acquise unilatérale diffuse → 20 % de risque de mélanome</li>
    <li>Traitement : exérèse large + cryothérapie + mitomycine C + radiothérapie ± exentération</li>
  </ul></div>
</div>`,

    'ch20-melanome': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Nævus & Mélanome choroïdiens</div>
<div class="page-subtitle">Chapitre 20 · Pages 846–856</div>

<div class="section-title">Nævus choroïdien</div>
<p class="body-text">Présent chez 5–10 % des individus à phototype clair. La croissance chez un adulte doit faire évoquer une transformation maligne.</p>

<div class="subsection-title">Critères de risque de malignité (mémotechnique TFSOM-HH)</div>
<div class="badge-list">
  <span class="badge red">T — Thickness &gt;2 mm</span>
  <span class="badge red">F — Fluid (sous-rétinien)</span>
  <span class="badge red">S — Symptoms (photopsies, vision floue)</span>
  <span class="badge red">O — Orange pigment (lipofuscine)</span>
  <span class="badge red">M — Margin &lt;3 mm du disque</span>
  <span class="badge red">H — Halo absent</span>
  <span class="badge red">H — Hollow (hypoéchogène à l'écho)</span>
</div>

<div class="section-title">Mélanome choroïdien</div>
<div class="retenir"><strong>À retenir</strong>Tumeur maligne intraoculaire primitive la plus fréquente chez l'adulte. 80 % des mélanomes uvéaux. Prévalence : 6–7/million dans les pays occidentaux.</div>

<div class="card-grid">
  <div class="card blue"><h4>Clinique</h4><ul>
    <li>Souvent asymptomatique — découverte fortuite</li>
    <li>Masse surélevée gris-brune (dôme) ou en « bouton de col » (perforation membrane de Bruch)</li>
    <li>Pigment orange sus-jacent (lipofuscine)</li>
    <li>Décollement séreux de la rétine</li>
    <li>Vaisseaux sentinelles dilatés</li>
    <li>DSR bulleux possible masquant la tumeur</li>
  </ul></div>
  <div class="card red"><h4>Facteurs de mauvais pronostic</h4><ul>
    <li>Cellules épithélioïdes (vs fusiformes)</li>
    <li>Grandes dimensions</li>
    <li>Extension extrasclérale</li>
    <li>Mutation BAP1 (50 % des mélanomes uvéaux → métastases)</li>
    <li>Monosomie chromosome 3</li>
    <li>Localisation antérieure</li>
    <li>Invasion du nerf optique</li>
  </ul></div>
</div>

<div class="subsection-title">Examens complémentaires</div>
<div class="card-grid">
  <div class="card"><h4>Imagerie locale</h4><ul>
    <li>Échographie B : masse acoustiquement silencieuse + excavation choroïdienne + cône d'ombre. Signe du « bouton de col » pathognomonique si présent</li>
    <li>OCT : mesure épaisseur + exsudation sous-rétinienne</li>
    <li>AFG : double circulation (valeur diagnostique limitée)</li>
  </ul></div>
  <div class="card red"><h4>Bilan d'extension</h4><ul>
    <li>Métastases hépatiques (80 %) → IRM hépatique ou échographie</li>
    <li>Bilan hépatique complet (LDH, GGT, PAL)</li>
    <li>Bilan général : TDM thoraco-abdominal</li>
    <li>TEP-FDG si suspicion métastases</li>
  </ul></div>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Selon taille et localisation</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Petits mélanomes (épaisseur ≤3 mm)</strong> : surveillance photographique rapprochée ou thermothérapie transpupillaire (TTT)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Brachythérapie (plaques de ruthénium-106 ou iode-125)</strong> : référence pour la plupart des mélanomes moyens. Taux de contrôle local ~90 %</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Protonthérapie</strong> : tumeurs larges, proches du disque/fovéa</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Énucléation</strong> : tumeurs volumineuses, œil non voyant, pronostic visuel nul</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance des métastases hépatiques à vie (IRM annuelle)</div></div>
</div>`,

    'ch20-retinoblastome': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Rétinoblastome</div>
<div class="page-subtitle">Chapitre 20 · Pages 860–874</div>

<div class="retenir"><strong>À retenir</strong>Le rétinoblastome est la tumeur maligne intraoculaire la plus fréquente chez l'enfant. La leucocorie chez un nourrisson doit faire évoquer un rétinoblastome jusqu'à preuve du contraire. Taux de survie &gt;95 % dans les centres spécialisés.</div>

<div class="section-title">Génétique — «Two hits hypothesis»</div>
<div class="info-box"><strong>Knudson (1971)</strong>Le gène RB1 (13q14) est un gène suppresseur de tumeur. Deux mutations sont nécessaires pour le développement du rétinoblastome.<br>
- <strong>Héréditaire (40 %)</strong> : 1re mutation dans la lignée germinale (toutes les cellules) → 2e mutation somatique → tumeur. Bilatéral, multifocal. Risque d'autres cancers (ostéosarcome, pinéaloblastome = rétinoblastome trilatéral).<br>
- <strong>Sporadique (60 %)</strong> : 2 mutations somatiques dans une cellule rétinienne. Unilatéral, non transmissible.</div>

<div class="section-title">Présentation clinique</div>
<div class="card-grid">
  <div class="card red"><h4>Modes de révélation</h4><ul>
    <li><strong>Leucocorie</strong> (60 %) — reflet pupillaire blanc, remarqué sur photos</li>
    <li><strong>Strabisme</strong> (20 %) — examen FO obligatoire !</li>
    <li>Œil rouge douloureux + glaucome secondaire</li>
    <li>Pseudo-inflammation, hypopion</li>
    <li>Buphtalmie</li>
  </ul></div>
  <div class="card blue"><h4>Classification IIRC (Groupes A–E)</h4><ul>
    <li><strong>A</strong> : petite tumeur distante de la fovéa et du disque</li>
    <li><strong>B</strong> : maculaire ou péripapillaire, sans ensemencement</li>
    <li><strong>C</strong> : avec ensemencement vitréen/sous-rétinien localisé</li>
    <li><strong>D</strong> : ensemencement vitréen/sous-rétinien diffus</li>
    <li><strong>E</strong> : œil envahi &gt;50 % ou glaucome néovasculaire ou envahissement NO</li>
  </ul></div>
</div>

<div class="section-title">Diagnostic différentiel de la leucocorie</div>
<div class="badge-list">
  <span class="badge red">Rétinoblastome +++</span>
  <span class="badge">Maladie de Coats</span>
  <span class="badge">Toxocarose oculaire</span>
  <span class="badge">Persistance du vitré primitif (PHPV)</span>
  <span class="badge">Rétinopathie de la prématurité</span>
  <span class="badge">DR total</span>
  <span class="badge">Cataracte dense</span>
</div>

<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Selon groupe et latéralité</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Groupes A–B</strong> : traitement focal (laser diode, cryothérapie, TTT)</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Groupes C–D</strong> : chimiothérapie systémique (vincristine, étoposide, carboplatine = VEC) + traitement focal</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Groupe E / Envahissement NO</strong> : énucléation + chimiothérapie adjuvante</div></div>
  <div class="protocol-item"><div class="dot"></div><div><strong>Chimiothérapie intra-artérielle</strong> (ophtalmique) : alternative pour sauver l'œil dans les groupes C–D</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance génétique de la fratrie + fond d'œil sous AG régulier jusqu'à 4–5 ans</div></div>
</div>`,

    'ch20-autres': () => `
<div class="page-title"><em>Tumeurs oculaires</em> — Hémangiome, Lymphome & Métastases</div>
<div class="page-subtitle">Chapitre 20 · Pages 874–900</div>

<div class="section-title">Hémangiome choroïdien circonscrit</div>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Adulte 30–50 ans, souvent symptomatique (métamorphopsies, BAV)</li>
    <li>Masse rose-orange en forme de dôme, pôle postérieur</li>
    <li>Surface lisse, sans pigment orange</li>
    <li>AFG : hyperfluorescence précoce intense (« crochet »)</li>
    <li>ICG : wash-out tardif très caractéristique</li>
    <li>DD mélanome amélanotique +++</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>PDT (photodynamique) : traitement de référence</li>
    <li>Anti-VEGF IVT si OME associé</li>
    <li>Radiothérapie si PDT insuffisante</li>
  </ul></div>
</div>

<div class="divider"></div>

<div class="section-title">Lymphome intraoculaire primitif (LIOP)</div>
<div class="alert"><strong>Le grand masquerader</strong>Le LIOP est souvent confondu avec une uvéite chronique. Évoquer chez tout patient &gt;50 ans avec uvéite postérieure réfractaire aux corticoïdes.</div>
<div class="card-grid">
  <div class="card red"><h4>Clinique</h4><ul>
    <li>Grand B (DLBCL) dans 80 %, associé au lymphome du SNC dans 80 %</li>
    <li>Dépôts sous-EPR jaunâtres ± hyalite</li>
    <li>Uvéite postérieure ± antérieure, réfractaire aux corticoïdes</li>
    <li>Résistance ou récidive à l'arrêt des corticoïdes +++</li>
  </ul></div>
  <div class="card"><h4>Diagnostic & Traitement</h4><ul>
    <li>Vitrectomie diagnostique : cytologie (grandes cellules B atypiques) + immunophénotypage + IL-10/IL-6 (&gt;1 = lymphome)</li>
    <li>PCR clonalité IgH (sensibilité 80 %)</li>
    <li>IRM cérébrale systématique</li>
    <li>Traitement : MTX IVT + chimiothérapie systémique si SNC atteint</li>
  </ul></div>
</div>

<div class="divider"></div>

<div class="section-title">Métastases choroïdiennes</div>
<p class="body-text">Les métastases choroïdiennes sont les tumeurs malignes intraoculaires les plus fréquentes chez l'adulte (plus fréquentes que le mélanome). Tumeurs primitives : sein (60 %), poumon (20 %), gastro-intestinal.</p>
<div class="card-grid">
  <div class="card"><h4>Clinique</h4><ul>
    <li>Masse à surface irrégulière, jaune-crème, peu surélevée</li>
    <li>Souvent multifocale ou bilatérale</li>
    <li>DSR exsudatif important</li>
    <li>DD mélanome : pas de pigment orange, surface irrégulière</li>
  </ul></div>
  <div class="card blue"><h4>Traitement</h4><ul>
    <li>Traitement systémique de la tumeur primitive +++</li>
    <li>Radiothérapie externe si symptomatique</li>
    <li>PDT ou brachythérapie si focal</li>
    <li>Pronostic : dépend du cancer primitif</li>
  </ul></div>
</div>`,

    'ch9-sclerite-infectieuse': () => `
<div class="page-title"><em>Épisclère & Sclère</em> — Sclérite infectieuse & Autres</div>
<div class="page-subtitle">Chapitre 9 · Pages 300–305</div>
<div class="section-title">Sclérite infectieuse</div>
<p class="body-text">La sclérite infectieuse est rare mais importante à reconnaître car elle nécessite un traitement antimicrobien spécifique. Elle peut mimer une sclérite dysimmunitaire, avec le risque d'un traitement immunosuppresseur seul délétère.</p>
<div class="card-grid">
  <div class="card red"><h4>Agents responsables</h4><ul>
    <li><strong>Bactéries</strong> : Pseudomonas aeruginosa +++, Staphylococcus, Streptococcus</li>
    <li><strong>Contexte post-chirurgical</strong> : ptérygion opéré (Pseudomonas, Nocardia) — à évoquer systématiquement</li>
    <li><strong>Mycobactéries atypiques</strong> : chirurgie réfractive (LASIK)</li>
    <li><strong>Parasites</strong> : acanthamoeba (rare)</li>
    <li><strong>Viraux</strong> : zona ophtalmique (fréquent), HSV</li>
    <li><strong>Fongiques</strong> : Aspergillus, Fusarium</li>
  </ul></div>
  <div class="card blue"><h4>Bilan</h4><ul>
    <li>Culture de la sclère (si ulcération accessible)</li>
    <li>PCR (virus, Nocardia, mycobactéries)</li>
    <li>Sérologie syphilis, borreliose, TB</li>
    <li>IDR / Quantiféron</li>
    <li>Bilan auto-immun si doute (sclérite mixte)</li>
  </ul></div>
</div>
<div class="section-title">Sclérotique bleue</div>
<p class="body-text">Coloration bleue/grise permanente de la sclère due à l'amincissement scléral, augmentant la transparence et laissant apparaître la choroïde sous-jacente.</p>
<div class="badge-list">
  <span class="badge red">Ostéogenèse imparfaite +++</span>
  <span class="badge">Syndrome d'Ehlers-Danlos</span>
  <span class="badge">Syndrome de Marfan</span>
  <span class="badge">Pseudoxanthome élastique</span>
  <span class="badge">Séquelle de sclérite nécrosante</span>
  <span class="badge gold">Normale chez le nouveau-né (disparaît)</span>
</div>`,

    'ch10-secondaire': () => `
<div class="page-title"><em>Cristallin</em> — Cataractes secondaires & Spéciales</div>
<div class="page-subtitle">Chapitre 10 · Pages 309–311</div>
<div class="section-title">Cataracte secondaire (compliquée)</div>
<p class="body-text">Une cataracte secondaire se développe à la suite d'une autre maladie oculaire primaire.</p>
<table class="kanski-table">
  <tr><th>Étiologie</th><th>Type de cataracte</th></tr>
  <tr><td>Uvéite antérieure chronique</td><td>SCP +++ (corticoïdes + inflammation). Polychrome en AJI</td></tr>
  <tr><td>Glaucome aigu</td><td>Opacités sous-capsulaires antérieures en secteurs (glaucomflecken)</td></tr>
  <tr><td>Haute myopie</td><td>Nucléaire précoce</td></tr>
  <tr><td>Rétinite pigmentaire</td><td>SCP fréquente (80 %)</td></tr>
  <tr><td>Tumeurs intraoculaires</td><td>Cataracte de contact par tumeur du corps ciliaire</td></tr>
  <tr><td>Traumatisme (contusion)</td><td>Rosette post-contusive typique (couronnes radiées)</td></tr>
  <tr><td>Traumatisme (perforant)</td><td>Cataracte totale rapide si capsule rompue</td></tr>
  <tr><td>Chirurgie filtrante (glaucome)</td><td>Cataracte par contact hypotonique</td></tr>
  <tr><td>Rayonnements ionisants</td><td>SCP tardive (cristallin très radiosensible)</td></tr>
</table>
<div class="section-title">Cataracte traumatique</div>
<div class="card-grid">
  <div class="card"><h4>Rosette post-contusive</h4><ul>
    <li>Opacification en « étoile » ou en « rosette » aux sutures capsulaires</li>
    <li>Peut rester stable ou progresser</li>
    <li>Chercher lésion associée : subluxation, iridodialyse, hémorragie</li>
  </ul></div>
  <div class="card red"><h4>Cataracte électrique</h4><ul>
    <li>Électrocution / foudre → opacités sous-capsulaires bilatérales</li>
    <li>Aspect vacuolaire, zone sous-capsulaire antérieure et/ou postérieure</li>
    <li>Peut survenir semaines/mois après le traumatisme</li>
  </ul></div>
</div>`,

    // ── CH15 ENRICHISSEMENT ────────────────────────────────
    'ch15-cones': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Dystrophie des cônes</div>
<div class="page-subtitle">Chapitre 15 · Pages 625–627</div>
<div class="retenir"><strong>À retenir</strong>La dystrophie des cônes se distingue de la RP par l'atteinte initiale des cônes : BAV centrale + dyschromatopsie + photophobie en premier. La nyctalopie est absente ou tardive. ERG : réponse des cônes effondrée, bâtonnets préservés initialement.</div>
<div class="section-title">Introduction</div>
<p class="body-text">Groupe hétérogène de maladies héréditaires affectant principalement les cônes. La majorité des cas sont des dystrophies cône–bâtonnet (cônes atteints en premier, plus sévèrement). Début en général au début de l'âge adulte. Pronostic souvent mauvais (AV finale ≤ 1/10).</p>
<div class="section-title">Diagnostic</div>
<div class="card-grid">
  <div class="card blue"><h4>Symptômes</h4><ul>
    <li>Altération bilatérale progressive de la vision centrale</li>
    <li>Dyschromatopsie sévère (souvent premier symptôme)</li>
    <li>Photophobie (cônes hyperactivés/anormaux)</li>
    <li>Nyctalopie absente au début (bâtonnets intacts)</li>
    <li>Possible éblouissement diurne</li>
  </ul></div>
  <div class="card blue"><h4>Signes au fond d'œil</h4><ul>
    <li>Macula quasi normale ou modifications pigmentaires centrales légères</li>
    <li>Maculopathie en <strong>« œil de bœuf »</strong> (hypopigmentation circulaire autour de la fovéa)</li>
    <li>Reflets dorés (XLR)</li>
    <li>Atrophie géographique maculaire progressive</li>
    <li>Rétrécissement vasculaire et pâleur papillaire TARDIFS</li>
  </ul></div>
</div>
<div class="subsection-title">Étiologies de la maculopathie en « œil de bœuf »</div>
<table class="kanski-table">
  <tr><th>Chez l'adulte</th><th>Chez l'enfant</th></tr>
  <tr><td>Dystrophie des cônes (+++)</td><td>Syndrome de Bardet-Biedl</td></tr>
  <tr><td>Maculopathie à la chloroquine/hydroxychloroquine</td><td>Syndrome de Hallervorden-Spatz</td></tr>
  <tr><td>Maladie de Stargardt avancée</td><td>Amaurose congénitale de Leber</td></tr>
  <tr><td>Dystrophie maculaire annulaire concentrique bénigne</td><td>Céroïde-lipofuscinose neuronale</td></tr>
</table>
<div class="section-title">Examens complémentaires</div>
<div class="card-grid">
  <div class="card"><h4>ERG (clé diagnostique)</h4><ul>
    <li>Réponse photopique (cônes) ↓↓ précocement</li>
    <li>Réponse scotopique (bâtonnets) normale au début</li>
    <li>Ratio onde b photopique / scotopique très altéré</li>
    <li>ERG multifocal : atteinte maculaire prédominante</li>
  </ul></div>
  <div class="card blue"><h4>Imagerie</h4><ul>
    <li>AF : anneau hyperautofluorescent périfovéal (motif concentrique) — très caractéristique</li>
    <li>AFG : aspect en œil de bœuf</li>
    <li>OCT : amincissement des couches externes de la macula</li>
  </ul></div>
</div>`,

    'ch15-acl': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Amaurose congénitale de Leber</div>
<div class="page-subtitle">Chapitre 15 · Pages 624–625</div>
<div class="retenir"><strong>À retenir</strong>L'ACL est la cause la plus fréquente de déficience visuelle héréditaire chez l'enfant. ERG non enregistrable dès la naissance. Le syndrome oculodigital (frottement des yeux) est évocateur. La mutation RPE65 ouvre l'accès à la thérapie génique (Luxturna).</div>
<div class="section-title">Définition & Génétique</div>
<p class="body-text">Dystrophie sévère de type bâtonnet–cône, autosomique récessive dans la grande majorité des cas. Hétérogénéité génétique extrême : au moins 23 gènes identifiés (RPE65, GUCY2D, CEP290, CRX, RDH12, RPGRIP1…). Le gène RPE65 est impliqué dans 5–10 % des cas.</p>
<div class="section-title">Clinique</div>
<div class="card-grid">
  <div class="card red"><h4>Présentation initiale</h4><ul>
    <li>Cécité dès la naissance ou dans les premiers mois de vie</li>
    <li>Nystagmus pendulaire ou erratique</li>
    <li>Photophobie</li>
    <li>Réflexes pupillaires absents ou très diminués</li>
    <li><strong>Syndrome oculodigital</strong> : frottement constant des yeux → atrophie graisse orbitaire → énophtalmie + kératocône/kératoglobe</li>
  </ul></div>
  <div class="card"><h4>Fond d'œil</h4><ul>
    <li>Peut être NORMAL en début de vie</li>
    <li>Légère RP périphérique « poivre et sel »</li>
    <li>Pigmentation maculaire sévère ou atrophie colobomateuse</li>
    <li>Drusen papillaires fréquents</li>
    <li>RP diffuse, atrophie optique, rétrécissement artériel en évoluant</li>
  </ul></div>
</div>
<div class="section-title">Associations systémiques</div>
<div class="badge-list">
  <span class="badge">Déficience intellectuelle</span><span class="badge">Surdité</span>
  <span class="badge">Épilepsie</span><span class="badge">Anomalies SNC</span>
  <span class="badge">Néphronophtise (Joubert, Senior-Løken)</span>
  <span class="badge">Malformations squelettiques</span>
</div>
<div class="section-title">Traitement</div>
<div class="protocol">
  <h4>Thérapie génique — Luxturna (RPE65)</h4>
  <div class="protocol-item"><div class="dot"></div><div><strong>Voretigene neparvovec (Luxturna)</strong> : AMM FDA 2017, EMA 2018. Injection sous-rétinienne d'un vecteur AAV2 portant une copie fonctionnelle du gène RPE65. Amélioration significative de la sensibilité lumineuse et du champ visuel dans les yeux avec cellules rétiniennes encore viables</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Indication : patients avec mutations bialléliques de RPE65 et cellules rétiniennes viables résiduelles</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Meilleure efficacité si traité tôt (avant atrophie avancée)</div></div>
</div>`,

    'ch15-choroides': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Dystrophies choroïdiennes & Rétinoschisis</div>
<div class="page-subtitle">Chapitre 15 · Pages 636–648</div>
<div class="section-title">Choroïdérémie</div>
<div class="retenir"><strong>À retenir</strong>XLR (gène CHM). Dégénérescence diffuse progressive de la choroïde, de l'EPR et des photorécepteurs. La fovéa est épargnée jusqu'à un stade avancé — caractéristique clé.</div>
<div class="card-grid">
  <div class="card"><h4>Clinique hommes</h4><ul>
    <li>Nyctalopie débutant à l'adolescence</li>
    <li>Atrophie EPR et choroïde en moyenne périphérie → centralisation progressive</li>
    <li>Phase terminale : vaisseaux choroïdiens isolés sur sclère à nu</li>
    <li>Perte visuelle sévère à partir de la 6e décennie</li>
    <li>ERG scotopique non enregistrable précocement</li>
  </ul></div>
  <div class="card"><h4>Porteuses (femmes)</h4><ul>
    <li>Atrophie légère et inégale de l'EPR périphérique</li>
    <li>Mottes pigmentaires</li>
    <li>AV, champ visuel et ERG généralement NORMAUX</li>
  </ul></div>
</div>
<div class="info-box"><strong>Thérapie génique</strong>Premiers essais cliniques prometteurs d'injection sous-rétinienne du gène CHM. Résultats préliminaires encourageants sur la préservation de l'AV.</div>

<div class="divider"></div>
<div class="section-title">Atrophie gyrée de la choroïde</div>
<p class="body-text">Autosomique récessive (gène OAT, chromosome 10). Accumulation d'ornithine → dégénérescence choriorétinienne. Zones circulaires d'atrophie choriorétinienne bien délimitées se développant en moyenne périphérie et coalescent progressivement. Épargne fovéale jusqu'au stade avancé.</p>
<div class="badge-list">
  <span class="badge">Myopie + nyctalopie à l'adolescence</span>
  <span class="badge red">Ornithine sérique ↑↑ (diagnostic)</span>
  <span class="badge gold">Vitamine B6 si répondeur (normalise ornithine)</span>
  <span class="badge">Régime restreint en arginine</span>
  <span class="badge">Cataracte précoce + OMC</span>
</div>

<div class="divider"></div>
<div class="section-title">Rétinoschisis juvénile lié à l'X</div>
<div class="retenir"><strong>À retenir</strong>XLR (gène RS1, retinoschisin). Schisis des couches internes de la rétine. Signe classique : maculopathie en « rayons de roue ». ERG : réduction élective de l'onde b (négatif dans les formes sévères).</div>
<div class="card-grid">
  <div class="card blue"><h4>Clinique (garçons 5–10 ans)</h4><ul>
    <li>Difficultés de lecture (atteinte maculaire)</li>
    <li>Strabisme ou nystagmus si schisis périphérique sévère</li>
    <li>Maculopathie en rayons de roue autour de la fovéa (stries cystoïdes)</li>
    <li>Schisis périphérique (50 %) : quadrant inférotemporal. Trous ovales dans la couche interne</li>
    <li>Lésions dendritiques périphériques argentées</li>
  </ul></div>
  <div class="card red"><h4>Complications</h4><ul>
    <li>Hémorragie intravitréenne</li>
    <li>Décollement de rétine rhegmatogène (rare)</li>
    <li>Traction vitréenne, DR tractionnel</li>
    <li>Rupture traumatique du schisis fovéal</li>
  </ul></div>
</div>
<div class="protocol">
  <h4>Traitement</h4>
  <div class="protocol-item"><div class="dot"></div><div>Inhibiteurs de l'anhydrase carbonique topiques ou systémiques (acétazolamide) : peuvent réduire le schisis maculaire</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Vitrectomie si DR ou hémorragie vitréenne persistante</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Thérapie génique (RS1) : en cours d'essais cliniques</div></div>
</div>`,

    'ch15-stickler': () => `
<div class="page-title"><em>Dystrophies rétiniennes</em> — Syndrome de Stickler & Vitréorétinopathies</div>
<div class="page-subtitle">Chapitre 15 · Pages 643–648</div>
<div class="retenir"><strong>À retenir</strong>Le syndrome de Stickler est la cause héréditaire la plus fréquente de décollement de rétine chez l'enfant. DR dans 50 % des cas avant 10 ans, souvent déchirure géante sur 360°.</div>
<div class="section-title">Syndrome de Stickler</div>
<div class="card-grid">
  <div class="card"><h4>Types (gènes collagène)</h4><ul>
    <li><strong>STL1</strong> (COL2A1, AD) : type membraneux. Le + fréquent. Vitré optiquement vide + membrane rétrolenticulaire</li>
    <li><strong>STL2</strong> (COL11A1, AD) : type perlé. Vitré fibrillaire et perlé. Surdité neurosensorielle</li>
    <li><strong>STL3</strong> (COL11A2) : type non oculaire. Pas d'atteinte oculaire</li>
    <li><strong>STL4/5</strong> : autosomique récessif, très rare</li>
  </ul></div>
  <div class="card red"><h4>Manifestations cliniques</h4><ul>
    <li>Myopie forte congénitale</li>
    <li>Dégénérescence vitréorétinienne (palissadique)</li>
    <li>DR précoce dans la 1re décennie (déchirures géantes)</li>
    <li>Cataracte corticale périphérique</li>
    <li>Glaucome (5–10 %)</li>
    <li>Manifestations systémiques : hypoplasie de l'étage moyen, Pierre-Robin, surdité, hyperlaxité articulaire</li>
  </ul></div>
</div>
<div class="protocol">
  <h4>Traitement & Surveillance</h4>
  <div class="protocol-item"><div class="dot"></div><div>Laser rétinien prophylactique sur 360° ou cryothérapie pour réduire le risque de DR</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Surveillance régulière à vie avec traitement prophylactique des déchirures</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Vitrectomie si DR (PVR fréquente, récidive possible)</div></div>
  <div class="protocol-item"><div class="dot"></div><div>Conseil génétique + dépistage de la fratrie</div></div>
</div>`,
